<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="vendor/d3-delaunay.min.js"></script>
    <style>
      :root {
        --bg: #0d0d0e;
        --ink: #ece7dc;
        --sub: #8b867c;
        --dim: #5d5952;
        --paper: #e4dac2;
        --gfp: #3fd35c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
        font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
      }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

      /* ---------- scene 1: dark iris window ---------- */
      #w1 {
        --d: 880px;
        position: absolute; left: 960px; top: 540px; width: var(--d); height: var(--d);
        margin-left: calc(var(--d) / -2); margin-top: calc(var(--d) / -2);
        border-radius: 50%; overflow: hidden; background: #000;
        box-shadow: 0 0 0 3px #030303, 0 0 70px 14px rgba(0, 0, 0, 0.85);
      }
      .im { position: absolute; left: 50%; top: 50%; width: 1200px; height: 1200px; margin: -600px 0 0 -600px; opacity: 0; }
      #rim1 {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 50%; pointer-events: none;
        box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.9), inset 0 0 calc(var(--d) * 0.07) calc(var(--d) * 0.018) rgba(0, 0, 0, 0.72);
      }

      /* ---------- scene 2: paper scan window ---------- */
      #w2 {
        --d: 70px;
        position: absolute; left: 960px; top: 540px; width: var(--d); height: var(--d);
        margin-left: calc(var(--d) / -2); margin-top: calc(var(--d) / -2);
        border-radius: 50%; overflow: hidden; opacity: 0; z-index: 2;
        background: radial-gradient(circle at 46% 40%, #ebe2cc 0%, #e2d7be 62%, #d6caae 100%);
        box-shadow: 0 0 0 2px #050505, 0 0 60px 10px rgba(0, 0, 0, 0.8);
      }
      #plate { position: absolute; left: 50%; top: 50%; width: 1200px; height: 1200px; margin: -600px 0 0 -600px; }
      #phase { position: absolute; left: 0; top: 0; width: 1200px; height: 1200px; }
      .gfp { position: absolute; opacity: 0; }
      #scan {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none;
        background-image: repeating-linear-gradient(180deg, rgba(36, 30, 20, 0.2) 0px, rgba(36, 30, 20, 0.2) 1.5px, rgba(0, 0, 0, 0) 1.5px, rgba(0, 0, 0, 0) 4px);
        background-position: 0px 0px;
      }
      #rim2 {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 50%; pointer-events: none;
        box-shadow: inset 0 0 0 2px rgba(30, 24, 14, 0.65), inset 0 0 calc(var(--d) * 0.05) calc(var(--d) * 0.01) rgba(60, 46, 24, 0.45);
      }

      /* ---------- HUD ---------- */
      .hud { position: absolute; white-space: pre; }
      #brand { left: 72px; top: 58px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); display: flex; align-items: center; gap: 10px; }
      #brand i { display: block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--paper); }
      #brand span { font-weight: 400; color: var(--sub); }
      #xy { right: 72px; top: 60px; font-family: "JetBrains Mono", monospace; font-size: 14px; color: var(--sub); text-align: right; }
      #capA { left: 72px; bottom: 94px; font-size: 24px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); }
      #capB { left: 72px; bottom: 62px; font-family: "JetBrains Mono", monospace; font-size: 16px; color: var(--sub); }
      #sb { right: 72px; bottom: 64px; width: 240px; height: 40px; }
      #sbL { position: absolute; right: 0; bottom: 14px; font-family: "JetBrains Mono", monospace; font-size: 14px; color: var(--sub); }
      #sbBar { position: absolute; right: 0; bottom: 0; width: 120px; height: 3px; background: var(--ink); }

      #cnt { right: 72px; bottom: 140px; text-align: right; opacity: 0; }
      #cntTop { font-size: 16px; font-weight: 500; color: var(--sub); display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
      #cntTop i { display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--gfp); }
      #cntRow { margin-top: 0px; line-height: 44px; display: flex; align-items: baseline; justify-content: flex-end; gap: 10px; }
      #cntN { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; color: var(--gfp); font-variant-numeric: tabular-nums; }
      #cntOf { font-size: 18px; color: var(--sub); }

      /* ---------- end lockup ---------- */
      #hole { opacity: 0; z-index: 3; position: absolute; left: 752px; top: 467px; width: 96px; height: 96px; border-radius: 50%; background: var(--bg); }
      #dot { opacity: 0; z-index: 4; position: absolute; left: 803px; top: 518px; width: 20px; height: 20px; border-radius: 50%; background: var(--gfp); }
      #wmWrap { position: absolute; left: 800px; top: 448px; height: 140px; width: 500px; overflow: hidden; z-index: 1; }
      #wm { opacity: 0; position: absolute; left: 78px; top: 0; font-size: 116px; line-height: 134px; font-weight: 600; letter-spacing: -0.035em; color: var(--ink); }
      #sub { opacity: 0; position: absolute; left: 0; top: 622px; width: 1920px; text-align: center; font-size: 28px; line-height: 38px; font-weight: 400; letter-spacing: -0.01em; color: var(--sub); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11" data-width="1920" data-height="1080">
      <div id="stage" class="clip full" data-start="0" data-duration="11" data-track-index="0" data-layout-allow-overlap>
        <div id="w1"><div id="rim1"></div></div>
        <div id="w2">
          <div id="plate"></div>
          <div id="scan"></div>
          <div id="rim2"></div>
        </div>

        <div id="brand" class="hud"><i></i>Loupe M2 <span>Live view</span></div>
        <div id="xy" class="hud">X 14.208  Y 3.551 mm</div>
        <div id="capA" class="hud">Human colon, H&amp;E</div>
        <div id="capB" class="hud">Brightfield   20× / 0.75 NA   1/250 s</div>
        <div id="sb" class="hud"><div id="sbL">50 µm</div><div id="sbBar"></div></div>
        <div id="cnt" class="hud">
          <div id="cntTop"><i></i>Auto-count   H2B-GFP</div>
          <div id="cntRow"><span id="cntN">0</span><span id="cntOf">GFP+ of 1,284 nuclei</span></div>
        </div>

        <div id="hole"></div>
        <div id="dot"></div>
        <div id="wmWrap"><div id="wm">Loupe</div></div>
        <div id="sub">Digital microscope with on-device cell counting.</div>
      </div>
    </div>

    <script>
/*GEN-START*/
      /* ============================================================
         Procedural micrographs. Every image is drawn once at load into a
         1200×1200 canvas from a fixed seed, so seeking only toggles which
         canvas is visible.
         ============================================================ */
      const S = 1200, TAU = Math.PI * 2;
      function RNG(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      function Noise(seed) {
        const r = RNG(seed * 7 + 3); const g = new Float32Array(65536); for (let i = 0; i < 65536; i++) g[i] = r();
        const h = (x, y) => g[((x & 255) << 8) | (y & 255)];
        const f = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
        f.fbm = (x, y, o = 4) => { let s = 0, amp = 0.5, fr = 1, n = 0; for (let i = 0; i < o; i++) { s += amp * f(x * fr + i * 17.3, y * fr - i * 9.1); n += amp; amp *= 0.5; fr *= 2.03; } return s / n; };
        return f;
      }
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const lerp = (a, b, t) => a + (b - a) * t;
      const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
      const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
      function mk(w = S, h = S) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
      function field(w, h, fn) {
        const c = mk(w, h), x = c.getContext("2d"), im = x.createImageData(w, h), d = im.data, o = [0, 0, 0, 255];
        let i = 0;
        for (let y = 0; y < h; y++) for (let X = 0; X < w; X++) { o[3] = 255; fn(X / w, y / h, o); d[i] = o[0]; d[i + 1] = o[1]; d[i + 2] = o[2]; d[i + 3] = o[3]; i += 4; }
        x.putImageData(im, 0, 0); return c;
      }
      function blit(ctx, c, op = "source-over", a = 1, filter = "none", dx = 0, dy = 0) {
        ctx.save(); ctx.globalCompositeOperation = op; ctx.globalAlpha = a; ctx.filter = filter;
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high"; ctx.drawImage(c, dx, dy, S, S); ctx.restore();
      }
      const GRAIN = (() => { const r = RNG(99); return field(600, 600, (u, v, o) => { const g = 128 + (r() * 2 - 1) * 60; o[0] = o[1] = o[2] = g; }); })();
      function finish(ctx, { dark = false, blur = 0.6, vig = true, grain = 1 } = {}) {
        if (blur) { const t = mk(); t.getContext("2d").drawImage(ctx.canvas, 0, 0); ctx.save(); ctx.filter = `blur(${blur}px)`; ctx.drawImage(t, 0, 0); ctx.restore(); }
        if (vig && !dark) {
          const g = ctx.createRadialGradient(S * 0.47, S * 0.45, S * 0.12, S / 2, S / 2, S * 0.78);
          g.addColorStop(0, "rgb(255,255,255)"); g.addColorStop(1, "rgb(196,192,186)");
          ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = g; ctx.fillRect(0, 0, S, S); ctx.restore();
        }
        ctx.save(); ctx.globalCompositeOperation = dark ? "screen" : "overlay"; ctx.globalAlpha = (dark ? 0.05 : 0.32) * grain; ctx.drawImage(GRAIN, 0, 0, S, S); ctx.restore();
      }
      function smoothPath(ctx, P) {
        const n = P.length; const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        const s = m(P[n - 1], P[0]); ctx.beginPath(); ctx.moveTo(s[0], s[1]);
        for (let i = 0; i < n; i++) { const q = m(P[i], P[(i + 1) % n]); ctx.quadraticCurveTo(P[i][0], P[i][1], q[0], q[1]); }
        ctx.closePath();
      }
      function linePath(ctx, P) { ctx.beginPath(); P.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); }
      function blobPts(cx, cy, rx, ry, rot, irr, R, n = 10) {
        const c = Math.cos(rot), s = Math.sin(rot), P = [];
        for (let i = 0; i < n; i++) { const a = (i / n) * TAU, k = 1 + irr * (R() * 2 - 1); const x = Math.cos(a) * rx * k, y = Math.sin(a) * ry * k; P.push([cx + x * c - y * s, cy + x * s + y * c]); }
        return P;
      }
      function ell(ctx, x, y, rx, ry, rot, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); ctx.fill(); }
      function place(R, n, minD, lo = 0, hi = S, tries = 4000, radii) {
        const out = [];
        for (let t = 0; t < tries && out.length < n; t++) {
          const r = radii ? radii(R) : 0; const p = { x: lerp(lo, hi, R()), y: lerp(lo, hi, R()), r };
          if (out.every((q) => Math.hypot(q.x - p.x, q.y - p.y) > (radii ? (q.r + p.r) * minD : minD))) out.push(p);
        }
        return out;
      }
      function jgrid(R, sp, lo, hi, jit = 0.45) { const P = []; for (let y = lo; y < hi; y += sp) for (let x = lo; x < hi; x += sp) P.push([x + (R() - 0.5) * sp * jit * 2, y + (R() - 0.5) * sp * jit * 2]); return P; }
      function vor(P, b = [-200, -200, S + 200, S + 200]) { return d3.Delaunay.from(P).voronoi(b); }
      function cent(poly) { let x = 0, y = 0; const n = poly.length - 1; for (let i = 0; i < n; i++) { x += poly[i][0]; y += poly[i][1]; } return [x / n, y / n]; }
      function shrink(poly, d) {
        const c = cent(poly); const out = [];
        for (let i = 0; i < poly.length - 1; i++) { const p = poly[i]; const dx = p[0] - c[0], dy = p[1] - c[1]; const L = Math.hypot(dx, dy) || 1; const k = Math.max(0, 1 - d / L); out.push([c[0] + dx * k, c[1] + dy * k]); }
        return out;
      }

      /* ---------- 1. Human colon, H&E ---------- */
      function gHE(ctx, R, N) {
        blit(ctx, field(300, 300, (u, v, o) => { const f = N.fbm(u * 5, v * 5, 5), s = N.fbm(u * 2 + 3, v * 14, 4); const t = clamp((0.55 * f + 0.45 * s - 0.32) * 2.3); o[0] = 250 - 30 * t; o[1] = 230 - 95 * t; o[2] = 238 - 58 * t; }));
        ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.lineCap = "round";
        for (let i = 0; i < 320; i++) {
          let x = R() * S, y = R() * S, a = (R() - 0.5) * 0.7 + 0.4;
          ctx.strokeStyle = rgba([205 + R() * 30, 120 + R() * 40, 170 + R() * 30], 0.25 + R() * 0.3); ctx.lineWidth = 1 + R() * 2.2;
          ctx.beginPath(); ctx.moveTo(x, y);
          for (let k = 0; k < 14; k++) { a += (N(x * 0.01, y * 0.01) - 0.5) * 0.6; x += Math.cos(a) * 13; y += Math.sin(a) * 13; ctx.lineTo(x, y); }
          ctx.stroke();
        }
        for (let i = 0; i < 900; i++) ell(ctx, R() * S, R() * S, 3 + R() * 3.5, 2 + R() * 2, R() * TAU, rgba([70 + R() * 35, 30 + R() * 25, 115 + R() * 30], 0.5 + R() * 0.4));
        ctx.restore();
        const crypts = place(R, 13, 1.25, -60, S + 60, 3000, (r) => 95 + r() * 60);
        for (const c of crypts) {
          const rot = R() * TAU, ry = 0.55 + R() * 0.35;
          const outer = blobPts(c.x, c.y, c.r, c.r * ry, rot, 0.07, R, 16);
          smoothPath(ctx, outer); ctx.fillStyle = rgba([236, 184, 218], 0.95); ctx.fill();
          ctx.strokeStyle = rgba([185, 95, 155], 0.55); ctx.lineWidth = 2; ctx.stroke();
          for (let g = 0; g < 34; g++) {
            const a = R() * TAU, k = 0.6 + R() * 0.28; const x = Math.cos(a) * c.r * k, y = Math.sin(a) * c.r * ry * k;
            const X = c.x + x * Math.cos(rot) - y * Math.sin(rot), Y = c.y + x * Math.sin(rot) + y * Math.cos(rot);
            ell(ctx, X, Y, 6 + R() * 5, 6 + R() * 5, 0, rgba([252, 246, 250], 0.85));
          }
          smoothPath(ctx, blobPts(c.x, c.y, c.r * 0.42, c.r * ry * 0.38, rot, 0.18, R, 12)); ctx.fillStyle = "rgb(252,247,250)"; ctx.fill();
          ctx.save(); ctx.globalCompositeOperation = "multiply";
          const n = Math.round((TAU * c.r * (1 + ry)) / 2 / 7.5);
          for (let k = 0; k < n; k++) {
            const a = (k / n) * TAU + R() * 0.03, kk = 0.84 + R() * 0.1;
            const x = Math.cos(a) * c.r * kk, y = Math.sin(a) * c.r * ry * kk;
            const X = c.x + x * Math.cos(rot) - y * Math.sin(rot), Y = c.y + x * Math.sin(rot) + y * Math.cos(rot);
            const ang = Math.atan2(Y - c.y, X - c.x);
            ell(ctx, X, Y, 8 + R() * 3, 3 + R() * 1.2, ang, rgba([62 + R() * 20, 24 + R() * 15, 108 + R() * 25], 0.88));
          }
          ctx.restore();
        }
        finish(ctx, { blur: 0.8 });
      }

      /* ---------- 2. Blood smear ---------- */
      function gBlood(ctx, R, N) {
        blit(ctx, field(200, 200, (u, v, o) => { const f = N.fbm(u * 4, v * 4, 4) - 0.5; o[0] = 244 + f * 10; o[1] = 230 + f * 14; o[2] = 226 + f * 12; }));
        const cells = place(R, 340, 54, -40, S + 40, 9000);
        ctx.save(); ctx.globalCompositeOperation = "multiply";
        for (const c of cells) {
          const r = 30 + R() * 6;
          ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(R() * TAU); ctx.scale(1, 0.88 + R() * 0.14);
          const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
          g.addColorStop(0, rgba([240, 196, 196], 0.4)); g.addColorStop(0.36, rgba([236, 172, 172], 0.5)); g.addColorStop(0.66, rgba([226, 128, 136], 0.88)); g.addColorStop(0.92, rgba([212, 104, 116], 0.96)); g.addColorStop(1, rgba([212, 104, 116], 0));
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
          ctx.strokeStyle = rgba([165, 70, 90], 0.3); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(0, 0, r * 0.93, 0, TAU); ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
        const wbc = [[S * 0.36, S * 0.42], [S * 0.7, S * 0.68]];
        wbc.forEach(([x, y], i) => {
          if (i === 0) {
            ell(ctx, x, y, 56, 54, 0, rgba([224, 200, 228], 0.97));
            for (let k = 0; k < 160; k++) { const a = R() * TAU, d = Math.sqrt(R()) * 50; ell(ctx, x + Math.cos(a) * d, y + Math.sin(a) * d, 1.4, 1.4, 0, rgba([175, 120, 185], 0.5)); }
            ctx.save(); ctx.globalCompositeOperation = "multiply";
            const lobes = [[-22, -10, 17], [-2, -22, 15], [18, -6, 17], [8, 18, 15]];
            ctx.strokeStyle = rgba([95, 45, 140], 0.9); ctx.lineWidth = 7; ctx.beginPath(); lobes.forEach(([a, b], k) => (k ? ctx.lineTo(x + a, y + b) : ctx.moveTo(x + a, y + b))); ctx.stroke();
            lobes.forEach(([a, b, r]) => { smoothPath(ctx, blobPts(x + a, y + b, r, r * 0.82, R() * TAU, 0.12, R, 9)); ctx.fillStyle = rgba([92, 42, 138], 0.93); ctx.fill(); });
            ctx.restore();
          } else {
            ell(ctx, x, y, 44, 42, 0, rgba([176, 196, 232], 0.95));
            ctx.save(); ctx.globalCompositeOperation = "multiply";
            smoothPath(ctx, blobPts(x - 4, y + 2, 36, 34, 0, 0.06, R, 12)); ctx.fillStyle = rgba([78, 38, 136], 0.95); ctx.fill();
            ctx.restore();
          }
        });
        ctx.save(); ctx.globalCompositeOperation = "multiply";
        for (let i = 0; i < 22; i++) { const x = R() * S, y = R() * S, n = 2 + ((R() * 5) | 0); for (let k = 0; k < n; k++) ell(ctx, x + (R() - 0.5) * 12, y + (R() - 0.5) * 12, 2 + R() * 1.5, 1.6 + R(), R() * 3, rgba([140, 80, 170], 0.8)); }
        ctx.restore();
        finish(ctx, { blur: 0.7 });
      }

      /* ---------- 3. Onion epidermis, iodine ---------- */
      function gOnion(ctx, R, N) {
        const K = 3.6, P = [];
        for (let j = 0, y = -300; y < S + 300; j++, y += 66) for (let x = -500 + (j % 2) * 120; x < S + 500; x += 240) P.push([(x + (R() - 0.5) * 110) / K, y + (R() - 0.5) * 22]);
        const v = d3.Delaunay.from(P).voronoi([-600 / K, -400, (S + 600) / K, S + 400]);
        ctx.fillStyle = "rgb(150,104,46)"; ctx.fillRect(0, 0, S, S);
        ctx.save(); ctx.translate(S / 2, S / 2); ctx.rotate(-0.17); ctx.translate(-S / 2, -S / 2);
        for (let i = 0; i < P.length; i++) {
          const poly = v.cellPolygon(i); if (!poly) continue;
          const pp = poly.map(([x, y]) => [x * K, y]);
          const c = cent(pp); const sh = shrink(pp, 3.2);
          const t = R();
          const g = ctx.createLinearGradient(c[0] - 120, c[1], c[0] + 120, c[1]);
          const base = [236 - t * 14, 210 - t * 20, 146 - t * 20];
          g.addColorStop(0, rgba(mixc(base, [210, 170, 100], 0.4), 1)); g.addColorStop(0.5, rgba(base, 1)); g.addColorStop(1, rgba(mixc(base, [210, 170, 100], 0.5), 1));
          linePath(ctx, sh); ctx.fillStyle = g; ctx.fill();
          ctx.strokeStyle = rgba([255, 240, 200], 0.35); ctx.lineWidth = 1.2; ctx.stroke();
          if (R() < 0.82) {
            const nx = c[0] + (R() - 0.5) * 120, ny = c[1] + (R() - 0.5) * 18;
            ell(ctx, nx, ny, 17 + R() * 4, 12 + R() * 2, (R() - 0.5) * 0.4, rgba([176, 124, 58], 0.9));
            ctx.strokeStyle = rgba([120, 78, 30], 0.6); ctx.lineWidth = 1.5; ctx.stroke();
            ell(ctx, nx + (R() - 0.5) * 8, ny + (R() - 0.5) * 5, 3.5, 3, 0, rgba([110, 70, 28], 0.85));
          }
        }
        ctx.restore();
        blit(ctx, field(200, 200, (u, v2, o) => { const f = N.fbm(u * 6, v2 * 6, 4); o[0] = o[1] = o[2] = 215 + f * 40; }), "multiply");
        finish(ctx, { blur: 0.9 });
      }

      /* ---------- 4. Leaf epidermis with stomata ---------- */

      /* ---------- 6. Cultured cells, fluorescence (shared layout with scene 2) ---------- */
      const CULT = (() => {

      /* ---------- 7. Gabbro thin section, cross-polarized ---------- */
      const MLP = [[18, 18, 20], [88, 88, 90], [168, 168, 164], [226, 224, 214], [238, 228, 176], [236, 198, 96], [224, 142, 64], [198, 72, 86], [152, 62, 150], [82, 82, 200], [62, 142, 212], [72, 190, 172], [142, 206, 98], [222, 214, 92], [228, 152, 112], [202, 112, 172], [122, 132, 202], [112, 190, 190]];
      const mlp = (t) => { t = clamp(t) * (MLP.length - 1); const i = Math.min(MLP.length - 2, Math.floor(t)); return mixc(MLP[i], MLP[i + 1], t - i); };
      function gRock(ctx, R, N) {
        const P = [];
        for (let i = 0; i < 105; i++) P.push([R() * (S + 300) - 150, R() * (S + 300) - 150]);
        for (let c = 0; c < 3; c++) { const cx = R() * S, cy = R() * S; for (let i = 0; i < 12; i++) P.push([cx + (R() - 0.5) * 240, cy + (R() - 0.5) * 240]); }

        const wob = (poly) => { const out = []; for (let i = 0; i < poly.length - 1; i++) { const a = poly[i], b = poly[i + 1], n = Math.max(2, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 6)); for (let k = 0; k < n; k++) { const t = k / n; out.push(disp(lerp(a[0], b[0], t), lerp(a[1], b[1], t))); } } return out; };

          const W = wob(poly), cc = cent(poly);
          let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; W.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
          const o = R() < 0.35 ? 0.03 + R() * 0.16 : 0.24 + R() * 0.68, ang = R() * TAU;

            for (let s2 = 0; s2 < sets; s2++) {

              ctx.save(); ctx.translate(cc[0], cc[1]); ctx.rotate(a);
              for (let t = -280; t < 280; t += sp * (0.6 + R() * 0.8)) { ctx.strokeStyle = rgba([12, 10, 8], 0.2 + R() * 0.35); ctx.setLineDash([8 + R() * 70, 3 + R() * 16]); ctx.lineDashOffset = R() * 80; ctx.beginPath(); ctx.moveTo(-280, t + (R() - 0.5) * 2); ctx.lineTo(280, t + (R() - 0.5) * 2); ctx.stroke(); }

            for (let t = -280; t < 280; t += w * 2) ctx.fillRect(t + R() * 3, -280, w * (0.6 + R() * 0.7), 560);
            ctx.restore();
          }
          if (R() < 0.35) { const g2 = ctx.createRadialGradient(cc[0] + (R() - 0.5) * 80, cc[1] + (R() - 0.5) * 80, 0, cc[0], cc[1], 170); g2.addColorStop(0, "rgba(0,0,0,0.5)"); g2.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = g2; ctx.fillRect(x0, y0, x1 - x0, y1 - y0); }
          ctx.restore();
          linePath(ctx, W); ctx.strokeStyle = "rgba(10,8,6,0.85)"; ctx.lineWidth = 1.5; ctx.stroke();
        }
        for (let i = 0; i < 70; i++) { smoothPath(ctx, blobPts(R() * S, R() * S, 2 + R() * 6, 2 + R() * 5, R() * 3, 0.35, R, 7)); ctx.fillStyle = "rgb(10,8,7)"; ctx.fill(); }
        blit(ctx, field(300, 300, (u, v2, o) => { const f = N.fbm(u * 14, v2 * 14, 3); o[0] = o[1] = o[2] = 212 + f * 43; }), "multiply");

        finish(ctx, { blur: 0.9, vig: false });
      }

      /* ---------- 8. Hibiscus pollen ---------- */
      function gPollen(ctx, R, N) {
        blit(ctx, field(200, 200, (u, v, o) => { const f = N.fbm(u * 3, v * 3, 4); o[0] = 212 + f * 22; o[1] = 224 + f * 16; o[2] = 186 + f * 20; }));

        };

      /* ---------- 9. Gram stain ---------- */
      function gGram(ctx, R, N) {
        blit(ctx, field(200, 200, (u, v, o) => { const f = N.fbm(u * 4, v * 4, 4); o[0] = 240 + f * 12; o[1] = 222 + f * 16; o[2] = 228 + f * 12; }));

        }

      /* ---------- 10. Ascorbic acid crystals, polarized ---------- */

        const L = mk(), x = L.getContext("2d");
        const POL = 0.3;
        const needle = (x0, y0, a, len, w, t0, t1, alpha) => {
