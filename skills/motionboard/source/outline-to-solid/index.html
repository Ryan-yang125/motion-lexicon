    <script type="module">
      import * as THREE from "three";
      import Delaunator from "delaunator";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      /* ================= helpers ================= */
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const seg = (t, a, b) => clamp01((t - a) / (b - a));
      const power2InOut = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
      const sineInOut = (k) => -(Math.cos(Math.PI * k) - 1) / 2;
      const power2In = (k) => k * k;
      const smooth = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };

      /* ================= renderer ================= */
      const OW = 1920, OH = 1080, SS = 2;
      const RW = OW * SS, RH = OH * SS;
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, preserveDrawingBuffer: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(1);
      renderer.setSize(OW, OH, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      const camera = new THREE.PerspectiveCamera(18, OW / OH, 1, 400);

      function canvasTex(w, h, draw, srgb = false) {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        draw(c.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
        t.anisotropy = 8;
        t.needsUpdate = true;
        return t;
      }
      let seed = 0x2545f491;
      const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

      // closed polyline utilities (points {x,y}); outward normals for clockwise loops
      function withNormalsCW(pts) {
        const N = pts.length;
        for (let i = 0; i < N; i++) {
          const a = pts[(i - 1 + N) % N], b = pts[(i + 1) % N];
          const tx = b.x - a.x, ty = b.y - a.y, l = Math.hypot(tx, ty) || 1;
          pts[i].nx = -ty / l; pts[i].ny = tx / l;
        }
        return pts;
      }
      function pointInPoly(x, y, poly) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const a = poly[i], b = poly[j];
          if ((a.y > y) !== (b.y > y) && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
        }
        return inside;
      }
      function distToPoly(x, y, poly) {
        let d = 1e9;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const a = poly[j], b = poly[i];
          const vx = b.x - a.x, vy = b.y - a.y, wx = x - a.x, wy = y - a.y;
          const t = clamp01((vx * wx + vy * wy) / (vx * vx + vy * vy || 1));
          d = Math.min(d, Math.hypot(wx - vx * t, wy - vy * t));
        }
        return d;
      }

      /* ================= body outline =================
         right half, top centre -> bottom centre (clockwise, y up). Left half mirrors it. */
      const RIGHT = [
        [0, 3.0], [2.0, 3.08], [3.9, 3.42], [5.4, 3.52], [6.6, 3.18], [7.3, 2.2], [7.6, 0.6],
        [7.75, -1.3], [7.7, -3.3], [7.32, -4.95], [6.48, -5.86], [5.42, -5.76], [4.62, -4.92],
        [3.76, -3.52], [2.66, -2.72], [1.3, -2.52], [0, -2.48],
      ];
      const ctrlPts = [...RIGHT];
      for (let i = RIGHT.length - 2; i >= 1; i--) ctrlPts.push([-RIGHT[i][0], RIGHT[i][1]]);
      const outlineCurve = new THREE.CatmullRomCurve3(ctrlPts.map(([x, y]) => new THREE.Vector3(x, y, 0)), true, "centripetal");
      const NS = 1440, HALF = NS / 2;
      const raw = outlineCurve.getSpacedPoints(NS).slice(0, NS);
      const BODY = [];
      for (let i = 0; i <= HALF; i++) BODY.push({ x: raw[i].x, y: raw[i].y });
      BODY[0].x = 0; BODY[HALF].x = 0;
      for (let i = HALF + 1; i < NS; i++) { const m = BODY[NS - i]; BODY.push({ x: -m.x, y: m.y }); }
      withNormalsCW(BODY);
      let XMIN = 1e9, XMAX = -1e9, YMIN = 1e9, YMAX = -1e9;
      for (const p of BODY) { XMIN = Math.min(XMIN, p.x); XMAX = Math.max(XMAX, p.x); YMIN = Math.min(YMIN, p.y); YMAX = Math.max(YMAX, p.y); }
      const BW = XMAX - XMIN, BH = YMAX - YMIN;
      const U = (x, y) => [(x - XMIN) / BW, (y - YMIN) / BH];

      /* ================= sculpt: the face domes, the grips fall away down and back ================= */
      function F(x, y) {
        const ax = Math.abs(x);
        let z = 0.2 * Math.exp(-((x / 5.5) ** 2) - (((y - 0.2) / 3.0) ** 2));
        const g = Math.max(0, -1.0 - y); z -= 0.05 * g * g;
        const s = Math.max(0, ax - 5.6); z -= 0.035 * s * s;
        const t = Math.max(0, y - 2.4); z -= 0.06 * t * t;
        return z;
      }
      function gradF(x, y) { const e = 0.004; return [(F(x + e, y) - F(x - e, y)) / (2 * e), (F(x, y + e) - F(x, y - e)) / (2 * e)]; }
      const gripW = (y) => smooth(-1.0, -4.6, y);

      const ZT = 0.62, ZB = -0.62;
      const STICKS = [{ x: -2.65, y: -0.6 }, { x: 2.65, y: -0.6 }];
      const WELL_R = 1.0, WELL_D = 0.34;
      const DPAD = { x: -4.95, y: 1.05 };
      const FACE = { x: 4.95, y: 1.05, d: 0.8, R: 0.4 };
      const HOME = { x: 0, y: 0.78, R: 0.44 };
      const SMALL = [{ x: -1.45, y: 1.72 }, { x: 1.45, y: 1.72 }];

      function bodyGeometry() {
        const out = [...BODY].reverse(); // CCW
        const N = out.length;
        const S = 16;
        const pos = [], nor = [], uv = [], idx = [];
        const rings = [];
        const silRing = [];
        // per-point fillet sizes: the grips get rounder
        const sz = out.map((q) => { const w = gripW(q.y); return { rto: 0.55 + 0.35 * w, rtz: 0.45 + 0.3 * w, rbo: 0.5 + 0.2 * w, rbz: 0.42 + 0.2 * w, back: 0.55 * w }; });
        const prof = [];
        for (let i = 0; i <= S; i++) prof.push({ kind: 0, th: (i / S) * Math.PI / 2 });
        for (let i = 0; i <= S; i++) prof.push({ kind: 1, th: (i / S) * Math.PI / 2 });
        const P = prof.length;
        for (let j = 0; j < P; j++) {
          const p = prof[j];
          for (let i = 0; i < N; i++) {
            const q = out[i], s = sz[i];
            let o, z, nr, nz;
            if (p.kind === 0) {
              o = s.rto * (1 - Math.sin(p.th)); z = ZT - s.rtz * (1 - Math.cos(p.th));
              const n = [s.rtz * Math.sin(p.th), s.rto * Math.cos(p.th)], l = Math.hypot(n[0], n[1]); nr = n[0] / l; nz = n[1] / l;
            } else {
              o = s.rbo * (1 - Math.cos(p.th)); z = ZB - s.back + s.rbz * (1 - Math.sin(p.th));
              const n = [s.rbz * Math.cos(p.th), -s.rbo * Math.sin(p.th)], l = Math.hypot(n[0], n[1]); nr = n[0] / l; nz = n[1] / l;
            }
            const x = q.x - q.nx * o, y = q.y - q.ny * o;
            const zz = z + F(x, y);
            pos.push(x, y, zz);
            const [fx, fy] = gradF(x, y);
            let nx = q.nx * nr, ny = q.ny * nr;
            nx -= fx * nz; ny -= fy * nz;
            const l = Math.hypot(nx, ny, nz);
            nor.push(nx / l, ny / l, nz / l);
            uv.push(...U(x, y));
            if (p.kind === 0 && j === S) silRing.push({ x, y, z: zz });
          }
        }
        for (let j = 0; j < P - 1; j++) {
          for (let i = 0; i < N; i++) {
            const a = j * N + i, b = j * N + ((i + 1) % N), c = (j + 1) * N + i, d = (j + 1) * N + ((i + 1) % N);
            idx.push(a, c, b, b, c, d);
          }
        }
        // sculpted face cap: Delaunay over the inner contour, the stick wells and an interior grid
        const inner = [];
        for (let i = 0; i < N; i++) inner.push({ x: pos[i * 3], y: pos[i * 3 + 1] });
        const innerLo = inner.filter((_, i) => i % 4 === 0);
        const holes = STICKS.map(({ x, y }) => {
          const hp = [];
          for (let i = 0; i < 128; i++) { const a = (i / 128) * Math.PI * 2; hp.push({ x: x + WELL_R * Math.cos(a), y: y + WELL_R * Math.sin(a) }); }
          return hp;
        });
        const cpts = [...inner, ...holes.flat()];
        const step = 0.17;
        for (let y = YMIN; y <= YMAX; y += step) {
          for (let x = XMIN; x <= XMAX; x += step) {
            const xx = x + ((Math.round((y - YMIN) / step) % 2) ? step / 2 : 0);
            if (!pointInPoly(xx, y, innerLo)) continue;
            if (STICKS.some((st) => Math.hypot(xx - st.x, y - st.y) < WELL_R + 0.08)) continue;
            if (distToPoly(xx, y, innerLo) < 0.07) continue;
            cpts.push({ x: xx, y });
          }
        }
        const del = new Delaunator(cpts.flatMap((p) => [p.x, p.y]));
        const base = pos.length / 3;
        for (const p of cpts) {
          const z = ZT + F(p.x, p.y);
          pos.push(p.x, p.y, z);
          const [fx, fy] = gradF(p.x, p.y), l = Math.hypot(fx, fy, 1);
          nor.push(-fx / l, -fy / l, 1 / l);
          uv.push(...U(p.x, p.y));
        }
        const T = del.triangles;
        for (let k = 0; k < T.length; k += 3) {
          const A = cpts[T[k]], B = cpts[T[k + 1]], C = cpts[T[k + 2]];
          const cx = (A.x + B.x + C.x) / 3, cy = (A.y + B.y + C.y) / 3;
          if (!pointInPoly(cx, cy, innerLo)) continue;
          if (STICKS.some((s) => Math.hypot(cx - s.x, cy - s.y) < WELL_R)) continue;
          const area = (B.x - A.x) * (C.y - A.y) - (C.x - A.x) * (B.y - A.y);
          if (area > 0) idx.push(base + T[k], base + T[k + 1], base + T[k + 2]);
          else idx.push(base + T[k], base + T[k + 2], base + T[k + 1]);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
        g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
        g.setIndex(idx);
        return { geo: g, sil: silRing };
      }

      // simple part slab (bumpers, triggers): CCW outline, uniform fillets, flat face
      function partSlab(outCCW, zt, zb, rf) {
        const N = outCCW.length, S = 10;
        const prof = [];
        for (let i = 0; i <= S; i++) { const th = (i / S) * Math.PI / 2; prof.push({ o: rf * (1 - Math.sin(th)), z: zt - rf * (1 - Math.cos(th)), nr: Math.sin(th), nz: Math.cos(th) }); }
        prof.push({ o: 0, z: zb, nr: 1, nz: 0 });
        const pos = [], nor = [], idx = [];
        for (const p of prof) for (const q of outCCW) {
          pos.push(q.x - q.nx * p.o, q.y - q.ny * p.o, p.z);
          const nx = q.nx * p.nr, ny = q.ny * p.nr, l = Math.hypot(nx, ny, p.nz);
          nor.push(nx / l, ny / l, p.nz / l);
        }
        for (let j = 0; j < prof.length - 1; j++) for (let i = 0; i < N; i++) {
          const a = j * N + i, b = j * N + ((i + 1) % N), c = (j + 1) * N + i, d = (j + 1) * N + ((i + 1) % N);
          idx.push(a, c, b, b, c, d);
        }
        const contour = [];
        for (let i = 0; i < N; i++) contour.push(new THREE.Vector2(pos[i * 3], pos[i * 3 + 1]));
        const tris = THREE.ShapeUtils.triangulateShape(contour, []);
        const base = pos.length / 3;
        for (const v of contour) { pos.push(v.x, v.y, zt); nor.push(0, 0, 1); }
        for (const [a, b, c] of tris) {
          const A = contour[a], B = contour[b], C = contour[c];
          const area = (B.x - A.x) * (C.y - A.y) - (C.x - A.x) * (B.y - A.y);
          if (area > 0) idx.push(base + a, base + b, base + c); else idx.push(base + a, base + c, base + b);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
        g.setIndex(idx);
        const sil = outCCW.map((q) => ({ x: q.x, y: q.y, z: zt - rf }));
        return { geo: g, sil };
      }
      // a band riding along a stretch of the body edge, with round ends (clockwise)
      function bandCW(segPts, outD, inD) {
        const top = segPts.map((p) => ({ x: p.x + p.nx * outD, y: p.y + p.ny * outD }));
        const bot = segPts.map((p) => ({ x: p.x - p.nx * inD, y: p.y - p.ny * inD }));
        const rr = (outD + inD) / 2, off = (outD - inD) / 2;
        const cap = (p, sgn) => {
          const tx = p.ny * sgn, ty = -p.nx * sgn; // CW tangent is (ny,-nx); the start cap runs backwards
          const pts = [];
          for (let k = 1; k < 16; k++) {
            const ph = (k / 16) * Math.PI;
            const cx = p.x + p.nx * off, cy = p.y + p.ny * off;
            const nn = sgn > 0 ? 1 : -1;
            pts.push({ x: cx + rr * (Math.cos(ph) * p.nx * nn + Math.sin(ph) * tx), y: cy + rr * (Math.cos(ph) * p.ny * nn + Math.sin(ph) * ty) });
          }
          return pts;
        };
        const e = segPts[segPts.length - 1], s = segPts[0];
        const loop = [...top, ...cap(e, 1), ...bot.reverse(), ...cap(s, -1)];
        return withNormalsCW(loop);
      }
      function mirrorCW(loop) { return withNormalsCW(loop.map((p) => ({ x: -p.x, y: p.y })).reverse()); }

      /* ================= textures ================= */
      const TEX = {};
      const AOW = 2560, AOH = Math.round(2560 * BH / BW);
      const toC = (x, y) => [((x - XMIN) / BW) * AOW, (1 - (y - YMIN) / BH) * AOH];
      const SC = AOW / BW;

        }
        for (const side of [1, -1]) {
          const pts = sp.map((p) => new THREE.Vector3(side * (p.x + p.nx * LINE_R * 1.2), p.y + p.ny * LINE_R * 1.2, ZREF));
          const curve = new THREE.CatmullRomCurve3(pts, false, "centripetal");
          const TS = 1600, RS = 8;
          const geo = new THREE.TubeGeometry(curve, TS, LINE_R, RS, false);
          const sAttr = new Float32Array(geo.attributes.position.count);
          for (let i = 0; i < sAttr.length; i++) sAttr[i] = Math.floor(i / (RS + 1)) / TS;
          geo.setAttribute("s", new THREE.BufferAttribute(sAttr, 1));
          lineGrp.add(new THREE.Mesh(geo, lineMat));
          halves.push(curve);
        }
      }
      const mkSprite = (scale) => {
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color: 0xffffff, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, transparent: true }));
        sp.scale.set(scale, scale, 1);
        lineGrp.add(sp);
        return sp;
      };
      const heads = [0, 1].map(() => ({ halo: mkSprite(0.6), core: mkSprite(0.11) }));

      /* ================= environments ================= */
      const pmrem = new THREE.PMREMGenerator(renderer);
      function softTex(soft) {
        return canvasTex(256, 256, (g, w, h) => {
          const img = g.createImageData(w, h);
          for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
            const u = Math.abs(x / (w - 1) * 2 - 1), v = Math.abs(y / (h - 1) * 2 - 1);
            const f = (a) => { const e = clamp01((1 - a) / soft); return e * e * (3 - 2 * e); };
            const val = Math.round(255 * f(u) * f(v));
            const k = (y * w + x) * 4;
            img.data[k] = img.data[k + 1] = img.data[k + 2] = val; img.data[k + 3] = 255;
          }
          g.putImageData(img, 0, 0);
        }, true);
      }
      const SOFT = { hard: softTex(0.06), med: softTex(0.35), soft: softTex(0.9) };
      function makeEnv(panels) {
        const s = new THREE.Scene();
        s.background = new THREE.Color(0x000000);
        for (const p of panels) {
          const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(...p.c).multiplyScalar(p.i), map: SOFT[p.soft || "hard"], side: THREE.DoubleSide });
          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(p.w, p.h), m);
          mesh.position.set(...p.p);
          mesh.lookAt(0, 0, 0);
          s.add(mesh);
        }
        return pmrem.fromScene(s, 0, 0.1, 100).texture;
      }
      const COOL = [0.92, 0.96, 1.0];
      const ENV_BODY = makeEnv([
        { p: [0, 12, 10], w: 30, h: 9, i: 1.6, c: COOL, soft: "soft" },          // soft key above
        { p: [0, 3, 16], w: 24, h: 10, i: 0.32, c: COOL, soft: "soft" },         // face sheen
        { p: [-14, 1, 2], w: 1.4, h: 14, i: 1.2, c: COOL, soft: "med" },
        { p: [14, 1, 2], w: 1.4, h: 14, i: 1.2, c: COOL, soft: "med" },
        { p: [0, -11, 4.5], w: 30, h: 3.6, i: 1.5, c: COOL, soft: "med" },       // low bounce: lower edges of the grips
        { p: [0, -6, -12], w: 30, h: 5, i: 3.2, c: COOL, soft: "med" },          // low rim from behind
        { p: [-10, -4, -9], w: 2, h: 10, i: 2.2, c: COOL, soft: "med" },
        { p: [10, -4, -9], w: 2, h: 10, i: 2.2, c: COOL, soft: "med" },
      ]);
      const ENV_HI = makeEnv([
        { p: [0, 12, 5.5], w: 34, h: 7, i: 30, c: COOL, soft: "med" },
      ]);

      /* ================= post ================= */
      const rtOpts = { type: THREE.HalfFloatType, samples: 4, colorSpace: THREE.LinearSRGBColorSpace };
      const rtL = new THREE.WebGLRenderTarget(RW, RH, rtOpts);
      const rtB = new THREE.WebGLRenderTarget(RW, RH, rtOpts);
      const rtH = new THREE.WebGLRenderTarget(RW, RH, rtOpts);
      const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(RW, RH, { type: THREE.HalfFloatType }));
      composer.renderToScreen = false;
      composer.setPixelRatio(SS);
      const combine = new ShaderPass({
        uniforms: { tDiffuse: { value: null }, tL: { value: null }, tB: { value: null }, tH: { value: null }, kL: { value: 0 }, kB: { value: 0 }, kH: { value: 0 } },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
        fragmentShader: `uniform sampler2D tL; uniform sampler2D tB; uniform sampler2D tH; uniform float kL; uniform float kB; uniform float kH; varying vec2 vUv;
          void main(){ vec3 c = kL * texture2D(tL, vUv).rgb + kB * texture2D(tB, vUv).rgb + kH * texture2D(tH, vUv).rgb; c = clamp(c, vec3(0.0), vec3(64.0)); gl_FragColor = vec4(c, 1.0); }`,
      });
      combine.uniforms.tL.value = rtL.texture;
      combine.uniforms.tB.value = rtB.texture;
      combine.uniforms.tH.value = rtH.texture;
      composer.addPass(combine);
      const bloom = new UnrealBloomPass(new THREE.Vector2(RW, RH), 0.38, 0.3, 1.2);
      composer.addPass(bloom);
      composer.addPass(new OutputPass());
      composer.setPixelRatio(SS);

      const finalMat = new THREE.ShaderMaterial({
        uniforms: { tSrc: { value: null }, texel: { value: new THREE.Vector2(1 / RW, 1 / RH) }, frame: { value: 0 }, grain: { value: 0.016 }, vig: { value: 0.3 } },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
        fragmentShader: `uniform sampler2D tSrc; uniform vec2 texel; uniform float frame; uniform float grain; uniform float vig; varying vec2 vUv;
          float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
          void main(){
            vec3 c = vec3(0.0);
            c += texture2D(tSrc, vUv + texel * vec2(-0.75, -0.75)).rgb;
            c += texture2D(tSrc, vUv + texel * vec2( 0.75, -0.75)).rgb;
            c += texture2D(tSrc, vUv + texel * vec2(-0.75,  0.75)).rgb;
            c += texture2D(tSrc, vUv + texel * vec2( 0.75,  0.75)).rgb;
            c *= 0.25;
            vec2 q = vUv - 0.5; q.x *= 1.777;
            c *= 1.0 - vig * smoothstep(0.35, 1.05, length(q));
            vec2 px = floor(gl_FragCoord.xy);
            float n = (h12(px + frame * 17.31) + h12(px * 1.37 + frame * 3.7 + 11.0)) - 1.0;
            float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
            c += n * grain * (0.2 + 0.8 * sqrt(clamp(lum, 0.0, 1.0)));
            gl_FragColor = vec4(max(c, vec3(0.0)), 1.0);
          }`,
        depthTest: false, depthWrite: false,
      });
      const fsScene = new THREE.Scene();
      const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      fsScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), finalMat));

      /* ================= direction ================= */
      const T = {
        dotIn: [0.45, 1.0],
        draw: [1.0, 4.0],      // 3.0s power2.inOut, top centre -> both sides -> bottom centre
        body: [3.3, 4.8],      // 1.5s, overlaps the last 0.7s of the stroke
        hi: [3.8, 5.3],        // the wide highlight peaks 0.5s after the body
        lineOut: [4.6, 5.7],
        led: [5.5, 6.1],
        push: [6.3, 8.2],      // still for ~1s after the highlight, then a slow push
        cut: 8.2,
      };

      function renderAt(t) {
        if (t >= T.cut) return;
        const push = 1 + 0.05 * power2In(seg(t, T.push[0], T.push[1]));
        camera.position.set(TARGET.x, TARGET.y, DIST / push);
        camera.lookAt(TARGET);
        camera.updateProjectionMatrix();

        const head = power2InOut(seg(t, T.draw[0], T.draw[1]));
        const dot = sineInOut(seg(t, T.dotIn[0], T.dotIn[1]));
        const lineOut = 1 - 0.86 * sineInOut(seg(t, T.lineOut[0], T.lineOut[1]));
        const settle = 1 - 0.35 * sineInOut(seg(t, T.draw[1] - 0.1, T.draw[1] + 0.6));
        const headFade = 1 - sineInOut(seg(t, T.draw[1] - 0.15, T.draw[1] + 0.45));
        lineMat.uniforms.head.value = t < T.draw[0] ? -1 : head;
        lineMat.uniforms.gain.value = 2.6 * settle;
        lineMat.uniforms.boost.value = headFade;
        halves.forEach((c, i) => {
          const p = c.getPointAt(Math.min(1, Math.max(0, head)));
          const h = heads[i];
          h.halo.position.set(p.x, p.y, ZREF + 0.05);
          h.core.position.copy(h.halo.position);
          const k = dot * headFade * (i === 0 ? 1 : (t < T.draw[0] ? 0 : 1));
          h.halo.material.color.setScalar(1.0 * k);
          h.core.material.color.setScalar(9 * k);
        });

        const kB = power2InOut(seg(t, T.body[0], T.body[1]));
        const kH = power2InOut(seg(t, T.hi[0], T.hi[1]));
        M.led.color.setRGB(0.7, 0.82, 1.0).multiplyScalar(1.2 * sineInOut(seg(t, T.led[0], T.led[1])));

        product.visible = false; lineGrp.visible = true;
        renderer.setRenderTarget(rtL); renderer.clear(); renderer.render(scene, camera);
        product.visible = true; lineGrp.visible = false;
        M.ledMesh.visible = true;
        scene.environment = ENV_BODY;
        renderer.setRenderTarget(rtB); renderer.clear(); renderer.render(scene, camera);
        M.ledMesh.visible = false;
        scene.environment = ENV_HI;
        renderer.setRenderTarget(rtH); renderer.clear(); renderer.render(scene, camera);
        renderer.setRenderTarget(null);

        combine.uniforms.kL.value = lineOut;
        combine.uniforms.kB.value = kB;
        combine.uniforms.kH.value = kH;
        composer.render();
        finalMat.uniforms.tSrc.value = composer.readBuffer.texture;
        finalMat.uniforms.frame.value = Math.round(t * 30);
        renderer.setRenderTarget(null);
        renderer.render(fsScene, fsCam);
      }

      window.__ots = { renderAt, T, SIL };
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
