<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --page: #fafafa;
        --ink: #111111;
        --muted: #8a8a8a;
        --line: #e5e5e5;
        --font-ui: "Inter", system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--page); }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        /* soft top light instead of a flat fill */
        background: radial-gradient(ellipse 80% 70% at 50% 32%, #ffffff 0%, #f6f6f6 55%, #e9e9e9 100%);
        font-family: var(--font-ui);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      #stage, #grp, #final { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #grp > * { position: absolute; }
      .ic { display: block; flex: none; }

      /* ---------- font classes (fonts must be declared in CSS rules) ---------- */
      .f-inter { font-family: "Inter", sans-serif; }
      .f-mono { font-family: "JetBrains Mono", monospace; }
      .f-play { font-family: "Playfair Display", serif; }
      .f-archivo { font-family: "Archivo Black", sans-serif; }
      .f-oswald { font-family: "Oswald", sans-serif; }
      .f-garamond { font-family: "EB Garamond", serif; }
      .f-league { font-family: "League Gothic", sans-serif; }

      /* ---------- main shape ---------- */
      #morph {
        left: 960px; top: 540px;
        width: 960px; height: 3px;
        border-radius: 1.5px;
        background: #111111;
        border: 1px solid rgba(229, 229, 229, 0);
        box-shadow: 0px 0px 0px 0px rgba(0, 0, 0, 0);
        overflow: hidden;
      }
      #tbar {
        position: absolute; left: 0; top: 0; right: 0; height: 44px;
        background: #ebe6dc; border-bottom: 1px solid rgba(29, 22, 18, 0.10);
        opacity: 0; color: #8a8378;
      }
      #tbar i.d { position: absolute; top: 16px; width: 12px; height: 12px; border-radius: 50%; }
      #tbar i.d:nth-child(1) { left: 18px; background: #ff5f57; }
      #tbar i.d:nth-child(2) { left: 38px; background: #febc2e; }
      #tbar i.d:nth-child(3) { left: 58px; background: #28c840; }
      #tbar .tb { position: absolute; top: 12px; }
      #tbar .url {
        position: absolute; left: 380px; top: 8px; width: 678px; height: 28px; border-radius: 8px;
        background: rgba(29, 22, 18, 0.06); display: flex; align-items: center; justify-content: center; gap: 7px;
        font-size: 13px; font-weight: 500; color: #3d362e;
      }
      #tbar .url .ic { color: #8a8378; }

      /* ---------- headline / input ---------- */
      #title {
        left: 960px; top: 540px;
        font-size: 64px; line-height: 77px; font-weight: 600; color: #111111;
        white-space: nowrap;
      }
      #title span { display: inline-block; opacity: 0; margin-right: 0.26em; }
      #title span:last-child { margin-right: 0; }
      #av {
        left: 516px; top: 518px; width: 44px; height: 44px; border-radius: 50%; background: #c8663b; opacity: 0;
        display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #ffffff;
      }
      .rbtn { top: 514px; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; }
      #bAtt { left: 1286px; background: #2c2c2c; color: #d8d8d8; }
      #bSend { left: 1350px; background: #ffffff; color: #111111; }
      #typed {
        left: 592px; top: 520px; height: 40px;
        display: flex; align-items: center;
        font-size: 26px; line-height: 40px; font-weight: 500; color: #ffffff; white-space: nowrap;
      }
      #typed .ch { display: none; }
      #cur { display: block; width: 2px; height: 30px; margin-left: 3px; background: #ffffff; opacity: 0; }
      #hint { left: 592px; top: 608px; font-size: 22px; line-height: 30px; font-weight: 400; color: #111111; opacity: 0; white-space: nowrap; }

      /* ---------- generated page: coffee roaster storefront ---------- */
      #win { left: 241px; top: 131px; width: 1438px; height: 818px; border-radius: 17px; overflow: hidden; }
      #page { position: absolute; left: 0; top: 44px; width: 1438px; height: 774px; font-family: "Inter", sans-serif; color: #1d1612; }
      #page > * { position: absolute; opacity: 0; }

      #pbar {
        left: 0; top: 0; width: 1438px; height: 32px; background: #1d1612; color: #efe4d2;
        display: flex; align-items: center; justify-content: center; gap: 26px; font-size: 12px; font-weight: 500;
      }
      #pbar span { display: flex; align-items: center; gap: 7px; }
      #pbar u { display: block; width: 1px; height: 12px; background: rgba(239, 228, 210, 0.3); }

      #pnav { left: 0; top: 32px; width: 1438px; height: 60px; padding: 0 64px; display: flex; align-items: center; border-bottom: 1px solid #e2d8c6; }
      .logo { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
      .logo svg { display: block; }
      #pnav .links { display: flex; gap: 30px; margin-left: 52px; font-size: 14px; font-weight: 500; color: #4a3f35; }
      #pnav .links span { display: flex; align-items: center; gap: 3px; }
      #pnav .nr { margin-left: auto; display: flex; align-items: center; gap: 20px; font-size: 14px; font-weight: 500; color: #1d1612; }
      .cart { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 14px; border-radius: 18px; background: #1d1612; color: #f6f1e8; font-size: 13.5px; font-weight: 500; }
      .cart b { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #d4572a; color: #fff; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

      #ph1 { left: 64px; top: 124px; font-family: "Playfair Display", serif; font-size: 54px; line-height: 60px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; }
      #psub { left: 64px; top: 258px; width: 610px; font-size: 16px; line-height: 25px; color: #5b4e42; }
      #pbtn { left: 64px; top: 322px; display: flex; gap: 10px; }
      .b1 { height: 44px; padding: 0 20px; border-radius: 8px; background: #1d1612; color: #f6f1e8; font-size: 14.5px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
      .b2 { height: 44px; padding: 0 20px; border-radius: 8px; border: 1px solid #cfc3ae; color: #1d1612; font-size: 14.5px; font-weight: 500; display: flex; align-items: center; }
      #prate { left: 64px; top: 380px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #5b4e42; }
      #prate .avs { display: flex; }
      #prate .avs span { width: 24px; height: 24px; border-radius: 12px; margin-left: -7px; border: 2px solid #f6f1e8; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 600; color: #fff; }
      #prate .avs span:first-child { margin-left: 0; }
      #prate .st { display: flex; gap: 2px; color: #d4572a; }
      #prate b { color: #1d1612; font-weight: 600; }

      #phero { left: 740px; top: 112px; width: 634px; height: 280px; border-radius: 14px; background: #e8d6bd; overflow: hidden; }
      #phero > * { position: absolute; }
      #phero .tt { left: 0; top: 224px; width: 634px; height: 56px; background: #dcc7a6; }
      #phero .sh { left: 56px; top: 236px; width: 176px; height: 12px; border-radius: 50%; background: rgba(60, 35, 15, 0.22); filter: blur(4px); }
      #phero .info { left: 290px; top: 18px; width: 320px; }
      .chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px; border-radius: 12px; background: #1d1612; color: #f6f1e8; font-size: 11.5px; font-weight: 500; }
      .chip i { display: block; width: 6px; height: 6px; border-radius: 3px; background: #7bd88f; }
      .info h3 { margin-top: 12px; font-size: 25px; line-height: 30px; font-weight: 600; letter-spacing: -0.02em; }
      .info .s1 { margin-top: 2px; font-size: 13px; line-height: 18px; color: #5b4e42; }
      .info .fl { margin-top: 12px; display: flex; gap: 6px; }
      .info .fl span { height: 26px; padding: 0 11px; border-radius: 13px; border: 1px solid #c9b79b; font-size: 12px; font-weight: 500; display: flex; align-items: center; }
      .info .rd { margin-top: 12px; font-size: 12px; line-height: 16px; color: #6d5e4f; }
      .info .pr { margin-top: 12px; display: flex; align-items: baseline; gap: 8px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
      .info .pr small { font-size: 13px; font-weight: 400; color: #6d5e4f; letter-spacing: 0; }
      .info .bt { margin-top: 10px; display: flex; gap: 8px; }
      .info .bt .a { height: 40px; padding: 0 18px; border-radius: 8px; background: #d4572a; color: #fff; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .info .bt .b { height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #c9b79b; font-size: 13px; font-weight: 500; display: flex; align-items: center; }

      #phead { left: 64px; top: 414px; width: 1310px; height: 28px; display: flex; align-items: center; }
      #phead h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin-right: 22px; }
      #phead .tabs { display: flex; gap: 6px; }
      #phead .tabs span { height: 28px; padding: 0 12px; border-radius: 14px; font-size: 12.5px; font-weight: 500; color: #5b4e42; display: flex; align-items: center; }
      #phead .tabs span.on { background: #1d1612; color: #f6f1e8; }
      #phead .all { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }

      #pprods { left: 64px; top: 452px; width: 1310px; height: 241px; display: flex; gap: 20px; opacity: 1; }
      .pp { position: relative; flex: 1; opacity: 0; }
      .pp .im { position: relative; height: 138px; border-radius: 10px; overflow: hidden; }
      .pp .im .sh { position: absolute; left: 50%; bottom: 3px; width: 92px; margin-left: -46px; height: 8px; border-radius: 50%; background: rgba(40, 24, 10, 0.2); filter: blur(3px); }
      .pp .im .cp { position: absolute; left: 10px; top: 10px; height: 22px; padding: 0 9px; border-radius: 11px; background: #ffffff; font-size: 11px; font-weight: 600; display: flex; align-items: center; }
      .pp .nm { margin-top: 10px; font-size: 14.5px; line-height: 20px; font-weight: 600; letter-spacing: -0.01em; }
      .pp .or { font-size: 12px; line-height: 17px; color: #7a6c5d; }
      .pp .fl { font-size: 12.5px; line-height: 18px; color: #4a3f35; }
      .pp .pr { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
      .pp .pr small { font-size: 12px; font-weight: 400; color: #7a6c5d; }
      .pp .pr .ad { margin-left: auto; width: 28px; height: 28px; border-radius: 14px; border: 1px solid #cfc3ae; display: flex; align-items: center; justify-content: center; }

      #pcards { left: 0; top: 700px; width: 1438px; height: 74px; padding: 0 64px; display: flex; align-items: center; background: #efe7d8; border-top: 1px solid #e2d8c6; }
      .pc { flex: 1; display: flex; align-items: center; gap: 12px; }
      .pc .ico { width: 36px; height: 36px; border-radius: 18px; background: #f6f1e8; border: 1px solid #ddd1bc; display: flex; align-items: center; justify-content: center; color: #1d1612; flex: none; }
      .pc b { display: block; font-size: 13px; line-height: 17px; font-weight: 600; }
      .pc span.t2 { display: block; font-size: 12px; line-height: 16px; color: #7a6c5d; }

      /* ---------- bag packaging (base size 140 x 188, scaled by wrapper) ---------- */
      .bw { position: relative; }
      .bag {
        position: absolute; left: 0; top: 0; width: 140px; height: 188px; transform-origin: 0 0; overflow: hidden;
        border-radius: 5px 5px 7px 7px; color: var(--t);
        background:
          linear-gradient(90deg, rgba(0,0,0,0.24) 0, rgba(0,0,0,0) 6%, rgba(255,255,255,0.08) 38%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.26) 100%),
          var(--c);
        font-family: "Inter", sans-serif;
      }
      .bag .seal { position: absolute; left: 0; top: 0; width: 140px; height: 20px; border-bottom: 1px solid rgba(0,0,0,0.25); background: repeating-linear-gradient(180deg, rgba(0,0,0,0.16) 0 1px, rgba(255,255,255,0.06) 1px 3px); }
      .bag .tear { position: absolute; left: 8px; right: 8px; top: 27px; height: 0; border-top: 1px dashed currentColor; opacity: 0.35; }
      .bag .valve { position: absolute; right: 12px; top: 35px; width: 11px; height: 11px; border-radius: 50%; background: rgba(0,0,0,0.2); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.3); }
      .bag .bd { position: absolute; left: 0; right: 0; top: 42px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
      .bag .bd svg { width: 17px; height: 17px; display: block; }
      .bag .bd b { font-size: 9px; line-height: 10px; font-weight: 700; letter-spacing: 0.16em; }
      .bag .bd em { font-style: normal; font-size: 5px; line-height: 6px; letter-spacing: 0.22em; opacity: 0.75; }
      .bag .lbl { position: absolute; left: 12px; right: 12px; top: 90px; height: 72px; padding: 7px 8px 0; border-radius: 2px; background: var(--l); color: var(--k); }
      .bag .lbl small { display: block; font-size: 5.5px; line-height: 7px; letter-spacing: 0.2em; font-weight: 600; opacity: 0.7; }
      .bag .lbl strong { display: block; margin-top: 2px; font-size: 18px; line-height: 19px; font-weight: 700; letter-spacing: -0.03em; }
      .bag .lbl .sb { display: block; margin-top: 1px; font-size: 7.5px; line-height: 9px; opacity: 0.8; }
      .bag .lbl .rs { display: flex; gap: 2px; margin-top: 6px; }
      .bag .lbl .rs i { display: block; width: 14px; height: 3px; border-radius: 1px; background: currentColor; opacity: 0.18; }
      .bag .lbl .rs i.on { opacity: 0.9; }
      .bag .lbl .nt { display: block; margin-top: 4px; font-size: 5.5px; line-height: 7px; letter-spacing: 0.03em; opacity: 0.75; }
      .bag .wt { position: absolute; left: 12px; right: 12px; top: 169px; display: flex; justify-content: space-between; font-size: 5.5px; letter-spacing: 0.12em; font-weight: 600; opacity: 0.85; }

      /* ---------- gallery ---------- */
      #grid { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .cell { position: absolute; width: 374px; height: 247px; opacity: 0; }
      .card { position: absolute; left: 0; top: 0; width: 374px; height: 213px; border-radius: 5px; overflow: hidden; box-shadow: 0 8px 21px rgba(0, 0, 0, 0.12); }
      .lab, #mainlab { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 500; color: #6f6f6f; white-space: nowrap; }
      .lab { position: absolute; left: 0; top: 227px; }
      #mainlab { position: absolute; left: 566px; top: 644px; opacity: 0; }
      .lab i, #mainlab i { display: block; width: 16px; height: 16px; border-radius: 5px; }
      .thumb { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .thumb div { position: absolute; white-space: nowrap; }
      .thumb b { font-weight: 600; }

      /* ---------- wordmark ---------- */
      #final { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #endpill { position: absolute; left: 960px; top: 512px; width: 440px; height: 3px; border-radius: 1.5px; background: #111111; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      #wm { font-family: "Inter", sans-serif; font-size: 54px; line-height: 64px; font-weight: 600; letter-spacing: -0.02em; color: #ffffff; opacity: 0; }
      #wmsub { position: absolute; left: 0; width: 1920px; top: 604px; text-align: center; font-family: "Inter", sans-serif; font-size: 26px; line-height: 34px; font-weight: 400; color: #6f6f6f; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="11" data-track-index="0">
        <div id="grid"></div>

        <div id="grp">
          <div id="morph">
            <div id="tbar"></div>
          </div>

          <div id="title"><span>What</span><span>do you</span><span>want to</span><span>build?</span></div>
          <div id="av">M</div>
          <div id="bAtt" class="rbtn"></div>
          <div id="bSend" class="rbtn"></div>
          <div id="typed"><i id="cur"></i></div>
          <div id="hint">Try: a booking site for a yoga studio</div>

          <div id="win">
            <div id="page"></div>
          </div>
        </div>

        <div id="mainlab"><i style="background: #d4572a"></i><span>Coffee roaster storefront</span></div>
      </div>

      <div id="final" class="clip" data-start="0" data-duration="11" data-track-index="1">
        <div id="endpill"><div id="wm">Kiln</div></div>
        <div id="wmsub">Describe it. Ship it.</div>
      </div>
    </div>

    <script>
      const EIO = "power3.inOut"; // cubic-bezier(0.65, 0, 0.35, 1)
      const EXPO = "expo.out"; // cubic-bezier(0.16, 1, 0.3, 1)
      const BACK = "back.out(1.7)"; // cubic-bezier(0.34, 1.56, 0.64, 1)
      const $ = (id) => document.getElementById(id);

      /* ---------- icons (lucide-style, 1.5px stroke) ---------- */
      const IC = {
        search: '<circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/>',
        user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5v-1a5 5 0 0 1 5-5h5a5 5 0 0 1 5 5v1"/>',
        bag: '<path d="M5.5 7h13l1 13.5h-15z"/><path d="M8.5 9.5V6.5a3.5 3.5 0 0 1 7 0v3"/>',
        chev: '<path d="m6 9 6 6 6-6"/>',
        arrow: '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
        up: '<path d="M12 19V5"/><path d="m6 11 6-6 6 6"/>',
        plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
        truck: '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
        flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
        repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
        pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
        lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
        left: '<path d="m15 18-6-6 6-6"/>',
        right: '<path d="m9 18 6-6-6-6"/>',
        reload: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
        share: '<path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/>',
        check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
        cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
        star: '<path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z" fill="currentColor" stroke="none"/>',
        clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20v-1a5 5 0 0 0-3-4.6"/>',
      };
      const ic = (n, s, extra) =>
        '<svg class="ic" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="' +
        ((1.5 * 24) / s).toFixed(2) + '" stroke-linecap="round" stroke-linejoin="round"' + (extra ? ' style="' + extra + '"' : "") + ">" + IC[n] + "</svg>";

      /* ---------- bag packaging ---------- */
      const BEAN = '<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="12.5" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="14" cy="14" rx="5" ry="7.6" transform="rotate(30 14 14)" fill="currentColor"/><path d="M10.6 19.6c3-3 4-6 7-11" fill="none" style="stroke:var(--c)" stroke-width="1.4" stroke-linecap="round"/></svg>';
      function bag(o, s) {
        return (

      F("#title", { xPercent: -50, x: 0, scale: 1 }, { xPercent: 0, x: -368, scale: 26 / 64, duration: 0.4, ease: EIO }, 1.7);
      F(["#av", "#bAtt", "#bSend"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: EIO }, 1.8);
      F("#hint", { opacity: 0 }, { opacity: 0.2, duration: 0.3, ease: EIO }, 2.1);

      /* 5. text cleared, then typed (2.3 - 4.0) */
      F("#title", { opacity: 1 }, { opacity: 0, duration: 0.001, ease: "none" }, 2.3);
      typeAt.forEach((t, i) => {
        tl.set("#typed .ch:nth-child(" + (i + 1) + ")", { display: "block" }, t);
      });
      [2.3, 2.8, 3.3, 3.8, 4.3].forEach((t, i) => {
        tl.set("#cur", { opacity: i % 2 === 0 ? 1 : 0 }, t);
      });

      /* 6. send pressed (4.2) */
      F("#bSend", { scale: 1 }, { scale: 0.9, duration: 0.06, ease: "power2.out" }, 4.14);
      F("#bSend", { scale: 0.9 }, { scale: 1, duration: 0.2, ease: BACK }, 4.2);
      tl.to("#hint", { opacity: 0, duration: 0.25, ease: EIO }, 4.2);

      /* 7. input box morphs into a browser window (4.4 - 5.3) */
      F(["#typed", "#av", "#bAtt", "#bSend"], { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "none" }, 4.4);
      F(
        "#morph",
        { width: 920, height: 88, borderRadius: 44 },
        { width: 1440, height: 820, borderRadius: 18, duration: 0.75, ease: EIO },
        4.55
      );
      // colour flips early, while the shape is still small, so the growth never passes through a large mid-grey slab
      F(
        "#morph",
        { backgroundColor: "#111111", borderColor: "rgba(229,229,229,0)", boxShadow: "0px 0px 0px 0px rgba(0,0,0,0)" },
        { backgroundColor: "#f6f1e8", borderColor: "rgba(29,22,18,0.10)", boxShadow: "0px 30px 80px 0px rgba(0,0,0,0.12)", duration: 0.3, ease: EXPO },
        4.55
      );
      F("#tbar", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: EIO }, 4.85);

      /* 8. generated page blocks (5.2 - 6.2) */
      const blocks = [
        ["#pbar", 5.00],
        ["#pnav", 5.00],
        ["#ph1", 5.06],
        ["#phero", 5.10],
        ["#psub", 5.12],
        ["#pbtn", 5.18],
        ["#prate", 5.22],
        ["#phead", 5.26],
        ["#pprods .pp:nth-child(1)", 5.30],
        ["#pprods .pp:nth-child(2)", 5.35],
        ["#pprods .pp:nth-child(3)", 5.40],
        ["#pprods .pp:nth-child(4)", 5.45],
        ["#pcards", 5.50],
      ];
      blocks.forEach(([sel, at]) => {
        F(sel, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: EXPO }, at);
      });

      /* 9. slow push-in (6.2 - 7.0) */
      F("#stage", { scale: 1 }, { scale: 1.03, duration: 0.8, ease: "none" }, 6.2);

      /* 10. window shrinks to a gallery card (7.0 - 7.8) */
      F("#grp", { scale: 1, x: 0, y: 0 }, { scale: 0.26, x: -207, y: -16.5, duration: 0.8, ease: EXPO }, 7.0);
      tl.to("#tbar", { opacity: 0, duration: 0.3, ease: EIO }, 7.0);
      F("#mainlab", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: EIO }, 7.3);

      /* 11. the other eleven cards appear around it (7.6 - 8.6) */
      cells.forEach((_, rank) => {
        F("#cell" + rank, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: EXPO }, 7.6 + rank * 0.04);
      });
      F("#stage", { scale: 1.03, x: 0, y: 0 }, { scale: 1.08, x: -24, y: -14, duration: 1.0, ease: "none" }, 7.6);

      /* 12. bookend: gallery leaves, the opening line returns and thickens into the wordmark pill (8.8 - 9.9) */
      F("#stage", { opacity: 1, scale: 1.08 }, { opacity: 0, scale: 1.02, duration: 0.5, ease: EIO }, 8.8);
      F("#endpill", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: EIO }, 9.15);
      F("#endpill", { height: 3, borderRadius: 1.5 }, { height: 112, borderRadius: 56, duration: 0.3, ease: EXPO }, 9.35);
      F("#wm", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: EXPO }, 9.42);
      F("#wmsub", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: EXPO }, 9.65);
      // residual drift on the hold
      F("#endpill", { scale: 1 }, { scale: 1.025, duration: 1.4, ease: "none" }, 9.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
