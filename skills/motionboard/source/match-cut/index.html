<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --acc: #e8734a;
        --inter: "Inter", sans-serif;
        --mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0c0c0e; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0c0c0e; -webkit-font-smoothing: antialiased; font-family: var(--inter); }
      #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

      .sc { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; overflow: visible; font-family: var(--inter); }
      .win { position: absolute; display: flex; flex-direction: column; overflow: hidden; }
      .row { display: flex; align-items: center; }
      .col { display: flex; flex-direction: column; }
      .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 600; flex: none; }
      svg.i { flex: none; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .slot { display: block; flex: none; }
      .tl { display: block; width: 12px; height: 12px; border-radius: 50%; }
      .nw { white-space: nowrap; }
      .mono { font-family: var(--mono); }
      .kr { opacity: 0; }
      .stack { display: grid; }
      .stack > * { grid-area: 1 / 1; }

      /* the anchor: one avatar, same place and size in every scene */
      #av { position: absolute; left: 724px; top: 394px; width: 112px; height: 112px; border-radius: 50%; background: var(--acc); color: #fff; z-index: 50; }
      #avi { position: absolute; left: 0; top: 0; width: 112px; height: 112px; text-align: center; font: 600 45px/112px var(--inter); }
      #avg { position: absolute; left: 28px; top: 28px; width: 56px; height: 56px; opacity: 0; }
      #wm { position: absolute; left: 931px; top: 468px; font: 600 128px/144px var(--inter); letter-spacing: -0.035em; color: #f4f4f5; opacity: 0; white-space: nowrap; }

      #s1 { background: radial-gradient(1200px 800px at 20% 10%, #6d83c9 0%, #4a5aa8 38%, #2e2f6b 100%); }
      #s2 { background: #ffffff; }
      #s3 { background: #0b0c0d; }
      #s4 { background: #ffffff; }
      #s5 { background: #141416; }
      #s6 { background: radial-gradient(110% 90% at 72% 8%, #3a2219 0%, #17110f 45%, #09090a 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0" data-layout-allow-overlap>
        <div id="s1" class="sc" data-layout-allow-overlap><div class="cam" style="width:1500px;height:1000px"></div></div>
        <div id="s2" class="sc" data-layout-allow-overlap><div class="cam" style="width:1600px;height:1000px"></div></div>
        <div id="s3" class="sc" data-layout-allow-overlap><div class="cam" style="width:1600px;height:1000px"></div></div>
        <div id="s4" class="sc" data-layout-allow-overlap><div class="cam" style="width:1600px;height:1000px"></div></div>
        <div id="s5" class="sc" data-layout-allow-overlap><div class="cam" style="width:1400px;height:756px"></div></div>
        <div id="s6" class="sc" data-layout-allow-overlap><div class="cam" style="width:1600px;height:1000px"></div></div>

        <div id="av" data-layout-allow-overlap>
          <div id="avi">MC</div>
          <svg id="avg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
            <path d="M12 2.5 19 10 12 17.5 5 10Z" fill="#fff" fill-opacity="0.95" stroke="none" />
            <path d="M12 2.5v15M5 10h14" stroke="#e8734a" stroke-width="1.3" />
            <path d="M12 17.5c-1.6 1.6-2.4 2.6-1.4 4.1" />
          </svg>
        </div>
        <div id="wm">Kite</div>
      </div>
    </div>

    <script>
      const EXPO = "expo.out";
      const AX = 780, AY = 450, D = 112;

      /* ---------- icons (lucide-style, 24 grid, 1.5 stroke) ---------- */
      const ICONS = {
        hash: '<line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/>',
        search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
        chevDown: '<path d="m6 9 6 6 6-6"/>',
        chevRight: '<path d="m9 18 6-6-6-6"/>',
        chevLeft: '<path d="m15 18-6-6 6-6"/>',
        arrowLeft: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
        arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
        home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
        msg: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
        msgSq: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
        bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
        clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
        star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
        plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
        more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        calendar: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
        video: '<path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
        videoOff: '<path d="M10.66 5H14a2 2 0 0 1 2 2v2.34l1 1L22 7v10"/><path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2l10 10Z"/><line x1="2" x2="22" y1="2" y2="22"/>',
        mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
        micOff: '<line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
        user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
        link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
        pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
        pr: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/>',
        branch: '<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
        commit: '<circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/>',
        circleDot: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/>',
        circleCheck: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
        inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
        layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
        send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
        smile: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/>',
        bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
        help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
        shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
        upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
        monitor: '<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>',
        file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
        tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5"/>',
        flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
        cmd: '<path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>',
        edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
        panel: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
        spark: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M17 19h4"/>',
        bars: '<line x1="6" x2="6" y1="20" y2="14"/><line x1="12" x2="12" y1="20" y2="9"/><line x1="18" x2="18" y1="20" y2="4"/>',
        box: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
        lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
        eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
        fork: '<circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/>',
        headphones: '<path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>',
        trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
        refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
        settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>'
      };
      const ic = (n, s = 16, w = 1.5) => '<svg class="i" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" stroke-width="' + w + '">' + ICONS[n] + "</svg>";

      /* ---------- people ---------- */
      const P = {
        maya: ["MC", "#e8734a"], liam: ["LO", "#3b82c4"], priya: ["PN", "#2f9e77"], daniel: ["DK", "#8b5cf6"],
        sofia: ["SR", "#d6498b"], ethan: ["EW", "#b7791f"], hannah: ["HB", "#0e8f9c"], omar: ["OH", "#64748b"], aisha: ["AK", "#c2410c"]
      };
      const av = (k, s, x) => '<span class="av" style="width:' + s + "px;height:" + s + "px;background:" + P[k][1] + ";font-size:" + Math.round(s * 0.4) + "px;" + (x || "") + '">' + P[k][0] + "</span>";
      const slot = (s, x) => '<i class="slot" style="width:' + s + "px;height:" + s + "px;" + (x || "") + '"></i>';
      const dot = (c, s, x) => '<i style="display:block;flex:none;width:' + s + "px;height:" + s + "px;border-radius:50%;background:" + c + ";" + (x || "") + '"></i>';
      const tool = (n, bg, s, r) => '<span class="row" style="width:' + s + "px;height:" + s + "px;border-radius:" + (r || 6) + "px;background:" + bg + ';color:#fff;justify-content:center;flex:none">' + ic(n, Math.round(s * 0.58), 1.8) + "</span>";

      /* ================= scene 1: Slate (team chat) ================= */
      const sbItem = (icon, text, o) => {
        o = o || {};
        return '<div class="row" style="height:28px;margin:0 8px;padding:0 8px;gap:8px;border-radius:6px;font-size:15px;line-height:28px;color:' + (o.on || o.b ? "#fff" : "rgba(255,255,255,.72)") + ";font-weight:" + (o.b ? 700 : 400) + ";background:" + (o.on ? "#1264a3" : "transparent") + '">' + icon + '<span class="nw" style="flex:1">' + text + "</span>" + (o.n ? '<span style="background:#e01e5a;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 6px;line-height:15px">' + o.n + "</span>" : "") + "</div>";
      };
      const ch = (t, o) => sbItem(ic("hash", 14, 2), t, o);
      const dm = (k, t, on) => sbItem('<span style="position:relative;display:block;width:20px;height:20px;flex:none">' + av(k, 20, "font-size:9px") + '<i style="position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:50%;background:' + (on ? "#2bac76" : "#4b2150") + ";border:2px solid #4b2150;box-shadow:inset 0 0 0 1px " + (on ? "#2bac76" : "rgba(255,255,255,.6)") + '"></i></span>', t);
      const secHead = (t) => '<div class="row" style="height:28px;margin:6px 8px 0;padding:0 8px;gap:6px;font-size:15px;color:rgba(255,255,255,.72)">' + ic("chevDown", 13, 2) + t + "</div>";
      const rail = (i, t, on, badge) => '<div class="col" style="align-items:center;gap:3px;font-size:11px;color:rgba(255,255,255,.85);position:relative"><span class="row" style="width:36px;height:36px;border-radius:9px;justify-content:center;background:' + (on ? "rgba(255,255,255,.22)" : "transparent") + '">' + ic(i, 20, 1.6) + "</span>" + t + (badge ? '<i style="position:absolute;right:11px;top:-2px;width:10px;height:10px;border-radius:50%;background:#e01e5a;border:2px solid #2f1034"></i>' : "") + "</div>";
      const rxn = (inner, on) => '<span class="row nw" style="height:24px;padding:0 8px;gap:5px;border-radius:12px;font-size:12px;font-weight:600;border:1px solid ' + (on ? "#1264a3" : "#dddddd") + ";background:" + (on ? "#e8f5fa" : "#f8f8f8") + ";color:" + (on ? "#0b4c8c" : "#616061") + '">' + inner + "</span>";
      const mhead = (name, time) => '<div class="row nw" style="gap:8px;height:22px"><b style="font-size:15px;font-weight:700;color:#1d1c1d">' + name + '</b><span style="font-size:12px;color:#616061">' + time + "</span></div>";
      const mrow = (h, left, body) => '<div class="row" style="align-items:flex-start;height:' + h + 'px;padding:8px 20px;gap:10px;overflow:hidden">' + left + '<div class="col" style="flex:1;min-width:0">' + body + "</div></div>";
      const mtext = (t) => '<div style="font-size:15px;line-height:22px;color:#1d1c1d;width:440px">' + t + "</div>";

      document.querySelector("#s1 .cam").innerHTML =
        '<div class="win" style="left:100px;top:40px;width:1300px;height:900px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 40px 90px rgba(10,8,40,.5)">' +
        '<div class="row" style="height:44px;flex:none;background:#3a1840;padding:0 16px;gap:14px;color:rgba(255,255,255,.7)">' +
        '<span class="row" style="gap:8px"><i class="tl" style="background:#ff5f57"></i><i class="tl" style="background:#febc2e"></i><i class="tl" style="background:#28c840"></i></span><span style="width:40px"></span>' + ic("arrowLeft", 16) + ic("arrowRight", 16) + ic("clock", 16) +
        '<div class="row" style="flex:1;max-width:560px;margin:0 auto;height:28px;border-radius:7px;background:rgba(255,255,255,.2);padding:0 10px;gap:8px;color:#fff;font-size:13px">' + ic("search", 14) + "Search Northwind</div>" + ic("help", 17) + "</div>" +
        '<div class="row" style="flex:1;align-items:stretch;min-height:0">' +
        /* rail */
        '<div class="col" style="width:64px;flex:none;background:#2f1034;align-items:center;padding:12px 0;gap:16px"><span class="row" style="width:38px;height:38px;border-radius:10px;background:#fff;color:#3a1840;justify-content:center;font-weight:800;font-size:19px">N</span>' +
        rail("home", "Home", true) + rail("msg", "DMs", false, true) + rail("bell", "Activity", false) + rail("more", "More", false) +
        '<div class="col" style="margin-top:auto;align-items:center;gap:14px"><span class="row" style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);justify-content:center;color:#fff">' + ic("plus", 18, 2) + '</span><span style="position:relative;display:block;width:38px;height:38px">' + av("maya", 38) + '<i style="position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:#2bac76;border:2px solid #2f1034"></i></span></div></div>' +
        /* sidebar */
