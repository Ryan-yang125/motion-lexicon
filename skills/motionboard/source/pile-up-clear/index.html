<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #17171c;
        --sub: #5d5d69;
        --mut: #8e8e9a;
        --line: #e7e7ec;
        --line2: #f1f1f4;
        --brand: #2f55e4;
        --red: #e5484d;
        --green: #2fb36a;
        --side: #f7f7f9;
        --font-ui: "Inter", -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #dfe3f3; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #dfe3f3;
        font-family: var(--font-ui); color: var(--ink); -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .a { position: absolute; }
      svg { display: block; flex: none; }

      /* ---------- desktop ---------- */
      #wall {
        opacity: 0;
        background:
          radial-gradient(ellipse 60% 70% at 6% 100%, rgba(255, 196, 170, 0.9) 0%, rgba(255, 196, 170, 0) 70%),
          radial-gradient(ellipse 55% 65% at 98% 6%, rgba(120, 150, 255, 0.95) 0%, rgba(120, 150, 255, 0) 70%),
          radial-gradient(ellipse 50% 55% at 62% 106%, rgba(190, 170, 255, 0.7) 0%, rgba(190, 170, 255, 0) 70%),
          linear-gradient(150deg, #d4dbf6 0%, #e6def2 100%);
      }
      #menubar {
        position: absolute; left: 0; top: 0; width: 1920px; height: 30px; opacity: 0; z-index: 2;
        background: rgba(238, 240, 252, 0.6); font-size: 13.5px; font-weight: 500; color: #1d1d24; white-space: nowrap;
        display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
      }
      #menubar .l, #menubar .r { display: flex; align-items: center; gap: 22px; }
      #menubar .l b { font-weight: 700; }

      /* ---------- window ---------- */
      #win {
        position: absolute; left: 150px; top: 62px; width: 1600px; height: 900px;
        border-radius: 12px; overflow: hidden; background: #fff; opacity: 0.4;
        box-shadow: 0 0 0 1px rgba(20, 20, 40, 0.14), 0 2px 6px rgba(20, 20, 40, 0.1), 0 30px 70px rgba(30, 30, 80, 0.24), 0 80px 160px rgba(30, 30, 80, 0.2);
      }
      .tl { position: absolute; top: 19px; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.16); }

      /* sidebar */
      #side { position: absolute; left: 0; top: 0; width: 232px; height: 900px; background: var(--side); border-right: 1px solid var(--line); }
      .acct { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
      .acct .ch { color: var(--mut); }
      .compose { display: flex; align-items: center; gap: 8px; width: 200px; height: 34px; padding: 0 10px 0 12px; border-radius: 8px; background: var(--brand); color: #fff; font-size: 13px; font-weight: 600; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(20, 40, 120, 0.2); }
      .compose kbd { margin-left: auto; font-family: var(--font-ui); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.2); }
      .nav { display: flex; align-items: center; gap: 10px; width: 216px; height: 30px; padding: 0 10px; border-radius: 7px; font-size: 13px; font-weight: 500; color: #33333b; white-space: nowrap; }
      .nav > svg { color: #74747f; }
      .nav.on { background: #e9ebf4; color: var(--ink); }
      .nav.on > svg { color: var(--brand); }
      .nav .n { margin-left: auto; font-size: 12px; color: var(--mut); font-weight: 500; }
      .nav .badge { margin-left: auto; min-width: 22px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
      .shd { font-size: 11.5px; font-weight: 600; color: var(--mut); letter-spacing: 0.01em; }
      .lab { display: flex; align-items: center; gap: 10px; width: 216px; height: 28px; padding: 0 10px 0 12px; font-size: 13px; color: #33333b; white-space: nowrap; }
      .lab i { width: 9px; height: 9px; border-radius: 3px; }
      .lab .n { margin-left: auto; font-size: 12px; color: var(--mut); }

      /* main header */
      #head { position: absolute; left: 232px; top: 0; width: 1368px; height: 60px; border-bottom: 1px solid var(--line); background: #fff; z-index: 3; }
      .ttl { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
      .tabs { display: flex; align-items: center; gap: 24px; height: 60px; }
      .tab { position: relative; display: flex; align-items: center; gap: 7px; height: 60px; font-size: 13.5px; font-weight: 500; color: var(--sub); white-space: nowrap; }
      .tab .n { font-size: 12px; color: var(--mut); font-weight: 500; }
      .tab.on { color: var(--ink); font-weight: 600; }
      .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }
      .tab .cn { min-width: 24px; height: 18px; padding: 0 6px; border-radius: 9px; background: #fde4e4; color: #c62f34; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
      .search { display: flex; align-items: center; gap: 8px; width: 240px; height: 32px; padding: 0 8px 0 10px; border: 1px solid #e2e2e8; border-radius: 8px; font-size: 13px; color: var(--mut); background: #fafafb; }
      .search kbd { margin-left: auto; font-family: var(--font-ui); font-size: 11px; color: var(--sub); border: 1px solid #dedee5; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: #fff; }
      .ibtn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; color: #6a6a76; }
      #selbar { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 6px 0 12px; border-radius: 8px; background: #eef2fe; color: #1d3bb5; font-size: 13px; font-weight: 600; white-space: nowrap; opacity: 0; }
      #selbar .sb { display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; background: #fff; color: #33333b; font-weight: 500; font-size: 12px; box-shadow: 0 0 0 1px #d9e0fb; }
      #selbar kbd { font-family: var(--font-ui); font-size: 10.5px; color: var(--mut); }

      /* list */
      #list { position: absolute; left: 232px; top: 60px; width: 1368px; height: 840px; overflow: hidden; background: #fff; }
      #stack { position: absolute; left: 0; top: 0; width: 1368px; }
      .row { position: relative; display: flex; align-items: center; height: 52px; padding: 0 26px 0 16px; border-bottom: 1px solid var(--line2); white-space: nowrap; }
      .row > * { position: relative; z-index: 1; }
      .row .sel { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #eef2fe; opacity: 0; z-index: 0; }
      .row .sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--brand); }
      .row .fl { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #fff1f0; opacity: 0; z-index: 0; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); margin-right: 12px; flex: none; }
      .dot.r { background: transparent; }
      .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 600; flex: none; }
      .av.sq { border-radius: 7px; }
      .row .av { width: 28px; height: 28px; font-size: 11px; margin-right: 14px; }
      .from { width: 176px; flex: none; font-size: 13.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
      .from .c { font-weight: 500; color: var(--mut); margin-left: 4px; font-size: 12px; }
      .body { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
      .body b { font-weight: 600; color: var(--ink); }
      .body .pv { color: var(--mut); margin-left: 10px; }
      .row.rd .from, .row.rd .body b { font-weight: 500; color: #46464f; }
      .chip { display: inline-block; height: 20px; line-height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11.5px; font-weight: 600; margin-right: 9px; vertical-align: 1px; }
      .meta { display: flex; align-items: center; gap: 12px; margin-left: 24px; color: var(--mut); }
      .time { width: 64px; text-align: right; font-size: 12.5px; color: var(--mut); font-weight: 500; }
      .row:not(.rd) .time { color: var(--ink); font-weight: 600; }

      /* inbox zero */
      #zero { position: absolute; left: 232px; top: 60px; width: 1368px; height: 840px; overflow: hidden; opacity: 0; background: #1d2a63; }
      #zimg { position: absolute; left: 0; top: 0; width: 1368px; height: 840px; }
      #ztxt { position: absolute; left: 0; top: 150px; width: 1368px; display: flex; flex-direction: column; align-items: center; color: #fff; }
      #ztxt .h { display: flex; align-items: center; gap: 14px; font-size: 36px; line-height: 44px; font-weight: 600; letter-spacing: -0.025em; }
      #ztxt .s { margin-top: 10px; font-size: 15px; line-height: 22px; color: rgba(255, 255, 255, 0.78); font-weight: 500; }
      #ztxt .nx { margin-top: 26px; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.14); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2); font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, 0.92); white-space: nowrap; }
      #ztxt .nx span { color: rgba(255, 255, 255, 0.6); }

      /* ---------- notifications ---------- */
      #notifs { z-index: 6; }
      .nt {
        position: absolute; left: 1488px; top: 46px; width: 400px; height: 78px; border-radius: 16px; opacity: 0;
        background: rgba(246, 246, 249, 0.97); display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px 0 13px;
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.14), 0 10px 30px rgba(20, 20, 60, 0.2), 0 2px 6px rgba(20, 20, 60, 0.08);
      }
      .nt .ai { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 9px; flex: none; color: #fff; font-weight: 700; font-size: 16px; margin-top: 2px; }
      .nt .tx { flex: 1; min-width: 0; }
      .nt .t1 { display: flex; align-items: center; font-size: 13px; line-height: 17px; font-weight: 600; color: #1b1b21; white-space: nowrap; }
      .nt .t1 span { margin-left: auto; font-size: 12px; font-weight: 400; color: #8a8a94; }
      .nt .t2 { font-size: 13px; line-height: 17px; color: #2d2d35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
      .nt .t3 { font-size: 12px; line-height: 16px; color: #7a7a85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

      /* ---------- keyboard hint and toast ---------- */
      #hud {
        position: absolute; left: 818px; top: 866px; height: 52px; padding: 0 10px 0 10px; border-radius: 14px; opacity: 0; z-index: 7;
        background: #17171d; display: flex; align-items: center; gap: 8px; white-space: nowrap; color: #fff; font-size: 14px; font-weight: 500;
        box-shadow: 0 16px 40px rgba(15, 15, 40, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.07);
      }
      #hud .lbl { color: rgba(255, 255, 255, 0.72); margin: 0 10px 0 4px; }
      #hud .sep { width: 1px; height: 20px; background: rgba(255, 255, 255, 0.14); margin: 0 6px 0 0; }
      .key { position: relative; width: 34px; height: 34px; }
      .key .k { position: absolute; left: 0; top: 0; width: 34px; height: 32px; border-radius: 8px; background: #2c2c35; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 2px 0 #050508; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #fff; }
      .key .kd { position: absolute; left: 0; top: 2px; width: 34px; height: 32px; border-radius: 8px; background: var(--brand); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #fff; opacity: 0; }
      #toast {
        position: absolute; left: 406px; top: 872px; height: 42px; padding: 0 8px 0 12px; border-radius: 10px; opacity: 0; z-index: 7;
        display: flex; align-items: center; gap: 10px; white-space: nowrap;
        background: #17171d; color: #fff; font-size: 13.5px; font-weight: 500;
        box-shadow: 0 12px 30px rgba(15, 15, 40, 0.32), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      #toast .sp { width: 1px; height: 16px; background: rgba(255, 255, 255, 0.18); }
      #toast .un { color: #b9c6ff; font-weight: 600; }
      #toast kbd { font-family: var(--font-ui); font-size: 11px; color: #a9a9b6; background: rgba(255, 255, 255, 0.1); border-radius: 4px; padding: 2px 6px; }

      /* ---------- finish ---------- */
      #vig { pointer-events: none; z-index: 5; background: radial-gradient(ellipse at 50% 48%, rgba(20, 20, 50, 0) 62%, rgba(20, 20, 50, 0.16) 100%); }
      #end { opacity: 0; z-index: 4; background: #f7f7fa; }
      #lockup { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; align-items: center; justify-content: center; gap: 40px; padding-bottom: 60px; }
      #lockup .wm { font-size: 184px; line-height: 200px; font-weight: 600; letter-spacing: -0.055em; color: var(--ink); padding-bottom: 14px; }
      #wsub { position: absolute; left: 0; width: 1920px; top: 664px; text-align: center; font-size: 30px; line-height: 40px; font-weight: 500; color: #8a8a96; letter-spacing: -0.01em; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.8" data-width="1920" data-height="1080">
      <div id="scene" class="clip full" data-start="0" data-duration="10.8" data-track-index="0">
        <div id="drift" class="full" data-layout-allow-overlap>
          <div id="wall" class="full"></div>
          <div id="menubar">
            <div class="l">
              <svg width="14" height="16" viewBox="0 0 24 24" fill="#1d1d24"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
              <b>Cobalt</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Message</span><span>Window</span><span>Help</span>
            </div>
            <div class="r">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1d1d24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
              <svg width="22" height="17" viewBox="0 0 26 24" fill="none" stroke="#1d1d24" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="6" width="19" height="12" rx="3"/><path d="M24 10v4"/><rect x="4.5" y="8.5" width="12" height="7" rx="1.2" fill="#1d1d24" stroke="none"/></svg>
              <span>Wed Nov 4&nbsp;&nbsp;10:46 AM</span>
            </div>
          </div>

          <div id="win" data-layout-allow-overlap data-layout-ignore></div>
          <div id="notifs" class="full" data-layout-allow-overlap data-layout-allow-occlusion data-layout-ignore></div>
          <div id="hud"></div>
          <div id="toast"></div>
        </div>
      </div>

      <div id="vig" class="clip full" data-start="0" data-duration="10.8" data-track-index="1"></div>

      <div id="end" class="clip full" data-start="0" data-duration="10.8" data-track-index="2">
        <div id="lockup" data-layout-allow-overlap>
          <div id="mark">
            <svg width="172" height="172" viewBox="0 0 100 100">
              <defs>
                <linearGradient id="mg" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3a62f0"/><stop offset="1" stop-color="#2140c4"/></linearGradient>
                <clipPath id="mc"><rect width="100" height="100" rx="23"/></clipPath>
              </defs>
              <rect width="100" height="100" rx="23" fill="url(#mg)"/>
              <g clip-path="url(#mc)">
                <circle cx="50" cy="62" r="20" fill="#fff"/>
                <rect x="0" y="62" width="100" height="40" fill="url(#mg)"/>
                <rect x="20" y="66" width="60" height="5" rx="2.5" fill="#fff" opacity="0.92"/>
                <rect x="31" y="76" width="38" height="5" rx="2.5" fill="#fff" opacity="0.55"/>
              </g>
            </svg>
          </div>
          <div id="wm" class="wm">cobalt</div>
        </div>
        <div id="wsub">Inbox Zero, every day</div>
      </div>
    </div>

    <script>
      const EXPO = "expo.out";

      /* ---------- icons (lucide-style) ---------- */
      const ICON = {
        inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
        star: '<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
        clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
        file: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/>',
        cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
        alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
        chD: '<path d="m6 9 6 6 6-6"/>',
        pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
        clip: '<path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',
        sliders: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
        archive: '<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
        filter: '<path d="M22 3H2l8 9.5V19l4 2v-8.5z"/>',
        hash: '<path d="M4 9h16"/><path d="M4 15h16"/><path d="M10 3 8 21"/><path d="M16 3l-2 18"/>',
        bubble: '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 21l1.9-4.6A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>',
        tri: '<path d="M12 4 21 20H3z"/>',
        git: '<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7"/><path d="M18 10.5c0 4-6 3-11 6"/>',
        checkC: '<circle cx="12" cy="12" r="10" fill="#2fb36a" stroke="none"/><path d="m7.5 12.5 3 3 6-6.5" stroke="#fff"/>'
      };
      const ic = (n, s, sw, st) =>
        '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.5) +
        '" stroke-linecap="round" stroke-linejoin="round"' + (st ? ' style="' + st + '"' : "") + ">" + ICON[n] + "</svg>";

      const CHIP = {
        Urgent: ["#fde4e4", "#c62f34"],
        Customer: ["#dcf2ef", "#0f6b63"],
        Hiring: ["#ece6fb", "#5b3cc4"],
        Legal: ["#ececf0", "#4a4a55"],
        Invoice: ["#fdf0d5", "#8a5a00"],
        Product: ["#e3ebfd", "#1d3bb5"]
      };
      const chip = (k) => '<span class="chip" style="background:' + CHIP[k][0] + ";color:" + CHIP[k][1] + '">' + k + "</span>";

      /* ---------- mail: [from, initials, colour, square?, subject, preview, time, chip, attachment, count] ---------- */
      const INIT = [
        ["Dana Whitfield", "DW", "#e8803a", 0, "Offsite venue shortlist", "Three options in Sonoma, all hold 40 people. Prices in the sheet, holds expire Nov 12.", "8:12 AM", "", 1],
