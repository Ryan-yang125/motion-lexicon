<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --font-ui: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0b; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0b;
        font-family: var(--font-ui); color: #18181b; -webkit-font-smoothing: antialiased;
      }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .grow { flex: 1; }
      .ic { flex: none; display: block; }
      .ci { display: flex; flex: none; }

      /* ---------- light studio scenes ---------- */
      .studio {
        overflow: hidden; perspective: 1700px; perspective-origin: 50% 50%;
        background:
          radial-gradient(ellipse 70% 60% at 68% 36%, #f4f4f5 0%, rgba(244,244,245,0) 70%),
          linear-gradient(180deg, #d7d7d9 0%, #bdbdc0 100%);
      }
      .studio::after {
        content: ""; position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,0.26) 100%);
      }
      .win {
        position: absolute; left: 180px; top: 110px; width: 1560px; height: 860px;
        border-radius: 12px; overflow: hidden; background: #f4f4f5;
        box-shadow: 0 50px 120px rgba(20,20,24,0.34), 0 0 0 1px rgba(0,0,0,0.14);
        font-size: 13px; color: #3f3f46; font-variant-numeric: tabular-nums;
      }
      .side { position: absolute; left: 0; top: 0; width: 232px; height: 860px; overflow: hidden; }
      .panel {
        position: absolute; left: 232px; top: 8px; width: 1320px; height: 844px; overflow: hidden;
        background: #fff; border: 1px solid #e4e4e7; border-radius: 8px;
      }
      .tl { height: 44px; display: flex; align-items: center; gap: 8px; padding-left: 14px; }
      .tl i { display: block; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.18); }
      .ws { height: 32px; display: flex; align-items: center; padding: 0 8px 0 16px; margin-bottom: 8px; }
      .wn { margin-left: 9px; margin-right: 3px; font-size: 13px; font-weight: 600; color: #18181b; }
      .ws > .ic { color: #8b8f97; }
      .ib { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: #6c7078; flex: none; }
      .si { display: flex; align-items: center; gap: 8px; height: 28px; margin: 0 8px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #3f3f46; white-space: nowrap; }
      .si > .ic { color: #71717a; }
      .si.on { background: rgba(0,0,0,0.06); color: #18181b; }
      .si b { margin-left: auto; font-size: 11.5px; font-weight: 500; color: #8b8f97; }
      .si b.pill { background: #18181b; color: #fff; border-radius: 9px; padding: 1px 6px; font-size: 11px; }
      .sh { height: 28px; margin: 14px 8px 0; padding: 0 8px; display: flex; align-items: center; font-size: 12px; font-weight: 500; color: #8b8f97; }
      .dotc { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .foot { position: absolute; left: 0; bottom: 0; width: 232px; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 14px; }

      .ph { position: absolute; left: 0; top: 0; width: 1320px; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 16px; border-bottom: 1px solid #ececee; background: #fff; z-index: 3; }
      .crumb { font-size: 13px; color: #8b8f97; font-weight: 500; }
      .crumb.cur { color: #18181b; font-weight: 600; }
      .tabs { display: flex; gap: 4px; margin-left: 12px; }
      .tab { height: 26px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: #71717a; border: 1px solid transparent; }
      .tab.on { background: #f4f4f5; border-color: #e4e4e7; color: #18181b; }
      .tab em { font-style: normal; font-size: 11px; color: #8b8f97; }
      .btn { height: 28px; padding: 0 11px 0 9px; display: flex; align-items: center; gap: 6px; border-radius: 6px; font-size: 12.5px; font-weight: 600; background: #18181b; color: #fff; white-space: nowrap; }
      .btn.o { background: #fff; color: #27272a; border: 1px solid #d4d4d8; font-weight: 500; }
      .kbd { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,0.18); font-weight: 500; }
      .chip { height: 26px; padding: 0 9px; display: flex; align-items: center; gap: 6px; border: 1px solid #e4e4e7; border-radius: 6px; font-size: 12px; font-weight: 500; color: #3f3f46; white-space: nowrap; background: #fff; }
      .chip .mu { color: #8b8f97; font-weight: 400; }
      .av { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; color: #fff; flex: none; box-shadow: 0 0 0 2px #fff; }
      .av + .av { margin-left: -6px; }

      /* logs explorer */
      .qb { position: absolute; left: 0; top: 44px; width: 1040px; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #ececee; background: #fff; z-index: 2; }
      .qi { flex: 1; height: 36px; border: 1px solid #d4d4d8; border-radius: 8px; display: flex; align-items: center; gap: 9px; padding: 0 12px; font-family: var(--font-mono); font-size: 13px; color: #18181b; background: #fafafa; white-space: nowrap; box-shadow: 0 0 0 3px rgba(24,24,27,0.05); }
      .qi .k { color: #71717a; } .qi .v { color: #18181b; font-weight: 600; } .qi .p { color: #a1a1aa; }
      .hist { position: absolute; left: 0; top: 104px; width: 1040px; height: 196px; border-bottom: 1px solid #ececee; background: #fff; }
      .hh { height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 12.5px; color: #71717a; }
      .hh b { font-size: 15px; font-weight: 600; color: #18181b; }
      .lg { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #71717a; }
      .lg i { width: 8px; height: 8px; border-radius: 2px; display: block; }
      .thead { position: absolute; left: 0; top: 300px; width: 1040px; height: 32px; display: flex; align-items: center; padding: 0 16px; background: #fafafa; border-bottom: 1px solid #ececee; font-size: 11.5px; font-weight: 500; color: #8b8f97; z-index: 2; }
      .lrows { position: absolute; left: 0; top: 332px; width: 1040px; }
      .lr { height: 34px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #f4f4f5; font-size: 12.5px; white-space: nowrap; }
      .lr.sel { background: #f4f4f5; box-shadow: inset 2px 0 0 #18181b; }
      .c-t { width: 128px; font-family: var(--font-mono); font-size: 12px; color: #71717a; flex: none; }
      .c-l { width: 72px; flex: none; }
      .c-s { width: 132px; color: #3f3f46; font-weight: 500; flex: none; }
      .c-m { flex: 1; font-family: var(--font-mono); font-size: 12px; color: #27272a; overflow: hidden; }
      .c-r { width: 88px; font-family: var(--font-mono); font-size: 12px; color: #a1a1aa; text-align: right; flex: none; }
      .lv { display: inline-block; height: 18px; line-height: 17px; padding: 0 7px; border-radius: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em; }
      .lv.err { background: #18181b; color: #fff; }
      .lv.warn { background: #d4d4d8; color: #27272a; }
      .lv.info { border: 1px solid #d4d4d8; color: #71717a; line-height: 16px; }
      .facets { position: absolute; left: 1040px; top: 44px; width: 280px; bottom: 0; border-left: 1px solid #ececee; background: #fafafa; padding: 14px 16px; overflow: hidden; }
      .fh { font-size: 12px; font-weight: 600; color: #18181b; display: flex; align-items: center; margin: 12px 0 8px; }
      .fh:first-child { margin-top: 0; }
      .fr { display: flex; align-items: center; gap: 8px; height: 26px; font-size: 12.5px; color: #3f3f46; position: relative; }
      .fr .bar { position: absolute; left: 0; bottom: 3px; height: 2px; background: #d4d4d8; border-radius: 1px; }
      .fr .n { margin-left: auto; font-size: 11.5px; color: #8b8f97; }
      .tip { position: absolute; z-index: 5; height: 52px; padding: 8px 12px; border-radius: 8px; background: #18181b; color: #f4f4f5; font-size: 12px; line-height: 18px; box-shadow: 0 10px 28px rgba(0,0,0,0.3); white-space: nowrap; }
      .tip b { font-weight: 600; font-size: 13px; }
      .tip span { color: #a1a1aa; }

      /* trace view */
      .sum { position: absolute; left: 0; top: 44px; width: 980px; height: 84px; display: flex; align-items: center; padding: 0 20px; gap: 0; border-bottom: 1px solid #ececee; background: #fff; }
      .sttl { margin-right: auto; }
      .sttl .t { font-size: 15px; font-weight: 600; color: #18181b; display: flex; align-items: center; gap: 8px; }
      .sttl .s { margin-top: 5px; font-size: 12px; color: #71717a; font-family: var(--font-mono); }
      .stat { padding: 0 22px; border-left: 1px solid #ececee; height: 48px; }
      .stat .l { font-size: 11.5px; color: #8b8f97; }
      .stat .v { margin-top: 3px; font-size: 21px; font-weight: 600; color: #18181b; letter-spacing: -0.01em; }
      .stat .v small { font-size: 13px; font-weight: 500; color: #71717a; margin-left: 2px; }
      .ruler { position: absolute; left: 0; top: 128px; width: 980px; height: 30px; display: flex; border-bottom: 1px solid #ececee; background: #fafafa; font-size: 11px; color: #8b8f97; }
      .ruler .nm { width: 380px; padding: 0 20px; display: flex; align-items: center; font-weight: 500; }
      .ruler .tk { position: absolute; top: 0; height: 30px; display: flex; align-items: center; padding-left: 6px; border-left: 1px solid #e4e4e7; font-family: var(--font-mono); font-size: 10.5px; }
      .wf { position: absolute; left: 0; top: 158px; width: 980px; }
      .wr { position: relative; height: 40px; display: flex; align-items: center; border-bottom: 1px solid #f4f4f5; font-size: 12.5px; }
      .wr.sel { background: #f4f4f5; box-shadow: inset 2px 0 0 #18181b; }
      .wr .nm { width: 380px; display: flex; align-items: center; gap: 7px; padding: 0 12px 0 20px; white-space: nowrap; color: #18181b; font-weight: 500; flex: none; }
      .wr .nm .sv { color: #8b8f97; font-weight: 400; font-size: 11.5px; }
      .wr .bx { position: absolute; left: 380px; top: 0; width: 580px; height: 40px; }
      .wr .gl { position: absolute; top: 0; width: 1px; height: 40px; background: #f0f0f2; }
      .wr .b { position: absolute; top: 12px; height: 16px; border-radius: 3px; background: #a1a1aa; transform-origin: 0 50%; }
      .wr .b.dk { background: #18181b; }
      .wr .b.md { background: #71717a; }
      .wr .b.lt { background: #c9c9ce; }
      .wr .d { position: absolute; top: 12px; height: 16px; line-height: 16px; font-family: var(--font-mono); font-size: 11px; color: #52525b; white-space: nowrap; }
      .detail { position: absolute; left: 980px; top: 44px; width: 340px; bottom: 0; border-left: 1px solid #ececee; background: #fafafa; padding: 16px 18px; overflow: hidden; }
      .detail .t { font-size: 15px; font-weight: 600; color: #18181b; display: flex; align-items: center; gap: 8px; }
      .detail .s { margin-top: 5px; font-size: 12px; color: #71717a; }
      .detail .h { margin: 18px 0 8px; font-size: 12px; font-weight: 600; color: #18181b; }
      .kv { display: flex; height: 27px; align-items: center; font-family: var(--font-mono); font-size: 11.5px; border-bottom: 1px solid #f0f0f2; }
      .kv .k { width: 150px; color: #8b8f97; flex: none; }
      .kv .v { color: #18181b; white-space: nowrap; }
      .ev { margin-top: 2px; padding: 9px 11px; border: 1px solid #e4e4e7; border-radius: 8px; background: #fff; font-size: 12px; color: #3f3f46; line-height: 17px; }
      .ev b { font-weight: 600; color: #18181b; }

      /* ---------- foreground balls ---------- */
      .ball {
        position: absolute; left: 0; top: 0; width: 2800px; height: 2800px; margin: -1400px 0 0 -1400px; border-radius: 50%;
        background:
          radial-gradient(ellipse 34% 17% at 63% 17%, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0) 100%),
          radial-gradient(circle at 63% 30%, #5b5b61 0%, #36363b 20%, #19191c 46%, #09090a 74%, #030304 100%);
        box-shadow:
          inset -110px 140px 190px -70px rgba(214,214,222,0.46),
          inset -26px 34px 60px -6px rgba(255,255,255,0.22),
          inset 70px -90px 150px -50px rgba(150,150,162,0.20);
        filter: blur(54px);
      }
      .sph {
        position: absolute; left: 0; top: 0; border-radius: 50%;
        background:
          radial-gradient(ellipse 34% 17% at 63% 17%, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 100%),
          radial-gradient(circle at 63% 30%, #56565c 0%, #2c2c30 30%, #0e0e10 70%, #050506 100%);
        box-shadow: inset -12px 16px 22px -8px rgba(214,214,222,0.4);
      }

      /* ---------- dark scene ---------- */
      .dark { overflow: hidden; background: radial-gradient(ellipse 80% 70% at 50% 50%, #131315 0%, #060607 100%); }
      .halo { position: absolute; border-radius: 50%; }
      #num { position: absolute; left: 0; top: 262px; width: 1920px; height: 460px; display: flex; align-items: baseline; justify-content: center; font-weight: 600; color: #f4f4f5; }
      #n { width: 640px; display: flex; justify-content: flex-end; font-size: 470px; line-height: 1; letter-spacing: -0.055em; font-variant-numeric: tabular-nums; }
      #u { margin-left: 22px; width: 250px; font-size: 130px; line-height: 1; letter-spacing: -0.03em; color: #b4b4ba; font-weight: 500; }
      #lbl { position: absolute; left: 0; top: 218px; width: 1920px; text-align: center; font-size: 32px; font-weight: 500; color: #d0d0d5; letter-spacing: -0.005em; }
      #qpill { position: absolute; left: 560px; top: 752px; width: 800px; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 22px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.09); font-family: var(--font-mono); font-size: 22px; color: #ffffff; white-space: nowrap; }
      #qpill .k { color: #b4b4ba; } #qpill .p { color: #8a8a90; }
      #specs { position: absolute; left: 360px; top: 876px; width: 1200px; height: 120px; display: flex; }
      .sp { flex: 1; padding-left: 32px; border-left: 1px solid rgba(255,255,255,0.28); }
      .sp:first-child { border-left: 0; padding-left: 0; }
      .sp .v { font-size: 64px; line-height: 70px; font-weight: 600; color: #ffffff; letter-spacing: -0.03em; }
      .sp .l { margin-top: 4px; font-size: 24px; color: #b4b4ba; }
      #spark { position: absolute; left: 1384px; top: 754px; width: 190px; height: 56px; }

      /* ---------- flash ---------- */
      #glow { position: absolute; left: 0; top: 0; width: 5200px; height: 5200px; margin: -2600px 0 0 -2600px; border-radius: 50%; background: radial-gradient(circle closest-side, #ffffff 0%, #ffffff 42%, rgba(255,255,255,0.55) 66%, rgba(255,255,255,0) 100%); }
      #plate { background: #ffffff; }

      /* ---------- wordmark ---------- */
      #lock { display: flex; align-items: center; justify-content: center; gap: 40px; }
      #mk { position: relative; z-index: 2; width: 160px; height: 160px; flex: none; }
      #wm { position: relative; z-index: 1; width: 640px; flex: none; font-size: 190px; line-height: 1; font-weight: 600; letter-spacing: -0.045em; color: #f4f4f5; white-space: nowrap; }
      #tag { position: absolute; left: 0; top: 664px; width: 1920px; text-align: center; font-size: 30px; font-weight: 400; color: #8a8a90; letter-spacing: 0; }
      #seed { position: absolute; left: 0; top: 0; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; background: radial-gradient(circle closest-side, #ffffff 0%, rgba(255,255,255,0.8) 16%, rgba(255,255,255,0.26) 50%, rgba(255,255,255,0) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11" data-width="1920" data-height="1080">

      <!-- scene 1: logs explorer, light studio -->
      <div id="s1" class="clip full studio" data-start="0" data-duration="2.6" data-track-index="0">
        <div id="sph1a" class="sph" data-layout-allow-overlap></div>
        <div id="sph1b" class="sph" data-layout-allow-overlap></div>
        <div id="tilt1" class="full" data-layout-allow-overlap>
          <div id="cam1" class="full" data-layout-allow-overlap>
            <div id="win1" class="win" data-layout-allow-overlap></div>
          </div>
        </div>
      </div>

      <!-- scene 2: parameter, dark -->
      <div id="s2" class="clip full dark" data-start="2.6" data-duration="2.5" data-track-index="0">
        <div id="cam2" class="full" data-layout-allow-overlap>
          <div id="h1" class="halo" data-layout-allow-overlap></div>
          <div id="h2" class="halo" data-layout-allow-overlap></div>
          <div id="ring" class="halo" data-layout-allow-overlap></div>
          <div id="lbl">p99 query latency</div>
          <div id="num" data-layout-allow-overlap><span id="n">412</span><span id="u">ms</span></div>
          <div id="qpill" data-layout-allow-overlap></div>
          <svg id="spark" viewBox="0 0 190 56"></svg>
          <div id="specs" data-layout-allow-overlap></div>
        </div>
      </div>

      <!-- scene 3: trace waterfall, light studio -->
      <div id="s3" class="clip full studio" data-start="5.1" data-duration="2.3" data-track-index="0">
        <div id="sph3a" class="sph" data-layout-allow-overlap></div>
        <div id="tilt3" class="full" data-layout-allow-overlap>
          <div id="cam3" class="full" data-layout-allow-overlap>
            <div id="win3" class="win" data-layout-allow-overlap></div>
          </div>
        </div>
      </div>

      <!-- scene 4: wordmark -->
      <div id="s4" class="clip full dark" data-start="7.4" data-duration="3.6" data-track-index="0">
        <div id="h4a" class="halo" data-layout-allow-overlap></div>
        <div id="h4b" class="halo" data-layout-allow-overlap></div>
        <div id="cam4" class="full" data-layout-allow-overlap>
          <div id="lock" class="full" data-layout-allow-overlap>
            <svg id="mk" viewBox="0 0 100 100"><g fill="#f4f4f5"><path d="M50 98L40.5 42L50 6L59.5 42Z"/><path d="M3 10H22L35 42V74Z"/><path d="M97 10H78L65 42V74Z"/></g></svg>
            <div id="wm">Gannet</div>
          </div>
          <div id="tag">Search every event. In 38 ms.</div>
        </div>
      </div>

      <!-- wipe balls -->
      <div id="ov1" class="clip full" data-start="0" data-duration="3.0" data-track-index="5" style="z-index:5;pointer-events:none">
        <div id="ball1" class="ball" data-layout-allow-overlap data-layout-ignore></div>
      </div>
      <div id="ov3" class="clip full" data-start="5.1" data-duration="3.0" data-track-index="5" style="z-index:5;pointer-events:none">
        <div id="ball3" class="ball" data-layout-allow-overlap data-layout-ignore></div>
      </div>

      <div id="ov4" class="clip full" data-start="7.4" data-duration="1.3" data-track-index="7" style="z-index:8;pointer-events:none">
        <div id="seed" data-layout-allow-overlap></div>
      </div>

      <!-- flash -->
      <div id="fl" class="clip full" data-start="4.7" data-duration="1.2" data-track-index="6" style="z-index:6;pointer-events:none">
        <div id="plate" class="full"></div>
        <div id="glow" data-layout-allow-overlap></div>
      </div>
    </div>

    <script>
      const EXPO = "expo.out";
      const FPS = 30;
      const fr = (f) => f / FPS;

      /* ---------- icons: 16px grid, 1.5 stroke ---------- */
      const IC = {
        search: '<circle cx="7" cy="7" r="4.25"/><path d="M10.2 10.2l3 3"/>',
        compose: '<path d="M7 3H4.5A1.5 1.5 0 0 0 3 4.5v7A1.5 1.5 0 0 0 4.5 13h7a1.5 1.5 0 0 0 1.5-1.5V9"/><path d="M11.2 2.8a1.2 1.2 0 0 1 1.7 1.7L8 9.4 5.8 10l.6-2.2z"/>',
        chev: '<path d="M4.5 6.5L8 10l3.5-3.5"/>',
        logs: '<path d="M3.5 4h9M3.5 8h9M3.5 12h5.5"/>',
        dash: '<rect x="2.5" y="2.5" width="4.5" height="5" rx="1"/><rect x="9" y="2.5" width="4.5" height="3" rx="1"/><rect x="2.5" y="9.5" width="4.5" height="4" rx="1"/><rect x="9" y="7.5" width="4.5" height="6" rx="1"/>',
        bell: '<path d="M4.2 11V7.2a3.8 3.8 0 0 1 7.6 0V11l1 1.5H3.2z"/><path d="M6.7 14h2.6"/>',

      tl.set(".l0", { background: "transparent", boxShadow: "none" }, 1.35);
      // spheres drift left a little faster than the window (parallax)
      F("#sph1a", { x: 1500 }, { x: 1430, duration: 2.6, ease: "none" }, 0);
      F("#sph1b", { x: 1740 }, { x: 1690, duration: 2.6, ease: "none" }, 0);

      /* ----- wipe 1: big defocused matte ball from the left foreground ----- */
      const W1 = fr(72);           // wipe starts, frame 72
      F("#ball1", { x: -420, y: 700, scale: 0.42 }, { x: -380, y: 690, scale: 0.45, duration: W1, ease: "none" }, 0);
      tl.to("#ball1", { x: 960, y: 540, scale: 1, duration: fr(7), ease: EXPO }, W1);               // 7 frames, fast then slow
      tl.to("#ball1", { x: 3700, y: 520, scale: 1.08, duration: fr(8), ease: "power2.in" }, W1 + fr(7)); // exits right
      // swap frame = 78 (2.6 s): s1 ends, s2 begins (clip boundaries)

      /* ----- scene 2 (2.6 - 5.1): dark, big parameter ----- */
      tl.set("#lbl", { opacity: 0 }, 0);
      tl.to("#lbl", { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.6);
      tl.set("#n", { opacity: 0 }, 0);
      tl.to("#n", { opacity: 1, duration: 0.1, ease: "none" }, 2.6);
      // count 412 -> 38, one value per frame from 2.75
      (function () {
        const f0 = 82, N = 36;
        for (let k = 0; k <= N; k++) {
          const p = 1 - Math.pow(1 - k / N, 4);
          tl.set("#n", { textContent: String(Math.round(412 + (38 - 412) * p)) }, (f0 + k) / FPS);
        }
      })();
      tl.set("#u", { opacity: 0 }, 0);
      tl.to("#u", { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.6);
      tl.set(["#qpill", "#spark"], { opacity: 0, y: 14 }, 0);
      tl.to(["#qpill", "#spark"], { opacity: 1, y: 0, duration: 0.8, ease: EXPO, stagger: 0.08 }, 3.25);
      tl.set(".sp", { opacity: 0, y: 12 }, 0);
      tl.to(".sp", { opacity: 1, y: 0, duration: 0.8, ease: EXPO, stagger: 0.1 }, 3.5);
      F("#ring", { scale: 0.86 }, { scale: 1.0, duration: 2.5, ease: "none" }, 2.6);
      F("#cam2", { scale: 1.0 }, { scale: 1.05, duration: 2.5, ease: "none" }, 2.6);
      gsap.set("#cam2", { transformOrigin: "960px 540px" });

      /* ----- flash 1: radial glow, 8 frames linear to full white, 9 frames back ----- */
      const F2 = fr(153);                 // full-white frame = 5.1 s, s2 -> s3 swap
      tl.set("#plate", { opacity: 0 }, 0);
      tl.set("#glow", { scale: 0.05, opacity: 0 }, 0);
      tl.set("#glow", { opacity: 1 }, F2 - fr(8));
      tl.to("#glow", { scale: 1.5, duration: fr(8), ease: "none" }, F2 - fr(8));
      tl.set("#plate", { opacity: 1 }, F2 - fr(1));           // white fully covers the frame before the swap
      tl.set("#glow", { opacity: 0 }, F2);
      tl.to("#plate", { opacity: 0, duration: fr(9), ease: "power3.out" }, F2);   // 9 frames, cubic-bezier(.33,1,.68,1)

      /* ----- scene 3 (5.1 - 7.4): trace waterfall, tilt the other way ----- */
      gsap.set("#cam3", { transformOrigin: "1140px 470px" });
      gsap.set("#tilt3", { transformOrigin: "960px 540px" });
      F("#cam3", { scale: 1.42, x: 70, y: -10 }, { scale: 1.5, x: -50, y: -30, duration: 2.3, ease: "none" }, 5.1);
      F("#tilt3", { rotationY: -10, rotationX: 3, rotation: 1.1 }, { rotationY: -6, rotationX: 2, rotation: 0.6, duration: 2.3, ease: "none" }, 5.1);
      tl.set(".wr .b", { scaleX: 0 }, 0);
      tl.to(".wr .b", { scaleX: 1, duration: 0.7, ease: EXPO, stagger: 0.07 }, 5.18);
      tl.set(".wr .d", { opacity: 0 }, 0);
      tl.to(".wr .d", { opacity: 1, duration: 0.4, ease: "power1.out", stagger: 0.07 }, 5.4);
      F("#sph3a", { x: 1650 }, { x: 1590, duration: 2.3, ease: "none" }, 5.1);

      /* ----- wipe 2 ----- */
      const W2 = fr(216);          // 7.2 s, swap frame 222 = 7.4 s
      F("#ball3", { x: -500, y: 800, scale: 0.38 }, { x: -470, y: 790, scale: 0.4, duration: W2 - 5.1, ease: "none" }, 5.1);
      tl.to("#ball3", { x: 960, y: 540, scale: 1, duration: fr(7), ease: EXPO }, W2);
      tl.to("#ball3", { x: 3700, y: 560, scale: 1.08, duration: fr(8), ease: "power2.in" }, W2 + fr(7));

      /* ----- scene 4 (7.4 - 10.4): glow seed -> mark -> wordmark ----- */
      const WM_W = 640, GAP = 40, MK_W = 160;
      const DX = (WM_W + GAP) / 2, EX = (WM_W - (MK_W + GAP)) / 2;   // mark centred on screen; word starts behind the mark
      gsap.set("#cam4", { transformOrigin: "960px 540px" });
      tl.set("#mk", { x: DX, opacity: 0, filter: "blur(26px)" }, 0);
      tl.set("#wm", { x: EX, opacity: 0, clipPath: "inset(-60px -60px -60px " + (MK_W / 2) + "px)", filter: "blur(12px)" }, 0);
      tl.set("#seed", { scale: 0.5, opacity: 0 }, 0);
      tl.set("#tag", { opacity: 0, y: 12 }, 0);
      tl.set(["#h4a", "#h4b"], { opacity: 0 }, 0);
      tl.to(["#h4a", "#h4b"], { opacity: 1, duration: 1.4, ease: "power2.out" }, 7.55);
      // seed glow tightens into the mark
      tl.to("#seed", { opacity: 1, scale: 0.9, duration: 0.12, ease: "none" }, 7.4);
      tl.to("#mk", { opacity: 1, duration: 0.3, ease: "none" }, 7.5);
      tl.to("#mk", { filter: "blur(0px)", duration: 0.7, ease: EXPO }, 7.5);
      tl.to("#seed", { opacity: 0, scale: 1.4, duration: 0.6, ease: "power2.out" }, 7.7);
      // mark slides left, word is pulled out from behind it
      tl.to("#mk", { x: 0, duration: 1.3, ease: EXPO }, 7.8);
      tl.to("#wm", { x: 0, duration: 1.3, ease: EXPO }, 7.8);
      tl.to("#wm", { clipPath: "inset(-60px -60px -60px " + (-GAP) + "px)", duration: 1.3, ease: EXPO }, 7.8);
      tl.to("#wm", { opacity: 1, duration: 0.4, ease: "power1.out" }, 7.8);
      tl.to("#wm", { filter: "blur(0px)", duration: 1.25, ease: EXPO }, 7.8);
      tl.to("#tag", { opacity: 1, y: 0, duration: 0.8, ease: EXPO }, 8.2);
      F("#cam4", { scale: 1.0 }, { scale: 1.05, duration: 3.6, ease: "none" }, 7.4);

      tl.set({}, {}, 11);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
