<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --accent: #ee6a2f;
        --accent-ink: #c2531f;
        --ink: #1d1d1f;
        --font-ui: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #efeff2; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #efeff2;
        font-family: var(--font-ui); color: var(--ink); -webkit-font-smoothing: antialiased;
      }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .ic { flex: none; display: block; }
      .ci { display: flex; flex: none; }
      .grow { flex: 1; min-width: 0; }

      #stage { z-index: 1; overflow: hidden; }
      #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

      /* ---------- wallpaper (extends past the screen for the close-up) ---------- */
      #wall {
        position: absolute; left: -400px; top: -300px; width: 2720px; height: 1700px;
        background:
          radial-gradient(520px 300px at 1000px 1290px, rgba(255, 160, 196, 0.7) 0%, rgba(255, 150, 190, 0) 100%),
          radial-gradient(560px 320px at 1640px 1360px, rgba(140, 186, 255, 0.85) 0%, rgba(140, 186, 255, 0) 100%),
          radial-gradient(600px 360px at 640px 1400px, rgba(255, 176, 120, 0.9) 0%, rgba(255, 176, 120, 0) 100%),
          radial-gradient(900px 700px at 300px 1300px, rgba(255, 196, 150, 0.95) 0%, rgba(255, 196, 150, 0) 70%),
          radial-gradient(1000px 760px at 1300px 1500px, rgba(255, 172, 200, 0.9) 0%, rgba(255, 172, 200, 0) 70%),
          radial-gradient(1100px 800px at 2300px 300px, rgba(164, 200, 255, 0.95) 0%, rgba(164, 200, 255, 0) 70%),
          radial-gradient(900px 700px at 400px 200px, rgba(222, 210, 255, 0.9) 0%, rgba(222, 210, 255, 0) 70%),
          linear-gradient(180deg, #f3eff4 0%, #f6efec 100%);
      }

      /* ---------- menu bar ---------- */
      #menubar {
        position: absolute; left: 0; top: 0; width: 1920px; height: 32px; z-index: 30; display: flex; align-items: center;
        padding: 0 30px; gap: 24px; background: rgba(255, 255, 255, 0.38); font-size: 15px; font-weight: 500; color: #1d1d1f;
      }
      #menubar b { font-weight: 700; }
      #menubar .r { display: flex; align-items: center; gap: 18px; color: #1d1d1f; }

      /* ---------- dock ---------- */
      #dock { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 20; }
      #plate {
        position: absolute; top: 990px; height: 84px; border-radius: 24px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.52) 0%, rgba(255, 255, 255, 0.34) 100%);
        backdrop-filter: blur(24px) saturate(1.7); -webkit-backdrop-filter: blur(24px) saturate(1.7);
        box-shadow: inset 0 0.75px 0 rgba(255, 255, 255, 0.95), inset 0 0 0 0.75px rgba(255, 255, 255, 0.55), 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 10px 28px rgba(60, 30, 50, 0.16);
      }
      .di { position: absolute; filter: drop-shadow(0 1.2px 1.4px rgba(0, 0, 0, 0.2)) drop-shadow(0 4px 7px rgba(40, 20, 40, 0.14)); }
      .di svg, .bigapp svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .di text, .bigapp text { font-family: "Inter", sans-serif; }
      #wrenslot { transform-origin: 50% 100%; }
      .dsep { position: absolute; top: 1003px; width: 1px; height: 58px; background: rgba(0, 0, 0, 0.16); }
      .ddot { position: absolute; top: 1066.5px; width: 4.5px; height: 4.5px; margin-left: -2.25px; border-radius: 50%; background: rgba(0, 0, 0, 0.62); }
      #tipbox {
        position: absolute; left: 0; top: 0; height: 24px; padding: 0 10px; border-radius: 7px; display: flex; align-items: center;
        background: rgba(242, 241, 243, 0.94); font-size: 13px; font-weight: 500; color: #1d1d1f; white-space: nowrap; opacity: 0;
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.14);
      }
      #spark { position: absolute; left: 0; top: 0; overflow: visible; }

      /* ---------- Wren window (medium shot is 1:1, no display frame) ---------- */
      #win {
        position: absolute; left: 110px; top: 48px; width: 1700px; height: 916px; z-index: 10; opacity: 0;
        border-radius: 14px; overflow: hidden; background: #fff; display: flex; font-size: 17px; color: #34312d; font-variant-numeric: tabular-nums;
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.28), 0 36px 90px rgba(50, 25, 50, 0.3), 0 10px 26px rgba(0, 0, 0, 0.1);
      }
      .lights { display: flex; gap: 9px; }
      .lights i { display: block; width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18); }
      .ib { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #6f6a63; flex: none; }
      .av { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; flex: none; }
      .stack { display: flex; }
      .stack .av { margin-left: -8px; box-shadow: 0 0 0 2px #fff; }
      .stack .av:first-child { margin-left: 0; }
      .kbd { font-size: 14px; font-weight: 500; color: #7a756e; background: #fff; border: 1px solid #e3e0dc; border-radius: 5px; padding: 0 7px; height: 24px; display: inline-flex; align-items: center; }
      .btn {
        height: 38px; padding: 0 16px 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 9px; font-size: 17px; font-weight: 600;
        background: var(--accent); color: #fff; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(200, 80, 30, 0.3); flex: none; white-space: nowrap;
      }

      /* sidebar */
      .sb { width: 276px; flex: none; background: #f5f3f0; border-right: 1px solid #e7e3de; position: relative; padding: 0 12px; }
      .sb .top { height: 64px; display: flex; align-items: center; padding-left: 10px; }
      .sr { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 10px; border-radius: 8px; font-size: 17px; font-weight: 500; color: #34312d; white-space: nowrap; }
      .sr > .ic, .sr > .ci { color: #8a847c; }
      .sr b { margin-left: auto; font-size: 15px; font-weight: 500; color: #a09a92; }
      .sr.on { background: #e8e3dc; color: #1f1d1a; }
      .sr.on b { color: #6f6a63; }
      .sh { height: 32px; margin-top: 16px; padding: 0 10px; display: flex; align-items: center; font-size: 14.5px; font-weight: 600; color: #a09a92; }
      .sh .ci { margin-left: auto; color: #a09a92; }
      .acct { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 10px; border-top: 1px solid #e7e3de; }
      .acct .n { font-size: 16px; font-weight: 600; color: #1f1d1a; line-height: 20px; }
      .acct .s { position: relative; height: 18px; width: 160px; font-size: 14px; color: #8f8981; line-height: 18px; }
      .acct .s span { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px; white-space: nowrap; }

      /* note list */
      .nl { width: 400px; flex: none; border-right: 1px solid #eceae7; position: relative; overflow: hidden; }
      .nl .hd { height: 64px; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 22px; }
      .nl .hd .t { font-size: 22px; font-weight: 700; color: #1f1d1a; }
      .nl .hd .c { font-size: 15px; color: #a09a92; margin-left: 8px; }
      .nl .sch { height: 40px; margin: 0 14px 12px; border-radius: 10px; background: #f3f1ee; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; color: #9a948c; font-size: 16px; }
      .nr { position: relative; height: 112px; margin: 0 10px; padding: 12px 14px 0; border-radius: 11px; }
      .nr::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 1px; background: #f0eeeb; }
      .nr.sel { background: #fcece2; }
      .nr.sel::after { display: none; }
      .nr .t { display: flex; align-items: center; gap: 6px; height: 24px; font-size: 18px; font-weight: 600; color: #1f1d1a; white-space: nowrap; }
      .nr .t span { overflow: hidden; text-overflow: ellipsis; }
      .nr .t .ci { color: #b0a9a0; }
      .nr .p { margin-top: 3px; height: 44px; font-size: 15.5px; line-height: 22px; color: #7a746c; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .nr .f { margin-top: 6px; height: 22px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #9a948c; white-space: nowrap; }
      .nr .f .m { display: flex; align-items: center; gap: 4px; }
      .tg { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: #f3efe9; color: #8b6f55; font-size: 14px; font-weight: 500; }
      .nr.sel .tg { background: #f8dccb; color: var(--accent-ink); }

      /* editor */
      .ed { flex: 1; min-width: 0; position: relative; }
      .ed .tb { height: 64px; display: flex; align-items: center; gap: 4px; padding: 0 16px 0 24px; border-bottom: 1px solid #f0eeeb; }
      .crumb { display: flex; align-items: center; gap: 8px; font-size: 17px; color: #8a847c; white-space: nowrap; }
      .crumb b { font-weight: 500; color: #34312d; }
      .tools { display: flex; align-items: center; gap: 2px; margin-left: 28px; }
      .vsep { width: 1px; height: 22px; background: #e7e3de; margin: 0 8px; }
      .eb { position: absolute; left: 0; top: 64px; right: 0; bottom: 0; overflow: hidden; }
      .doc { position: absolute; left: 56px; top: 26px; width: 860px; }
      .doc h1 { height: 50px; font-size: 40px; line-height: 50px; font-weight: 700; letter-spacing: -0.02em; color: #1c1a17; white-space: nowrap; }
      .meta { margin-top: 10px; height: 26px; display: flex; align-items: center; gap: 10px; font-size: 15.5px; color: #8f8981; white-space: nowrap; }
      .meta .tg { background: #fcece2; color: var(--accent-ink); }
      .meta .ed2 { position: relative; width: 140px; height: 22px; }
      .meta .ed2 span { position: absolute; left: 0; top: 0; line-height: 22px; }
      .doc p, .doc .ln { font-size: 20px; line-height: 30px; color: #34312d; white-space: nowrap; }
      .doc .pp { margin-top: 16px; height: 60px; }
      .doc h2 { margin-top: 20px; height: 34px; display: flex; align-items: center; font-size: 26px; line-height: 34px; font-weight: 650; letter-spacing: -0.01em; color: #1c1a17; white-space: nowrap; }
      .doc h2 .cnt { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 500; color: #8f8981; }
      .doc h2 .bar { width: 80px; height: 5px; border-radius: 3px; background: #efebe6; position: relative; overflow: hidden; }
      .doc h2 .bar i { position: absolute; left: 0; top: 0; height: 5px; border-radius: 3px; background: var(--accent); width: 40%; }
      .bl { margin-top: 4px; }
      .bl .ln { position: relative; padding-left: 26px; height: 34px; line-height: 34px; }
      .bl .ln::before { content: ""; position: absolute; left: 8px; top: 14px; width: 6px; height: 6px; border-radius: 50%; background: #34312d; }
      .bl .ln b { font-weight: 600; }
      .tbl { margin-top: 16px; border: 1px solid #ebe7e2; border-radius: 11px; overflow: hidden; }
      .tr { display: flex; height: 46px; border-top: 1px solid #f0ece7; font-size: 18px; color: #34312d; position: relative; }
      .tr:first-child { border-top: 0; height: 38px; background: #faf8f6; font-weight: 600; font-size: 15px; color: #7a746c; }
      .tr > div { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-left: 1px solid #f0ece7; white-space: nowrap; }
      .tr > div:first-child { border-left: 0; }
      .c1 { width: 270px; } .c2 { width: 160px; } .c3 { width: 190px; } .c4 { flex: 1; }
      .pill { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 7px; font-size: 16px; font-weight: 500; }
      .hl { background: rgba(142, 111, 227, 0.16); box-shadow: inset 0 0 0 2px #8e6fe3; }
      .pres { position: absolute; left: 530px; top: -22px; height: 22px; padding: 0 8px; border-radius: 5px 5px 5px 0; background: #8e6fe3; color: #fff; font-size: 14px; font-weight: 600; line-height: 22px; white-space: nowrap; z-index: 2; }
      .ck { display: flex; align-items: center; gap: 14px; height: 42px; font-size: 20px; color: #34312d; white-space: nowrap; }
      .ck .bx { position: relative; width: 24px; height: 24px; border-radius: 7px; border: 2px solid #cbc5bd; flex: none; background: #fff; }
      .ck .bx .on { position: absolute; left: -2px; top: -2px; width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; }
      .ck .tx { position: relative; }
      .ck.dn .tx { color: #a8a29a; text-decoration: line-through; text-decoration-color: #b8b2aa; }
      .mn { display: inline-flex; align-items: center; height: 28px; padding: 0 9px; border-radius: 7px; background: #fcece2; color: var(--accent-ink); font-size: 16px; font-weight: 500; margin-left: 4px; }
      .dd { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 7px; border: 1px solid #ebe7e2; color: #7a746c; font-size: 15px; margin-left: 4px; }
      .ck.dn .mn, .ck.dn .dd { opacity: 0.6; }
      #crow { opacity: 0; }
      #caret { display: inline-block; width: 2px; height: 24px; background: var(--accent); margin-left: 1px; vertical-align: -5px; }

      
/* cursor */
      #cur { position: absolute; left: 0; top: 0; z-index: 60; opacity: 0; filter: drop-shadow(0 1.5px 2px rgba(0, 0, 0, 0.3)); }

      /* ---------- final lockup ---------- */
      #final {
        z-index: 3; opacity: 0;
        background:
          radial-gradient(700px 420px at 18% 100%, rgba(255, 200, 160, 0.55) 0%, rgba(255, 200, 160, 0) 100%),
          radial-gradient(760px 460px at 60% 108%, rgba(255, 180, 205, 0.5) 0%, rgba(255, 180, 205, 0) 100%),
          radial-gradient(800px 500px at 100% 0%, rgba(176, 206, 255, 0.55) 0%, rgba(176, 206, 255, 0) 100%),
          #f7f6f8;
      }
      #lock { display: flex; align-items: center; justify-content: center; gap: 44px; }
      #bigicon { width: 220px; height: 220px; flex: none; opacity: 0; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.16)) drop-shadow(0 18px 34px rgba(60, 30, 40, 0.2)); }
      #wm { width: 400px; flex: none; font-size: 168px; line-height: 190px; font-weight: 650; letter-spacing: -0.045em; color: var(--ink); white-space: nowrap; opacity: 0; }
      #tag { position: absolute; left: 0; top: 700px; width: 1920px; text-align: center; font-size: 28px; font-weight: 400; color: #86868b; letter-spacing: -0.01em; opacity: 0; }
      #vig { z-index: 4; pointer-events: none; background: radial-gradient(ellipse at center, rgba(40, 20, 40, 0) 62%, rgba(40, 20, 40, 0.08) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11" data-width="1920" data-height="1080">
      <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <defs id="defs">
          <linearGradient id="gHi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.34" /><stop offset="0.5" stop-color="#fff" stop-opacity="0" /></linearGradient>
          <linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.7" /><stop offset="0.5" stop-color="#fff" stop-opacity="0.1" /><stop offset="1" stop-color="#000" stop-opacity="0.18" /></linearGradient>
          <linearGradient id="gWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#ecebee" /></linearGradient>
          <linearGradient id="gPaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdfa" /><stop offset="1" stop-color="#f1ebe4" /></linearGradient>
          <linearGradient id="gBird" x1="0.2" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#ffb347" /><stop offset="0.55" stop-color="#ff7a33" /><stop offset="1" stop-color="#ee4a26" /></linearGradient>
          <linearGradient id="gWing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9531f" /><stop offset="1" stop-color="#b8391a" /></linearGradient>
          <linearGradient id="gFolderBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf4ff" /><stop offset="1" stop-color="#cfe2fa" /></linearGradient>
          <linearGradient id="gFolder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc6ff" /><stop offset="1" stop-color="#2f8cf2" /></linearGradient>
          <linearGradient id="gFolderBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fa5f5" /><stop offset="1" stop-color="#2a78dc" /></linearGradient>
          <linearGradient id="gGlobe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd0ff" /><stop offset="1" stop-color="#2160e6" /></linearGradient>
          <linearGradient id="gMailBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62b8ff" /><stop offset="1" stop-color="#1d6ae6" /></linearGradient>
          <linearGradient id="gEnv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#e3ebf7" /></linearGradient>
          <linearGradient id="gMsgBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b996ff" /><stop offset="1" stop-color="#6a45e0" /></linearGradient>
          <linearGradient id="gCalHead" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5c" /><stop offset="1" stop-color="#ec3f33" /></linearGradient>
          <linearGradient id="gMusicBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8aa1" /><stop offset="1" stop-color="#ef2f57" /></linearGradient>
          <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fcbff" /><stop offset="1" stop-color="#d6efff" /></linearGradient>
          <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46c27a" /><stop offset="1" stop-color="#1f9a57" /></linearGradient>
          <linearGradient id="gHill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd6a8" /><stop offset="1" stop-color="#5bb983" /></linearGradient>
          <linearGradient id="gTerm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43464e" /><stop offset="1" stop-color="#1c1d21" /></linearGradient>
          <linearGradient id="gGearBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e6eb" /><stop offset="1" stop-color="#8f95a3" /></linearGradient>
          <linearGradient id="gGear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fafbfc" /><stop offset="1" stop-color="#c3c7cf" /></linearGradient>
          <linearGradient id="gTrash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9" /><stop offset="1" stop-color="#d9dde4" stop-opacity="0.92" /></linearGradient>
          <filter id="fSh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#000" flood-opacity="0.22" /></filter>
          <filter id="fShW" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#9a3a10" flood-opacity="0.28" /></filter>
        </defs>
      </svg>

      <div id="stage" class="clip full" data-start="0" data-duration="11" data-track-index="1">
        <div id="world" data-layout-allow-overlap data-layout-ignore>
          <div id="wall"></div>
          <div id="menubar"></div>
          <div id="win"></div>
          <div id="dock" data-layout-allow-overlap></div>
          
        </div>
        <svg id="cur" width="26" height="31" viewBox="0 0 22 26"><path d="M3 2v18l4.8-4.4 3.4 7.4 3.2-1.4-3.4-7.3H18z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" /></svg>
      </div>

      <div id="final" class="clip full" data-start="0" data-duration="11" data-track-index="2" data-layout-allow-overlap>
        <div id="lock" class="full" data-layout-allow-overlap>
          <div id="bigicon" class="bigapp"></div>
          <div id="wm">Wren</div>
        </div>
        <div id="tag">Fast, offline-first notes for Mac, iPhone and iPad.</div>
      </div>

      <div id="vig" class="clip full" data-start="0" data-duration="11" data-track-index="3"></div>
    </div>

    <script>
      const EXPO = "expo.out";

      /* ---------- easing helpers ---------- */
      function bez(x1, y1, x2, y2) {
        const B = (u, a, b) => 3 * a * u * (1 - u) * (1 - u) + 3 * b * u * u * (1 - u) + u * u * u;
        return (t) => {
          if (t <= 0) return 0;
          if (t >= 1) return 1;
          let lo = 0, hi = 1, u = t;
          for (let i = 0; i < 28; i++) {
            if (B(u, x1, x2) < t) lo = u; else hi = u;
            u = (lo + hi) / 2;
          }
          return B(u, y1, y2);
        };
      }

        '<div class="eb"><div class="doc">' +
        "<h1>Onboarding v3 — research synthesis</h1>" +
        '<div class="meta"><span class="tg">#research</span><span class="tg">#onboarding</span><span>·</span><div class="ed2"><span id="ed1">Edited 2 min ago</span><span id="ed2" style="opacity:0">Edited just now</span></div><span>·</span><span>1,284 words</span></div>' +
        '<div class="pp"><p>We ran 9 moderated sessions on Oct 19–23 with new teams on the Starter plan.</p><p>Goal: find where people stall before they write their first shared note.</p></div>' +
        "<h2>What we heard</h2>" +
        '<div class="bl"><div class="ln"><b>Import is the #1 ask.</b> 7 of 9 tried to bring in old notes within 5 minutes.</div><div class="ln">Templates are hard to find. Nobody opened them from the empty state.</div><div class="ln">Sharing works once people find it, but the Share button reads as Export.</div></div>' +
                '<div class="tbl"><div class="tr"><div class="c1">Participant</div><div class="c2">Plan</div><div class="c3">First note</div><div class="c4">Stalled at</div></div>' +
        prow("mc", "Maya Chen", "Starter", ST, "1m 42s", "Sharing") + prow("lo", "Liam Ortiz", "Team", TM, "3m 10s", "Import") + prow("nf", "Noah Fischer", "Team", TM, "4m 25s", "Templates", 1) + "</div>" +
        '<h2>Next steps<span class="cnt"><span id="cnt">2 of 5</span><span class="bar"><i id="cbar"></i></span></span></h2>' +
        '<div style="margin-top:6px">' +
        ck("ck1", 1, "Ship Markdown and HTML importer behind a flag", "Liam Ortiz", "Oct 30") + ck("ck2", 1, "Add template picker to the empty state", "Maya Chen") +
        ck("ck3", 0, "Rename Share to Invite in the toolbar", "Ava Collins", "Nov 2") + ck("ck4", 0, "Run 5 follow-up sessions on the Team plan", "Noah Fischer", "Nov 6") +
        '<div class="ck" id="crow"><span class="bx"></span><span class="tx"><span id="typed">' + typed + '</span><span id="caret"></span></span></div>' +
        "</div></div></div>";

      document.getElementById("win").innerHTML = '<div class="sb">' + side + '</div><div class="nl">' + list + '</div><div class="ed">' + editor + "</div>";
      // the check that appears on click
      document.querySelector("#ck3 .bx").innerHTML = '<span class="on" id="ck3on" style="opacity:0">' + ic("check", 12, 2.2) + "</span>";

      /* ---------- dock ---------- */
      const S = 64, GAP = 8, PADX = 10, IB = 1064, MAG = 1.58, RAD = 190;
      const ITEMS = [
        { k: "files", run: 1 }, { k: "browser", run: 1 }, { k: "mail", run: 1 }, { k: "wren" }, { k: "msg", run: 1 }, { k: "cal" }, { k: "music", run: 1 },
        { k: "photos" }, { k: "term", run: 1 }, { k: "gear" }, { sep: 1 }, { k: "dl" }, { k: "trash" },
      ];
      const dock = document.getElementById("dock");
      let dh = '<div id="plate"></div>';
      ITEMS.forEach((it, i) => {
        if (it.sep) dh += '<div class="dsep" id="d' + i + '"></div>';
        else dh += '<div class="di" id="d' + i + '">' + (it.k === "trash" ? trashSvg : appSvg(it.k, it.k === "wren" ? "wdark" : "")) + "</div>";
        if (it.run || it.k === "wren") dh += '<div class="ddot" id="dot' + i + '"' + (it.k === "wren" ? ' style="opacity:0"' : "") + "></div>";
      });
      dh += '<div id="tipbox">Wren</div>';
      // spark: four short strokes off the top-right corner
      const SPK = [-96, -62, -30, 2];
      let sp = '<svg id="spark" width="1" height="1">';
      SPK.forEach((a, i) => {
        const r = (a * Math.PI) / 180, r1 = 5.5, r2 = 12.5;
        sp += '<line class="sl" id="sl' + i + '" x1="' + (r1 * Math.cos(r)).toFixed(2) + '" y1="' + (r1 * Math.sin(r)).toFixed(2) + '" x2="' + (r2 * Math.cos(r)).toFixed(2) + '" y2="' + (r2 * Math.sin(r)).toFixed(2) +
          '" stroke="#1d1d1f" stroke-width="2.1" stroke-linecap="round" stroke-dasharray="7 7" stroke-dashoffset="7" opacity="0"/>';
      });
      dock.innerHTML = dh + sp + "</svg>";
      const EL = ITEMS.map((it, i) => document.getElementById("d" + i));
      const DOT = ITEMS.map((it, i) => document.getElementById("dot" + i));
      const plate = document.getElementById("plate"), tipbox = document.getElementById("tipbox");
      const WI = 3; // Wren index

      /* ---------- timing ---------- */
      const T = { grow: 0.45, spark: 0.95, c1a: 1.5, c1b: 2.1, tip: 2.2, press: 2.4, cut: 2.5, c2a: 3.2, c2b: 3.8, type0: 3.45, c3a: 5.15, c3b: 5.7, click: 5.8, drift: 7.25, close: 7.4, END: 11.0 };

      const growAt = (t) => (t <= T.grow ? 0 : t >= T.grow + 0.5 ? 1 : BACK((t - T.grow) / 0.5));

      function layout(g, cx, m) {
        const w = [], st = [], gp = [];
        let x = 0;
        ITEMS.forEach((it, i) => {
          w[i] = it.sep ? 1 : i === WI ? S * g : S;
          st[i] = x;
          x += w[i];
          gp[i] = i === ITEMS.length - 1 ? 0 : i === WI ? GAP * g : GAP;
          x += gp[i];
        });
        const Wb = x, Lb = 960 - Wb / 2;
        const k = [], st2 = [];
        let x2 = 0;
        ITEMS.forEach((it, i) => {
          const c = Lb + st[i] + w[i] / 2, d = Math.abs(cx - c);
          const f = d < RAD ? (Math.cos((Math.PI * d) / RAD) + 1) / 2 : 0;
          k[i] = it.sep ? 1 : 1 + (MAG - 1) * m * f;
          st2[i] = x2;
          x2 += w[i] * k[i] + gp[i];
        });
        const Wm = x2;
        // keep the point under the cursor fixed while the dock magnifies
        const u = cx - Lb;
        let u2 = u;
        if (m > 0) {
          if (u <= 0) u2 = u;
          else if (u >= Wb) u2 = Wm + (u - Wb);
          else {
            for (let i = 0; i < ITEMS.length; i++) {
              const a = st[i], b = st[i] + w[i];
              if (u >= a && u <= b) { u2 = st2[i] + (w[i] > 0 ? ((u - a) / w[i]) * w[i] * k[i] : 0); break; }
              if (u > b && u < b + gp[i]) { u2 = st2[i] + w[i] * k[i] + (u - b); break; }
            }
          }
        }
        const L = cx - u2;
        return { L, Wm, k, st2, w };
      }

      /* fixed geometry */
      const L1 = layout(1, -9999, 0);
      const WREN_CX = L1.L + L1.st2[WI] + S / 2; // settled centre of the Wren slot
      const spark = document.getElementById("spark");
      spark.style.left = (L1.L + L1.st2[WI] + S - 1).toFixed(2) + "px";
      spark.style.top = (IB - S + 1).toFixed(2) + "px";

      /* world offsets of window parts (layout is fixed-height, so this is stable) */
      function wpos(el) {
        let x = 0, y = 0;
        while (el && el.id !== "world") { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
        return { x, y };
      }
      const bx3 = wpos(document.querySelector("#ck3 .bx"));
      const row4 = wpos(document.getElementById("ck4"));
      const docEl = wpos(document.querySelector(".doc"));

      /* cursor path in world coordinates */
      const P0 = { x: WREN_CX + 250, y: 1215 };
      const P1 = { x: WREN_CX + 9, y: 1027 };
      const P2 = { x: docEl.x + 820, y: row4.y + 22 };
      const P3 = { x: bx3.x + 5, y: bx3.y + 12 };
      const P4 = { x: P3.x - 34, y: P3.y + 16 };
      const qb = (a, b, c, u) => ({ x: (1 - u) * (1 - u) * a.x + 2 * u * (1 - u) * c.x + u * u * b.x, y: (1 - u) * (1 - u) * a.y + 2 * u * (1 - u) * c.y + u * u * b.y });
      function cursorAt(t) {
        if (t < T.c1b) return qb(P0, P1, { x: P1.x + 150, y: P1.y + 70 }, CUR(clamp((t - T.c1a) / (T.c1b - T.c1a), 0, 1)));
        if (t < T.c2a) return P1;
        if (t < T.c3a) return qb(P1, P2, { x: P1.x + 260, y: P2.y + 120 }, CUR(clamp((t - T.c2a) / (T.c2b - T.c2a), 0, 1)));
        if (t < T.click) return qb(P2, P3, { x: (P2.x + P3.x) / 2, y: P3.y - 40 }, CUR(clamp((t - T.c3a) / (T.c3b - T.c3a), 0, 1)));
        const u = clamp((t - T.click) / (T.drift - T.click), 0, 1);
        return { x: lerp(P3.x, P4.x, u), y: lerp(P3.y, P4.y, u) };
      }
      function camAt(t) {
        if (t < T.cut) return { s: 3.0 + 0.06 * (t / T.cut), fx: 762, fy: 1006 };
        const u = clamp((t - T.cut) / (T.close - T.cut), 0, 1);
        return { s: 1.0 + 0.012 * u, fx: 960, fy: 540 };
      }

      const world = document.getElementById("world"), cur = document.getElementById("cur");
      gsap.set(cur, { transformOrigin: "3px 2px" });
      function render(t) {
        const c = camAt(t);
        gsap.set(world, { x: 960 - c.fx * c.s, y: 540 - c.fy * c.s, scale: c.s, transformOrigin: "0 0" });

        const p = cursorAt(t);
        const m = sm((1100 - p.y) / 45) * sm((p.y - 945) / 45);
        const g = growAt(t);
        const D = layout(g, p.x, m);
        plate.style.left = (D.L - PADX).toFixed(2) + "px";
        plate.style.width = (D.Wm + 2 * PADX).toFixed(2) + "px";
        let wl = 0, wt = 0, ws = 0;
        ITEMS.forEach((it, i) => {
          const x = D.L + D.st2[i], el = EL[i];
          if (it.sep) { el.style.left = (x - 0.5 + 0).toFixed(2) + "px"; return; }
          const slot = D.w[i] * D.k[i];
          let size = slot;
          if (i === WI) {
            size = S * D.k[i];
            const sc = 0.6 + 0.4 * g;
            el.style.transform = "scale(" + sc.toFixed(4) + ")";
            el.style.opacity = clamp(g * 2.5, 0, 1).toFixed(3);
            wl = x + slot / 2; ws = size; wt = IB - size;
          }
          el.style.left = (x + (slot - size) / 2).toFixed(2) + "px";
          el.style.top = (IB - size).toFixed(2) + "px";
          el.style.width = size.toFixed(2) + "px";
          el.style.height = size.toFixed(2) + "px";
          if (DOT[i]) DOT[i].style.left = (x + slot / 2).toFixed(2) + "px";
        });
        tipbox.style.left = (wl - 28).toFixed(2) + "px";
        tipbox.style.top = (wt - 36).toFixed(2) + "px";

        const sp = camAt(t), sx = (p.x - sp.fx) * sp.s + 960, sy = (p.y - sp.fy) * sp.s + 540;
        const pressed = (t >= T.press && t < T.cut) || (t >= T.click && t < T.click + 0.1);
        const cs = (t < T.cut ? 1.6 : 1.3) * (pressed ? 0.88 : 1);
        gsap.set(cur, { x: sx - 3, y: sy - 2, scale: cs });
      }

      /* ---------- timeline ---------- */
      const tl = gsap.timeline({ paused: true });
      function F(target, from, to, at) {
        tl.fromTo(target, from, Object.assign({ immediateRender: false }, to), at);
      }
      render(0);
      tl.to({ v: 0 }, { v: 1, duration: T.END, ease: "none", onUpdate: () => render(tl.time()) }, 0);

      /* spark: four strokes draw out from the corner, then retract outward */
      SPK.forEach((a, i) => {
        tl.set("#sl" + i, { opacity: 1 }, T.spark + i * 0.02);
        F("#sl" + i, { strokeDashoffset: 7 }, { strokeDashoffset: 0, duration: 0.13, ease: "power2.out" }, T.spark + i * 0.02);
        tl.set("#sl" + i, { opacity: 0 }, T.spark + 0.29 + i * 0.02);
        tl.to("#sl" + i, { strokeDashoffset: -7, duration: 0.14, ease: "power2.in" }, T.spark + 0.14 + i * 0.02);
      });

      /* cursor shows (it starts off-frame) */
      F("#cur", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, T.c1a);
      /* dock tooltip */
      F("#tipbox", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, T.tip);
      tl.to("#tipbox", { opacity: 0, duration: 0.15, ease: "power1.out" }, T.c2a);
      /* press: icon darkens on the press frame, window opens on the next beat */
      F("#wdark", { opacity: 0 }, { opacity: 0.32, duration: 0.1, ease: "none" }, T.press);
      tl.to("#wdark", { opacity: 0, duration: 0.08, ease: "none" }, T.cut);
      tl.set("#dot3", { opacity: 1 }, T.cut);

      /* cut to the medium shot: display frame on, window grows from the centre */
      F("#win", { scale: 0.16 }, { scale: 1, duration: 0.55, ease: OPEN }, T.cut);
      F("#win", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, T.cut);

      /* typing a new checklist item */
      F("#crow", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 3.3);
      tl.set("#ed1", { opacity: 0 }, T.type0);
      tl.set("#ed2", { opacity: 1 }, T.type0);
      for (let i = 0; i < TYPED.length; i++) tl.set(".tc:nth-child(" + (i + 1) + ")", { display: "inline" }, T.type0 + i * 0.042);
      const typeEnd = T.type0 + TYPED.length * 0.042;
      for (let t = 3.3; t < T.close; t += 0.5) {
        const solid = t < typeEnd + 0.1;
        tl.set("#caret", { opacity: 1 }, t);
        if (!solid) tl.set("#caret", { opacity: 0 }, t + 0.25);
      }

      /* click: checkbox, row, counters change on the same frame */
      tl.set("#ck3on", { opacity: 1 }, T.click);
      tl.set("#ck3", { attr: { class: "ck dn" } }, T.click);
      tl.set("#cnt", { textContent: "3 of 5" }, T.click);
      tl.set("#cbar", { width: "60%" }, T.click);
      tl.set("#lchk", { innerHTML: ic("checksq", 12) + "3/5" }, T.click);
      tl.set("#sync1", { opacity: 0 }, T.click);
      tl.set("#sync2", { opacity: 1 }, T.click);
      tl.set("#sync2", { opacity: 0 }, T.click + 0.7);
      tl.set("#sync1", { opacity: 1, innerHTML: ic("cloud", 13) + "Synced just now" }, T.click + 0.7);

      tl.to("#cur", { opacity: 0, duration: 0.2, ease: "power1.out" }, T.drift);

      /* close: window folds back to the centre, the icon takes its place */
      tl.to("#win", { scale: 0.14, duration: 0.42, ease: "power3.in" }, T.close);
      tl.to("#win", { opacity: 0, duration: 0.14, ease: "power1.in" }, T.close + 0.3);
      F("#final", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.inOut" }, T.close + 0.2);
      const LAND = T.close + 0.4;
      gsap.set("#bigicon", { x: 222 });
      gsap.set("#wm", { clipPath: "inset(-30px -30px -30px 230px)" });
      F("#bigicon", { scale: 0.2, y: -45, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.75, ease: "back.out(1.5)" }, LAND);
      F("#bigicon", { x: 222 }, { x: 0, duration: 1.2, ease: EXPO }, LAND + 0.6);
      tl.set("#wm", { opacity: 1 }, LAND + 0.6);
      tl.to("#world", { opacity: 0, duration: 0.2, ease: "none" }, T.close + 0.65);
      F("#wm", { clipPath: "inset(-30px -30px -30px 230px)", filter: "blur(10px)" }, { clipPath: "inset(-30px -30px -30px -50px)", filter: "blur(0px)", duration: 1.2, ease: EXPO }, LAND + 0.6);
      F("#tag", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: EXPO }, LAND + 0.75);
      F("#lock", { scale: 1 }, { scale: 1.035, duration: T.END - LAND, ease: "none" }, LAND);

      tl.set({}, {}, T.END);

      document.getElementById("bigicon").innerHTML = appSvg("wren");

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
