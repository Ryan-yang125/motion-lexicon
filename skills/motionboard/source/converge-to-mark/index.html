<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --accent: #5b5bf0;
        --ink: #1d1d1f;
        --font-ui: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f5f5f7; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f5f5f7;
        font-family: var(--font-ui); color: var(--ink); -webkit-font-smoothing: antialiased;
      }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .ic { flex: none; display: block; }
      .ci { display: flex; flex: none; }
      .grow { flex: 1; min-width: 0; }

      /* ---------- wallpaper ---------- */
      #bg {
        z-index: 0;
        background:
          radial-gradient(900px 620px at 12% 92%, rgba(255, 190, 150, 0.95) 0%, rgba(255, 190, 150, 0) 70%),
          radial-gradient(900px 700px at 62% 108%, rgba(255, 170, 205, 0.9) 0%, rgba(255, 170, 205, 0) 70%),
          radial-gradient(1000px 700px at 100% 0%, rgba(170, 205, 255, 0.95) 0%, rgba(170, 205, 255, 0) 70%),
          radial-gradient(800px 600px at 0% 0%, rgba(214, 203, 255, 0.95) 0%, rgba(214, 203, 255, 0) 70%),
          #ebe6f5;
      }
      #stage { z-index: 1; overflow: hidden; }
      #cam { z-index: 1; }
      .pc { position: absolute; }

      /* ---------- macOS menu bar ---------- */
      #menubar {
        position: absolute; left: 0; top: 0; width: 1920px; height: 28px; z-index: 30; display: flex; align-items: center;
        padding: 0 18px; gap: 20px; background: rgba(247, 247, 250, 0.82); border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        font-size: 13px; font-weight: 500; color: #1d1d1f; opacity: 0;
      }
      #menubar b { font-weight: 700; }
      #menubar .r { display: flex; align-items: center; gap: 14px; color: #2b2b30; }

      /* ---------- windows ---------- */
      .win {
        border-radius: 12px; overflow: hidden; background: #fff; font-size: 13px; color: #3b3e44;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12), 0 28px 64px rgba(40, 25, 90, 0.24), 0 4px 14px rgba(0, 0, 0, 0.08);
        display: flex; flex-direction: column; font-variant-numeric: tabular-nums;
      }
      .tbar {
        height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 14px;
        background: #f6f6f7; border-bottom: 1px solid #e4e4e7;
      }
      .lights { display: flex; gap: 8px; margin-right: 8px; }
      .lights i { display: block; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.2); }
      .ib { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: #6c7078; flex: none; }
      .btn {
        height: 26px; padding: 0 10px 0 8px; display: flex; align-items: center; gap: 5px; border-radius: 6px; font-size: 12.5px; font-weight: 600;
        background: var(--accent); color: #fff; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1), 0 1px 2px rgba(60, 60, 200, 0.3); flex: none; white-space: nowrap;
      }
      .btn2 {
        height: 26px; padding: 0 10px; display: flex; align-items: center; gap: 5px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
        background: #fff; color: #3b3e44; border: 1px solid #dcdce0; flex: none; white-space: nowrap;
      }
      .chip { height: 24px; padding: 0 8px; display: flex; align-items: center; gap: 6px; border: 1px solid #e4e4e7; border-radius: 6px; font-size: 12px; font-weight: 500; color: #3b3e44; white-space: nowrap; flex: none; background: #fff; }
      .mu { color: #8b8f97; font-weight: 400; }
      .av { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; flex: none; }
      .stack { display: flex; }
      .stack .av { margin-left: -7px; box-shadow: 0 0 0 2px #f6f6f7; }
      .stack .av:first-child { margin-left: 0; }
      .tile { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 4px; color: #fff; font-size: 10px; font-weight: 700; flex: none; }
      .kbd { font-size: 11px; font-weight: 500; color: #6c7078; background: #f1f1f3; border: 1px solid #e4e4e7; border-radius: 4px; padding: 0 5px; height: 18px; display: inline-flex; align-items: center; }
      .lb { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border: 1px solid #e7e7ea; border-radius: 10px; font-size: 11.5px; font-weight: 500; color: #555a62; white-space: nowrap; flex: none; background: #fff; }
      .lb i { display: block; width: 7px; height: 7px; border-radius: 50%; }
      .si { display: flex; align-items: center; gap: 8px; height: 28px; margin: 0 8px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #3b3e44; white-space: nowrap; }
      .si > .ic { color: #6c7078; }
      .si.on { background: rgba(0, 0, 0, 0.06); color: #16171a; }
      .si.sub { padding-left: 30px; }
      .si b { margin-left: auto; font-size: 12px; font-weight: 500; color: #8b8f97; }
      .sh { height: 26px; margin: 12px 8px 0; padding: 0 8px; display: flex; align-items: center; font-size: 11.5px; font-weight: 600; color: #8b8f97; }
      .dot { display: block; width: 8px; height: 8px; border-radius: 50%; flex: none; }

      /* inbox */
      #inbox .body { flex: 1; display: flex; min-height: 0; }
      #inbox .side { width: 188px; flex: none; background: #f7f7f9; border-right: 1px solid #e8e8eb; padding-top: 8px; }
      #inbox .ws { height: 32px; margin: 0 8px 8px; padding: 0 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #1b1c1f; }
      #inbox .lst { width: 340px; flex: none; border-right: 1px solid #e8e8eb; position: relative; }
      #inbox .lh { position: absolute; left: 0; top: 0; width: 340px; height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: 1px solid #ececee; background: #fff; z-index: 2; }
      #inbox .lh .t { font-size: 14px; font-weight: 600; color: #1b1c1f; margin-right: 8px; }
      #inbox .tab { height: 24px; padding: 0 9px; display: flex; align-items: center; gap: 5px; border-radius: 6px; font-size: 12px; font-weight: 500; color: #6c7078; }
      #inbox .tab.on { background: #f1f1f3; color: #1f2023; }
      #mclip { position: absolute; left: 0; top: 40px; width: 340px; height: 390px; overflow: hidden; }
      #mlist { position: absolute; left: 0; top: 0; width: 340px; height: 600px; }
      .mr { position: absolute; left: 0; width: 340px; height: 60px; display: flex; gap: 10px; padding: 8px 12px 0 14px; border-bottom: 1px solid #f0f0f2; background: #fff; }
      .mr.sel { background: #eff0fe; box-shadow: inset 2px 0 0 var(--accent); }
      .mr .mc { flex: 1; min-width: 0; }
      .mr .l1 { display: flex; align-items: center; gap: 6px; height: 16px; font-size: 12.5px; font-weight: 600; color: #1f2023; }
      .mr .l1 .tm { margin-left: auto; font-size: 11.5px; font-weight: 400; color: #8b8f97; }
      .mr .l2 { height: 16px; font-size: 12.5px; font-weight: 500; color: #2a2c31; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mr .l3 { height: 16px; font-size: 12px; color: #8b8f97; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mr.rd .l1, .mr.rd .l2 { font-weight: 500; color: #5f636b; }
      .ud { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
      #inbox .read { flex: 1; min-width: 0; position: relative; padding: 0 16px; }
      #inbox .read .acts { height: 36px; display: flex; align-items: center; gap: 2px; margin: 0 -8px; }
      #inbox .read h3 { font-size: 15px; line-height: 20px; font-weight: 600; color: #1b1c1f; margin-top: 2px; }
      #inbox .read .snd { display: flex; align-items: center; gap: 9px; margin-top: 10px; height: 34px; }
      #inbox .read .snd .n { font-size: 13px; font-weight: 600; color: #1f2023; line-height: 16px; }
      #inbox .read .snd .e { font-size: 11.5px; color: #8b8f97; line-height: 15px; }
      #inbox .read .bd { margin-top: 12px; font-size: 13px; line-height: 20px; color: #3b3e44; }
      #inbox .read .bd p { margin-bottom: 8px; }
      #inbox .read .att { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 10px; border: 1px solid #e4e4e7; border-radius: 8px; margin-top: 4px; font-size: 12.5px; font-weight: 500; color: #1f2023; }
      #inbox .read .att span { font-size: 11.5px; font-weight: 400; color: #8b8f97; }
      #inbox .read .rep { position: absolute; left: 16px; right: 16px; bottom: 10px; height: 34px; border: 1px solid #dcdce0; border-radius: 8px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; color: #8b8f97; font-size: 12.5px; background: #fff; }

      /* board */
      #board .bbar { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid #ececee; background: #fff; }
      #board .vt { height: 26px; padding: 0 9px; display: flex; align-items: center; gap: 6px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: #6c7078; }
      #board .vt.on { background: #f1f1f3; color: #1f2023; box-shadow: inset 0 0 0 1px #e6e6e9; }
      #board .sep { width: 1px; height: 18px; background: #e4e4e7; margin: 0 4px; flex: none; }
      #bbody { position: relative; width: 884px; height: 390px; overflow: hidden; background: #fff; flex: none; }
      .kcol { position: absolute; top: 10px; width: 208px; height: 420px; background: #f6f6f8; border-radius: 9px; }
      .kcol .ch { position: absolute; left: 0; top: 0; width: 208px; height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 8px 0 10px; font-size: 12.5px; font-weight: 600; color: #1f2023; }
      .kcol .ch .ct { font-weight: 500; color: #8b8f97; font-size: 12px; }
      #cards { position: absolute; left: 0; top: 0; width: 884px; height: 390px; }
      .kc {
        position: absolute; width: 190px; height: 102px; padding: 9px 10px; background: #fff; border: 1px solid #e4e4e7; border-radius: 8px;
        box-shadow: 0 1px 2px rgba(20, 20, 30, 0.05);
      }
      .kc .kt { display: flex; align-items: center; gap: 6px; height: 16px; }
      .kc .kid { font-size: 11.5px; color: #8b8f97; }
      .kc .kd { display: flex; align-items: center; gap: 3px; font-size: 11px; color: #8b8f97; }
      .kc .kh { margin-top: 4px; height: 36px; overflow: hidden; font-size: 13px; line-height: 18px; font-weight: 500; color: #1f2023; }
      .kc .kb { margin-top: 5px; height: 22px; display: flex; align-items: center; }

      /* docs */
      #docs .dbody { flex: 1; display: flex; min-height: 0; }
      #docs .dside { width: 190px; flex: none; background: #f8f8fa; border-right: 1px solid #e8e8eb; padding-top: 10px; }
      #docs .dmain { flex: 1; min-width: 0; position: relative; }
      #docs .dtool { height: 36px; display: flex; align-items: center; gap: 2px; padding: 0 14px; border-bottom: 1px solid #f0f0f2; }
      #docs .dtool .sv { margin-left: auto; font-size: 11.5px; color: #8b8f97; }
      #docs .dpage { position: absolute; left: 0; top: 36px; width: 570px; height: 364px; overflow: hidden; padding: 20px 28px 0 28px; }
      #docs .tg { display: flex; gap: 6px; height: 22px; align-items: center; }
      #docs h1 { margin-top: 10px; font-size: 28px; line-height: 34px; font-weight: 700; color: #1b1c1f; letter-spacing: -0.02em; }
      #docs .pp { margin-top: 8px; height: 24px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8b8f97; }
      #docs .pp b { font-weight: 500; color: #3b3e44; }
      #docs .para { margin-top: 12px; font-size: 14px; line-height: 22px; color: #34373d; }
      #docs h2 { margin-top: 12px; font-size: 17px; line-height: 26px; font-weight: 600; color: #1b1c1f; }
      #docs .ck { height: 26px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #34373d; white-space: nowrap; }
      #docs .ck .bx { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid #c4c7cd; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; }
      #docs .ck.dn .bx { background: var(--accent); border-color: var(--accent); }
      #docs .ck.dn .tx { color: #9a9ea6; text-decoration: line-through; }
      .mn { background: #eeeefe; color: #4747d6; border-radius: 4px; padding: 0 5px; font-size: 13px; font-weight: 500; }
      .dd { color: #8b8f97; font-size: 12px; }
      #dcaret { display: inline-block; width: 1.5px; height: 17px; background: var(--accent); margin-left: 1px; vertical-align: -3px; }

      /* calendar */
      #cal .cbody { flex: 1; display: flex; min-height: 0; }
      #cal .cside { width: 190px; flex: none; border-right: 1px solid #ececee; background: #fafafb; padding: 12px 12px 0; }
      #cal .mh { display: flex; align-items: center; height: 24px; font-size: 12.5px; font-weight: 600; color: #1f2023; }
      #cal .mg { display: grid; grid-template-columns: repeat(7, 23px); margin-top: 6px; font-size: 11px; color: #3b3e44; text-align: center; }
      #cal .mg span { height: 24px; line-height: 24px; border-radius: 12px; }
      #cal .mg .l { color: #8b8f97; font-size: 10.5px; height: 20px; line-height: 20px; }
      #cal .mg .o { color: #b4b7be; }
      #cal .mg .td { background: var(--accent); color: #fff; font-weight: 600; }
      #cal .cl { display: flex; align-items: center; gap: 8px; height: 26px; font-size: 12.5px; font-weight: 500; color: #3b3e44; }
      #cal .cl i { display: flex; width: 14px; height: 14px; border-radius: 4px; align-items: center; justify-content: center; color: #fff; }
      #cal .cmain { flex: 1; min-width: 0; position: relative; }
      #cal .dh { position: absolute; left: 0; top: 0; width: 854px; height: 30px; border-bottom: 1px solid #ececee; display: flex; align-items: center; }
      #cal .dh div { width: 115px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; font-weight: 500; color: #8b8f97; letter-spacing: 0.03em; }
      #cal .dh div b { font-size: 14px; font-weight: 500; color: #1f2023; letter-spacing: 0; }
      #cal .dh div.td b { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; }
      #cal .dh div.td { color: var(--accent); }
      #grid { position: absolute; left: 0; top: 30px; width: 854px; height: 364px; overflow: hidden; }
      #grid .hl { position: absolute; left: 48px; width: 806px; height: 1px; background: #efeff2; }
      #grid .vl { position: absolute; top: 0; width: 1px; height: 364px; background: #efeff2; }
      #grid .hr { position: absolute; left: 0; width: 42px; text-align: right; font-size: 10.5px; color: #8b8f97; }
      .ev { position: absolute; width: 111px; border-radius: 5px; padding: 3px 6px 0 8px; overflow: hidden; font-size: 11.5px; line-height: 14px; font-weight: 600; border-left: 3px solid; white-space: nowrap; }
      .ev span { display: block; font-size: 10.5px; font-weight: 500; opacity: 0.8; }
      #nowline { position: absolute; left: 44px; width: 810px; height: 2px; background: #ef4444; z-index: 3; }
      #nowline i { position: absolute; left: 380px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
      #nowline em { position: absolute; left: -44px; top: -8px; font-style: normal; font-size: 10px; font-weight: 600; color: #fff; background: #ef4444; border-radius: 4px; padding: 0 4px; height: 16px; line-height: 16px; }

      /* floating pieces */
      .pal {
        background: #fff; border: 1px solid #e0e0e5; border-radius: 14px; overflow: hidden; font-size: 13px; color: #3b3e44;
        box-shadow: 0 30px 80px rgba(30, 20, 80, 0.3), 0 4px 14px rgba(0, 0, 0, 0.1);
      }
      .pal .in { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #ececee; font-size: 15px; color: #1f2023; }
      .pal .ph { color: #a0a3ab; }
      .pal .sec { height: 28px; padding: 8px 16px 0; font-size: 11.5px; font-weight: 600; color: #8b8f97; }
      .pal .it { height: 36px; margin: 0 8px; padding: 0 8px; display: flex; align-items: center; gap: 10px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #1f2023; white-space: nowrap; }
      .pal .it.on { background: #eff0fe; }
      .pal .it .ti { width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
      .pal .it .su { margin-left: auto; font-size: 12px; font-weight: 400; color: #8b8f97; }
      .pal .ft { position: absolute; left: 0; bottom: 0; width: 558px; height: 34px; background: #f7f7f9; border-top: 1px solid #ececee; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 11.5px; color: #8b8f97; }
      #pcaret { display: inline-block; width: 1.5px; height: 18px; background: var(--accent); margin-left: 1px; vertical-align: -4px; }
      .notif {
        border-radius: 16px; background: rgba(250, 250, 252, 0.96); display: flex; gap: 12px; padding: 12px 14px; align-items: flex-start;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 16px 40px rgba(20, 15, 60, 0.28);
      }
      .notif .n1 { display: flex; align-items: center; height: 16px; font-size: 13px; font-weight: 700; color: #1d1d1f; }
      .notif .n1 span { margin-left: auto; font-size: 12px; font-weight: 400; color: #8b8f97; }
      .notif .n2 { margin-top: 3px; font-size: 13px; line-height: 17px; font-weight: 600; color: #1d1d1f; }
      .notif .n3 { font-size: 13px; line-height: 17px; color: #5f636b; white-space: nowrap; }
      .pov { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1), 0 22px 56px rgba(30, 20, 80, 0.26); font-size: 13px; color: #3b3e44; }
      .pov .hd { display: flex; gap: 10px; height: 40px; }
      .pov .hd i { width: 4px; height: 38px; border-radius: 2px; background: #8e6fe3; flex: none; }
      .pov .hd .t { font-size: 15px; line-height: 20px; font-weight: 600; color: #1b1c1f; }
      .pov .hd .s { font-size: 12px; line-height: 17px; color: #8b8f97; }
      .pov .rw { height: 30px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: #3b3e44; }
      .pov .rw .ic { color: #8b8f97; }
      .pov .stack .av { box-shadow: 0 0 0 2px #fff; }
      .pov .bt { display: flex; gap: 6px; align-items: center; margin-top: 8px; height: 28px; font-size: 12px; color: #8b8f97; }
      .pov .bt .c { height: 24px; padding: 0 10px; border: 1px solid #dcdce0; border-radius: 6px; display: flex; align-items: center; font-weight: 500; color: #3b3e44; }
      .pov .bt .c.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      .toast { border-radius: 9px; background: #1f2023; color: #f4f4f5; display: flex; align-items: center; gap: 9px; padding: 0 12px; font-size: 12.5px; font-weight: 500; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3); white-space: nowrap; }
      .toast u { text-decoration: none; color: #a9a9ff; font-weight: 600; margin-left: 6px; }
      .timer { border-radius: 22px; background: #fff; display: flex; align-items: center; gap: 9px; padding: 0 8px 0 12px; font-size: 12.5px; font-weight: 600; color: #1f2023; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1), 0 14px 34px rgba(30, 20, 80, 0.24); white-space: nowrap; }
      .timer .mu { font-weight: 500; }
      .timer .tm { font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; color: #1f2023; }
      .mpi { position: absolute; left: 0; top: 0; width: 90px; height: 40px; }
      .mpi .fl { position: absolute; left: 12px; top: 18px; height: 20px; padding: 0 8px; border-radius: 4px 10px 10px 10px; color: #fff; font-size: 11px; font-weight: 600; line-height: 20px; white-space: nowrap; }
      .mpi svg { position: absolute; left: 0; top: 0; }

      /* dock + app icons */
      .app { position: relative; overflow: hidden; }
      .app svg { display: block; width: 100%; height: 100%; }
      #dockbg {
        position: absolute; left: 729px; top: 998px; width: 462px; height: 68px; z-index: 2; border-radius: 22px; opacity: 0;
        background: rgba(255, 255, 255, 0.46); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.65), 0 10px 30px rgba(40, 20, 90, 0.18);
      }
      #dockbg i { position: absolute; bottom: 3px; width: 4px; height: 4px; border-radius: 50%; background: rgba(0, 0, 0, 0.55); }

      /* cursor */
      #cur { position: absolute; left: 0; top: 0; z-index: 40; opacity: 0; }

      /* ---------- final lockup ---------- */
      #final { z-index: 3; }
      #glow { position: absolute; left: 700px; top: 280px; width: 520px; height: 520px; border-radius: 50%; opacity: 0; background: radial-gradient(circle, rgba(110, 110, 255, 0.55) 0%, rgba(110, 110, 255, 0) 68%); }

      F("#dockbg", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: EXPO }, 0.3);

      F("#cam", { scale: 1, x: 0, y: 0 }, { scale: 1.035, x: -14, y: -6, duration: 6.2, ease: "none" }, 0);

      /* --- live detail: doc typing, caret, new mail, board drag, palette query --- */
      for (let t = 0; t < 7; t += 1) { tl.set("#dcaret", { opacity: 1 }, t); tl.set("#dcaret", { opacity: 0 }, t + 0.5); }
      for (let i = 0; i < TYPED.length; i++) tl.set(".tc:nth-child(" + (i + 1) + ")", { display: "inline" }, 1.2 + i * 0.065);
      F("#liam .mpi", { x: 0, y: 0 }, { x: 26, y: -14, duration: 1.7, ease: "sine.inOut" }, 1.6);
      F("#liam .mpi", { x: 26, y: -14 }, { x: 8, y: 6, duration: 1.8, ease: "sine.inOut" }, 3.3);
      F("#priya .mpi", { x: 0, y: 0 }, { x: -22, y: 18, duration: 1.8, ease: "sine.inOut" }, 2.4);
      F("#priya .mpi", { x: -22, y: 18 }, { x: 14, y: 4, duration: 1.8, ease: "sine.inOut" }, 4.2);

      // the Thursday event gets a selection ring when its popover opens
      tl.to(".ev.lr", { boxShadow: "0 0 0 2px #8e6fe3", duration: 0.3, ease: "power2.out" }, 1.95);

      // a new message lands: list slides down one row, unread count steps up on the same frame
      tl.to("#mlist", { y: 0, duration: 0.6, ease: EXPO }, 2.6);
      tl.set("#mbadge", { textContent: "13" }, 2.6);

      // cursor drags TES-318 from In progress to In review
      F("#cur", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 2.0);
      F("#cur", { x: 1120, y: 430 }, { x: 1402, y: 292, duration: 0.75, ease: "power2.inOut" }, 2.1);
      tl.set("#k318", { zIndex: 20 }, 2.9);
      tl.to("#k318", { scale: 1.04, rotation: 1.8, boxShadow: "0 14px 30px rgba(30,30,80,0.26)", duration: 0.15, ease: "power2.out" }, 2.9);
      F("#cur", { x: 1402, y: 292 }, { x: 1620, y: 182, duration: 0.6, ease: "power2.inOut" }, 3.0);
      F("#k318", { x: 0, y: 0 }, { x: 218, y: -110, duration: 0.6, ease: "power2.inOut" }, 3.0);
      tl.to("#k316", { y: -110, duration: 0.45, ease: EXPO }, 3.2);
      tl.to(["#k312", "#k309", "#k307"], { y: 110, duration: 0.45, ease: EXPO, stagger: 0.04 }, 3.15);
      tl.to("#k318", { scale: 1, rotation: 0, boxShadow: "0 1px 2px rgba(20,20,30,0.05)", duration: 0.2, ease: "power2.out" }, 3.6);
      tl.set("#cnt1", { textContent: "2" }, 3.6);
      tl.set("#cnt2", { textContent: "4" }, 3.6);
      F("#cur", { x: 1620, y: 182 }, { x: 1760, y: 330, duration: 0.7, ease: "power2.inOut" }, 3.8);
      tl.to("#cur", { opacity: 0, duration: 0.25, ease: "power1.out" }, 4.3);
      tl.to("#toast", { opacity: 0, y: 8, duration: 0.3, ease: "power1.in" }, 5.0);

      // command palette: query typed, caret solid while typing
      tl.set("#pph", { display: "none" }, 4.85);
      for (let i = 0; i < PQ.length; i++) tl.set(".pc2:nth-child(" + (i + 1) + ")", { display: "inline" }, 4.9 + i * 0.075);
      for (let t = 4.4; t < 6.2; t += 0.5) { tl.set("#pcaret", { opacity: 1 }, t); tl.set("#pcaret", { opacity: 0 }, t + 0.25); }

      /* --- 6.2s: chrome leaves, wallpaper washes out to white, everything gathers on the centre --- */
      const CX = 960, CY = 540, T0 = 6.2;
      tl.to("#menubar", { y: -30, opacity: 0, duration: 0.5, ease: "power2.in" }, T0);
      tl.to("#dockbg", { y: 30, opacity: 0, duration: 0.5, ease: "power2.in" }, T0);
      tl.to("#bg", { opacity: 0, duration: 1.0, ease: "power1.inOut" }, T0 + 0.2);
      F("#cam", { scale: 1.035, x: -14, y: -6 }, { scale: 1, x: 0, y: 0, duration: 0.9, ease: "power2.inOut" }, T0);

      PIECES.forEach((p) => {
        if (p.keep === 0) return;
        const dx = CX - (p.l + p.w / 2), dy = CY - (p.t + p.h / 2);
        const s = T0 + p.d, id = "#" + p.id;
        // linear drift downward before the pull starts
        const dp = p.drift ? 34 * (s - 5.0) : 0;
        if (p.drift) F(id, { y: 0 }, { y: dp, duration: s - 5.0, ease: "none" }, 5.0);
        F(id, { x: 0 }, { x: dx, duration: p.dur, ease: p.ex }, s);
        F(id, { y: dp }, { y: dy, duration: p.dur, ease: p.ey }, s);
        F(id, { scale: 1 }, { scale: p.se, duration: p.dur, ease: "power2.in" }, s);
        if (p.rot) F(id, { rotation: 0 }, { rotation: p.rot, duration: p.dur, ease: "power1.in" }, s);
        if (p.seed) tl.set(id, { opacity: 0 }, s + p.dur);
        else tl.to(id, { opacity: 0, duration: p.dur * 0.35, ease: "power1.in" }, s + p.dur * 0.65);
      });

      /* --- icon lands: the dock icon arrives at 54px, the large icon takes over at the same size and rebounds once --- */
      const LAND = T0 + 0.47 + 0.65; // dock Tessel icon arrival, 7.32
      tl.set("#bigicon", { opacity: 1 }, LAND);
      F("#bigicon", { scale: 0.27 }, { scale: 1, duration: 0.65, ease: "back.out(2.1)" }, LAND);
      tl.set("#glow", { opacity: 0.8, scale: 0.4 }, LAND + 0.05);
      tl.to("#glow", { opacity: 0, scale: 1.5, duration: 0.9, ease: "power2.out" }, LAND + 0.05);

      /* --- wordmark pulled out from behind the icon --- */
      F("#bigicon", { x: 237 }, { x: 0, duration: 1.25, ease: EXPO }, 8.05);
      tl.set("#wm", { opacity: 1 }, 8.05);
      F("#wm", { clipPath: "inset(-30px -30px -30px 193px)", filter: "blur(10px)" }, { clipPath: "inset(-30px -30px -30px -44px)", filter: "blur(0px)", duration: 1.25, ease: EXPO }, 8.05);
      F("#tag", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: EXPO }, 8.9);

      // residual push on the hold
      F("#lock", { scale: 1 }, { scale: 1.04, duration: 3.0, ease: "none" }, 7.6);

      tl.set({}, {}, 10.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
