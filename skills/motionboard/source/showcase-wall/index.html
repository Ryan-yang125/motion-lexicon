<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ---------- fonts: OS-bundled ---------- */
      @font-face { font-family: "Didot"; src: local("Didot"); }
      @font-face { font-family: "Bodoni 72"; src: local("Bodoni 72 Book"); }
      @font-face { font-family: "Gill Sans"; src: local("Gill Sans"); }
      @font-face { font-family: "Baskerville"; src: local("Baskerville"); }
      @font-face { font-family: "Iowan Old Style"; src: local("Iowan Old Style Roman"); }
      @font-face { font-family: "DIN Condensed"; src: local("DIN Condensed Bold"); }
      /* ---------- fonts: bundled with this project ---------- */
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif.woff2") format("woff2"); font-style: normal; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); font-style: italic; }
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/fraunces.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/fraunces-italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
      @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/bricolage.woff2") format("woff2"); font-weight: 200 800; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk.woff2") format("woff2"); font-weight: 300 700; }
      @font-face { font-family: "Syne"; src: url("assets/fonts/syne.woff2") format("woff2"); font-weight: 400 800; }
      @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded.woff2") format("woff2"); font-weight: 200 900; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant.woff2") format("woff2"); font-weight: 300 700; font-style: normal; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-italic.woff2") format("woff2"); font-weight: 300 700; font-style: italic; }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/dm-sans.woff2") format("woff2"); font-weight: 100 1000; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0c; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0c;
        font-family: "Inter", system-ui, sans-serif; color: #111; -webkit-font-smoothing: antialiased;
      }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #hold, #push, #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #wall { position: absolute; left: 0; top: 0; width: 2400px; height: 1600px; }
      .ic { display: block; flex: none; }

      /* ---------- wall cards ---------- */
      .card { position: absolute; overflow: hidden; border-radius: 10px; background: #1a1a1c; }
      .site { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; font-family: "Inter", sans-serif; color: #111; }
      .site div, .site span { white-space: nowrap; }
      .ab { position: absolute; }
      .r { display: flex; align-items: center; }
      .cl { display: flex; flex-direction: column; }
      .sb { justify-content: space-between; }
      .cc { justify-content: center; }
      .site .w, .site .w span { white-space: normal; }
      .btn { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
      .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 600; flex: none; }

      /* ---------- font classes (fonts must be declared in CSS rules) ---------- */
      .f-inter { font-family: "Inter", sans-serif; }
      .f-mono { font-family: "JetBrains Mono", monospace; }
      .f-play { font-family: "Playfair Display", serif; }
      .f-gar { font-family: "EB Garamond", serif; }
      .f-osw { font-family: "Oswald", sans-serif; }
      .f-lg { font-family: "League Gothic", sans-serif; }
      .f-arch { font-family: "Archivo Black", sans-serif; }
      .f-mont { font-family: "Montserrat", sans-serif; }
      .f-didot { font-family: "Didot", serif; }
      .f-bod { font-family: "Bodoni 72", serif; }
      .f-gill { font-family: "Gill Sans", sans-serif; }
      .f-bask { font-family: "Baskerville", serif; }
      .f-iowan { font-family: "Iowan Old Style", serif; }
      .f-din { font-family: "DIN Condensed", sans-serif; }
      .f-inst { font-family: "Instrument Serif", serif; }
      .f-frau { font-family: "Fraunces", serif; }
      .f-bric { font-family: "Bricolage Grotesque", sans-serif; }
      .f-sg { font-family: "Space Grotesk", sans-serif; }
      .f-syne { font-family: "Syne", sans-serif; }
      .f-unb { font-family: "Unbounded", sans-serif; }
      .f-corm { font-family: "Cormorant Garamond", serif; }
      .f-dm { font-family: "DM Sans", sans-serif; }

      /* ---------- Orrery template bar ---------- */
      #bar {
        position: absolute; left: 360px; top: 952px; width: 1200px; height: 84px; opacity: 0;
        background: #111113; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 18px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
        display: flex; align-items: center; padding: 0 14px 0 14px; color: #fff; font-family: "Inter", sans-serif;
      }
      #bar .th { width: 56px; height: 56px; border-radius: 10px; overflow: hidden; position: relative; flex: none; background: #15112e; }
      #bar .nm { margin-left: 14px; display: flex; flex-direction: column; gap: 3px; width: 250px; }
      #bar .nm b { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
      #bar .nm span { font-size: 13.5px; color: #9a9aa3; white-space: nowrap; }
      #bar .sep { width: 1px; height: 36px; background: rgba(255, 255, 255, 0.12); margin: 0 22px 0 6px; flex: none; }
      #bar .st { display: flex; align-items: center; gap: 22px; font-size: 14px; color: #c9c9d1; white-space: nowrap; }
      #bar .st span { display: flex; align-items: center; gap: 6px; }
      #bar .st b { color: #fff; font-weight: 600; }
      #bar .bts { margin-left: auto; display: flex; gap: 10px; }
      #bar .b1, #bar .b2 { height: 46px; padding: 0 18px; border-radius: 11px; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
      #bar .b1 { border: 1px solid rgba(255, 255, 255, 0.16); color: #fff; }
      #bar .b2 { background: #fff; color: #111; font-weight: 600; }
      #bar .b2 small { font-size: 15px; font-weight: 500; color: #6b6b73; }

      /* ---------- end card ---------- */
      #dim { background: radial-gradient(ellipse 60% 56% at 50% 48%, rgba(10, 10, 12, 0.95) 0%, rgba(10, 10, 12, 0.89) 58%, rgba(10, 10, 12, 0.78) 100%); opacity: 0; }
      #halo { background: radial-gradient(ellipse 760px 330px at 50% 46%, rgba(10, 10, 12, 0.98) 0%, rgba(10, 10, 12, 0.94) 50%, rgba(10, 10, 12, 0) 100%); opacity: 0; }
      #endwrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #lockup { position: absolute; left: 0; top: 380px; width: 1920px; height: 170px; display: flex; align-items: center; justify-content: center; gap: 34px; }
      #logo { width: 140px; height: 140px; flex: none; }
      #wm { height: 170px; overflow: hidden; font-size: 136px; line-height: 170px; font-weight: 600; letter-spacing: -0.052em; color: #fff; white-space: nowrap; padding-right: 8px; }
      #wm .ch { display: inline-block; }
      #wmsub { position: absolute; left: 0; top: 584px; width: 1920px; text-align: center; font-size: 30px; line-height: 40px; color: #9a9aa4; letter-spacing: -0.01em; white-space: nowrap; }
      #fade { background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11" data-width="1920" data-height="1080">
      <div id="scene" class="clip full" data-start="0" data-duration="11" data-track-index="0" data-layout-allow-overlap>
        <div id="hold">
          <div id="push">
            <div id="cam">
              <div id="wall" data-layout-allow-overlap data-layout-ignore></div>
            </div>
          </div>
        </div>
        <div id="dim" class="full"></div>
        <div id="halo" class="full"></div>
        <div id="bar">
          <div class="th" id="barThumb"></div>
          <div class="nm"><b>Clearbook</b><span>SaaS template by Studio Ferro</span></div>
          <div class="sep"></div>
          <div class="st" id="barStats"></div>
          <div class="bts"><div class="b1" id="barPrev"></div><div class="b2" id="barRemix"></div></div>
        </div>
        <div id="fade" class="full"></div>
      </div>

      <div id="end" class="clip full" data-start="8.25" data-duration="2.75" data-track-index="1">
        <div id="endwrap">
          <div id="lockup"><div id="logo"></div><div id="wm"><span class="ch">O</span><span class="ch">r</span><span class="ch">r</span><span class="ch">e</span><span class="ch">r</span><span class="ch">y</span></div></div>
          <div id="wmsub">4,200 site templates from independent designers</div>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      /* ---------- icons (lucide-style) ---------- */
      const IC = {
        search: '<circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/>',
        user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5v-1a5 5 0 0 1 5-5h5a5 5 0 0 1 5 5v1"/>',
        bag: '<path d="M5.5 7h13l1 13.5h-15z"/><path d="M8.5 9.5V6.5a3.5 3.5 0 0 1 7 0v3"/>',
        chev: '<path d="m6 9 6 6 6-6"/>',
        chevr: '<path d="m9 18 6-6-6-6"/>',
        arrow: '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
        upright: '<path d="M7 17 17 7"/><path d="M8 7h9v9"/>',
        up: '<path d="M12 19V5"/><path d="m6 11 6-6 6 6"/>',
        plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
        check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
        star: '<path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z" fill="currentColor" stroke="none"/>',
        play: '<path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/>',
        pause: '<path d="M8 5v14M16 5v14"/>',
        copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
        home: '<path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11h13V9"/>',
        inbox: '<path d="M3.5 13.5h5l1.5 3h4l1.5-3h5"/><path d="M5.5 5h13l2 8.5V19a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-5.5z"/>',
        check2: '<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12.5 3 3 5-6"/>',
        layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
        list: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
        clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
        chart: '<path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
        file: '<path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/><path d="M14 3.5v5h5"/>',
        users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20v-1a5 5 0 0 0-3-4.6"/>',
        building: '<rect x="5" y="3.5" width="14" height="17" rx="1"/><path d="M9 7.5h2M13 7.5h2M9 11.5h2M13 11.5h2M10 20.5v-4h4v4"/>',
        settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
        bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
        lock: '<rect x="4.5" y="11" width="15" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>',
        globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5z"/>',
        cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
        send: '<path d="M21 3 10.5 13.5"/><path d="m21 3-6.5 18-4-7.5L3 9.5z"/>',
        spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
        heart: '<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 3c0 5.4-7.5 10-7.5 10z"/>',
        card: '<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19M6 15h4"/>',
        swap: '<path d="M7 4 3.5 7.5 7 11"/><path d="M3.5 7.5h14"/><path d="m17 13 3.5 3.5L17 20"/><path d="M20.5 16.5h-14"/>',
        down: '<path d="M12 5v14"/><path d="m6 13 6 6 6-6"/>',
        flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
        pin: '<path d="M19.5 10c0 6-7.5 11.5-7.5 11.5S4.5 16 4.5 10a7.5 7.5 0 0 1 15 0z"/><circle cx="12" cy="10" r="2.5"/>',
        mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
        leaf: '<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19 13 11"/>',
        eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
        repeat: '<path d="m17 2.5 3.5 3.5L17 9.5"/><path d="M3.5 11V10a4 4 0 0 1 4-4h13"/><path d="m7 21.5-3.5-3.5L7 14.5"/><path d="M20.5 13v1a4 4 0 0 1-4 4h-13"/>',
        git: '<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-6 3-10.5 6"/>',
        terminal: '<path d="m5 7 5 5-5 5"/><path d="M12 18h7"/>',
        filter: '<path d="M3.5 5h17l-6.5 8v6l-4-2v-4z"/>',
        more: '<circle cx="5.5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="18.5" cy="12" r="1" fill="currentColor"/>',
        menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
        wifi: '<path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M9 16a4.5 4.5 0 0 1 6 0"/><circle cx="12" cy="19" r=".8" fill="currentColor"/>',
        target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
        bolt: '<path d="M13 2.5 4.5 13.5H12l-1 8 8.5-11H12z"/>',
        shield: '<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2.2 2.2L15.5 10"/>',
      };
      const ic = (n, s, extra) =>
        '<svg class="ic" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"' +
        (extra ? ' style="' + extra + '"' : "") + ">" + IC[n] + "</svg>";
      const av = (t, bg, s, fg) =>
        '<span class="av" style="width:' + s + "px;height:" + s + "px;background:" + bg + ";font-size:" + Math.round(s * 0.4) + "px" + (fg ? ";color:" + fg : "") + '">' + t + "</span>";
      const stars = (n, s, c) => '<span class="r" style="gap:2px;color:' + c + '">' + Array(n).fill(ic("star", s)).join("") + "</span>";
      // absolute block
      const A = (x, y, w, h, st, inner) =>
        '<div class="ab" style="left:' + x + "px;top:" + y + "px;" + (w ? "width:" + w + "px;" : "") + (h ? "height:" + h + "px;" : "") + (st || "") + '">' + (inner || "") + "</div>";

      const SITES = {};

      /* =====================================================================
         HERO: Clearbook, written at full 1920 x 1080 so the push-in lands on real detail
         ===================================================================== */
      const CB_MARK = (s) =>
        '<svg width="' + s + '" height="' + s + '" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#ff6a3d"/><path d="M9 9.5h9.5a4.5 4.5 0 0 1 0 9H9z" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M9 18.5h11a4 4 0 0 1 0 8H9z" fill="#fff"/></svg>';
      SITES.hero = () => {
        const navL = ["Product", "Solutions", "Customers", "Pricing", "Changelog"];
        const side = [
          ["home", "Home"], ["inbox", "Inbox", "4"], ["check2", "Close", "", 1], ["repeat", "Reconciliation"],
          ["list", "Transactions"], ["clock", "Accruals"], ["chart", "Reports"], ["building", "Vendors"],
        ];
        const ent = [["#4f6bed", "Ferro Labs Inc.", "US"], ["#2fa36b", "Ferro Labs Ltd", "UK"], ["#d9822b", "Ferro GmbH", "DE"]];
        const rows = [
          ["Bank rec: Chase operating 4471", "MC", "#8b5cf6", "Maya Chen", "Nov 2", "Done", "$1,284,310.22", 1],
          ["Stripe payouts vs. deferred revenue", "LO", "#0ea5e9", "Liam Ortiz", "Nov 2", "Done", "$412,908.40", 1],
          ["Accrue cloud usage, AWS and GCP", "PS", "#f43f5e", "Priya Shah", "Nov 3", "In review", "$38,120.00", 2],
          ["Prepaid insurance amortization", "DK", "#10b981", "Dan Kowalski", "Nov 3", "In progress", "$4,750.00", 3],
          ["Intercompany: Ferro Ltd to Ferro Inc.", "MC", "#8b5cf6", "Maya Chen", "Nov 3", "Blocked", "$96,400.00", 4],
          ["Payroll journal, October cycle 2", "LO", "#0ea5e9", "Liam Ortiz", "Nov 4", "Not started", "$268,532.18", 5],
        ];
        const pill = {
          1: "background:#e7f6ee;color:#13804b", 2: "background:#efeafe;color:#6d3fd8", 3: "background:#e8f1fd;color:#2563c9",
          4: "background:#fdecec;color:#c13030", 5: "background:#f1f1f3;color:#6b6b76",
        };
        const kpi = [
          ["Tasks complete", "42", " / 48", "87%", "#ff6a3d"],
          ["Auto-reconciled", "91.4%", "", "+6.2 pts vs Sep", "#13804b"],
          ["Open exceptions", "6", "", "2 need approval", "#c27a12"],
          ["Cash variance", "$0.00", "", "All 14 accounts tie out", "#13804b"],
        ];
        return {
          bg: "#15112e",
          html:
            // lighting
            A(0, 0, 1920, 1080, "background:radial-gradient(ellipse 55% 60% at 50% -8%, rgba(132,104,255,.42) 0%, rgba(132,104,255,0) 70%),radial-gradient(ellipse 40% 40% at 50% 100%, rgba(255,106,61,.16) 0%, rgba(255,106,61,0) 70%)") +
            // nav
            A(72, 0, 1776, 80, "", '<div class="r sb" style="height:80px">' +
              '<div class="r" style="gap:56px"><div class="r" style="gap:11px;font-size:22px;font-weight:600;letter-spacing:-.02em;color:#fff">' + CB_MARK(30) + "Clearbook</div>" +
              '<div class="r" style="gap:34px;font-size:15.5px;color:#bdb7dc">' + navL.map((t, i) => '<span class="r" style="gap:4px">' + t + (i < 2 ? ic("chev", 15, "opacity:.6") : "") + "</span>").join("") + "</div></div>" +
              '<div class="r" style="gap:22px;font-size:15.5px;color:#e9e6f7"><span>Sign in</span><span class="btn" style="height:42px;padding:0 18px;border-radius:10px;background:#ff6a3d;color:#fff;font-weight:600">Book a demo</span></div></div>') +
            A(0, 80, 1920, 1, "background:rgba(255,255,255,.07)") +

      }

      /* 0. lockup starts hidden so nothing shows before its entrance */
      tl.set("#wm .ch", { yPercent: 105 }, 0);
      tl.set("#wmsub", { opacity: 0 }, 0);
      tl.set(".pb, #sun", { scale: 0, transformOrigin: "50% 50%" }, 0);
      tl.set("#ring1", { strokeDashoffset: 213.6 }, 0);
      tl.set("#ring2", { strokeDashoffset: 364.5 }, 0);

      /* 1. open from black while the wall is already moving */
      tl.to("#fade", { opacity: 0, duration: 0.5, ease: "power1.out" }, 0);

      /* 2. constant drift up-left and slow scale-up (0 - 5.9) */
      F("#wall", { x: 0, y: 0 }, { x: TX, y: TY, duration: T_DRIFT, ease: "none" }, 0);
      F("#cam", { scale: 1 }, { scale: S_END, duration: T_DRIFT, ease: "none" }, 0);

      /* 3. push into Clearbook (5.35 - 6.0): expo.in acceleration, then a velocity-matched
            cubic ease-out over the last ~5.5 frames so the card lands softly */
      const T_LAND = 6.0, PD = T_LAND - T_PUSH, LA = 0.72;
      const EXPO_END = (10 * Math.LN2) / (1 - Math.pow(2, -10)); // slope of normalized expo.in at p = 1
      const LY = 3 / (3 + EXPO_END * (1 - LA) / LA); // progress at the hand-off, slopes match
      const land = (p) => p < LA
        ? LY * (Math.pow(2, 10 * p / LA - 10) - Math.pow(2, -10)) / (1 - Math.pow(2, -10))
        : LY + (1 - LY) * (1 - Math.pow(1 - (p - LA) / (1 - LA), 3));
      F("#push", { x: 0, y: 0, scale: 1 }, { x: -P * hx, y: -P * hy, scale: P, duration: PD, ease: land }, T_PUSH);
      F("#card-hero", { borderRadius: 10 }, { borderRadius: 0, duration: PD, ease: land }, T_PUSH);

      /* 4. landed: residual slow push, Orrery template bar rises (6.0 - 7.7) */
      const T_BACK = 7.65, BD = 1.0;
      F("#hold", { scale: 1 }, { scale: 1.03, duration: T_BACK - T_LAND, ease: "none" }, T_LAND);
      F("#bar", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: EXPO }, 6.3);
      tl.to("#bar", { opacity: 0, y: 24, duration: 0.3, ease: "power2.in" }, 7.45);

      /* 5. pull back out of Clearbook to the whole wall, which dims and keeps drifting (7.7 - 11) */
      let bx0 = Infinity, bx1 = -Infinity, by0 = -Infinity, by1 = Infinity;
      COLS.forEach(([x, y0, list]) => {
        const y1 = list.reduce((y, [, t]) => y + CH[t] + 22, y0) - 22;
        bx0 = Math.min(bx0, x); bx1 = Math.max(bx1, x + 360); by0 = Math.max(by0, y0); by1 = Math.min(by1, y1);
      });
      const camX = (x) => 960 + S_END * (x + TX - 960), camY = (y) => 540 + S_END * (y + TY - 540);
      const Q = Math.max(1920 / (camX(bx1) - camX(bx0)), 1080 / (camY(by1) - camY(by0)));
      const qx = 960 - Q * (camX(bx0) + camX(bx1)) / 2, qy = 540 - Q * (camY(by0) + camY(by1)) / 2;
      F("#push", { x: -P * hx, y: -P * hy, scale: P }, { x: qx, y: qy, scale: Q, duration: BD, ease: "power3.inOut" }, T_BACK);
      F("#card-hero", { borderRadius: 0 }, { borderRadius: 10, duration: BD, ease: "power3.inOut" }, T_BACK);
      F("#hold", { x: 0, y: 0, scale: 1.03 }, { x: -50, y: -30, scale: 1.075, duration: 11 - T_BACK, ease: "none" }, T_BACK);
      F("#dim", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.inOut" }, 8.0);
      F("#halo", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.inOut" }, 8.1);

      /* 6. Orrery lockup over the dimmed wall (8.3 - 11) */
      F("#ring1", { strokeDashoffset: 213.6 }, { strokeDashoffset: 0, duration: 1.1, ease: EXPO }, 8.3);
      F("#ring2", { strokeDashoffset: 364.5 }, { strokeDashoffset: 0, duration: 1.2, ease: EXPO }, 8.36);
      F("#sun", { scale: 0 }, { scale: 1, duration: 0.7, ease: "back.out(2)", svgOrigin: "70 70" }, 8.3);
      F("#p1", { rotation: -150 }, { rotation: 30, duration: 2.7, ease: "none", svgOrigin: "70 70" }, 8.3);
      F("#p2", { rotation: -70 }, { rotation: 18, duration: 2.7, ease: "none", svgOrigin: "70 70" }, 8.3);
      F("#p3", { rotation: -50 }, { rotation: 12, duration: 2.7, ease: "none", svgOrigin: "70 70" }, 8.3);
      F(".pb", { scale: 0 }, { scale: 1, duration: 0.6, ease: "back.out(2.2)", transformOrigin: "50% 50%", stagger: 0.08 }, 8.55);
      F("#wm .ch", { yPercent: 105 }, { yPercent: 0, duration: 0.9, ease: EXPO, stagger: 0.045 }, 8.4);
      F("#wmsub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: EXPO }, 8.75);
      F("#endwrap", { scale: 1 }, { scale: 1.03, duration: 2.7, ease: "none" }, 8.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
