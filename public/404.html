<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>页面未找到 | Motion Lexicon</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f7;
        --ink: #1d1d1f;
        --dim: #6e6e73;
        --accent: #0a84ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background: var(--bg);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(36rem, 100%);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        margin-bottom: 3rem;
        font-weight: 680;
        letter-spacing: -0.02em;
      }

      .brand img {
        width: 34px;
        height: 34px;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(4.5rem, 16vw, 6rem);
        font-weight: 680;
        line-height: 0.9;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--dim);
      }

      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        border: 0;
        border-radius: 13px;
        padding: 0 1rem;
        color: #ffffff;
        background: var(--accent);
        font-weight: 650;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="/brand/motion-lexicon-mark.svg" alt="" /><span>Motion Lexicon</span></div>
      <h1>404</h1>
      <p id="message">页面未找到。回到 Motion Lexicon 继续浏览。</p>
      <a id="library-link" href="/zh/">返回首页</a>
    </main>
    <script>
      if (window.location.pathname === "/en" || window.location.pathname.startsWith("/en/")) {
        document.documentElement.lang = "en";
        document.title = "Page not found | Motion Lexicon";
        document.getElementById("message").textContent = "This page doesn’t exist. Return to Motion Lexicon.";
        const link = document.getElementById("library-link");
        link.href = "/en/";
        link.textContent = "Back home";
      }
    </script>
  </body>
</html>
