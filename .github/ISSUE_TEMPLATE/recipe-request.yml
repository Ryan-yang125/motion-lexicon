name: Motion Grammar proposal
description: Propose a Product Moment, Motion Primitive, related term, or definition improvement.
title: "[Proposal]: "
labels: [proposal]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Proposal type
      options:
        - Improve an existing definition
        - Add a related term
        - Add a canonical workspace
        - Propose a Product Moment
        - Improve a Motion Primitive
        - Prepare a Motion Director candidate
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: User task
      description: Explain the product state and interface problem this motion helps someone solve.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observable behavior
      description: Describe trigger, state graph, primary actor, supporting actors, beats, direction, timing, interruption, and gesture behavior.
    validations:
      required: true
  - type: textarea
    id: mapping
    attributes:
      label: Canonical mapping
      description: Name related Packs or Primitives, or explain the need for a stable new canonical unit.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility and reduced motion
      description: Describe keyboard behavior and the meaningful reduced-motion state.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References and licenses
      description: Link technical references and identify the license for any proposed asset.
