name: 配方建议
description: 推荐一个宣传片里的镜头，或修正已有配方。
title: "[配方]: "
labels: [recipe]
body:
  - type: input
    id: film
    attributes:
      label: 原片和时间点
      placeholder: Apple · iPhone 17 Pro 发布片 · 1:12–1:18
    validations:
      required: true
  - type: textarea
    id: shot
    attributes:
      label: 镜头怎么动
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 你会怎么叫它
